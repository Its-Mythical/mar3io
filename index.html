        function triggerBlockHit(b) {
            if (b.type === 'note_block') {
                b.bounceY = -10;
                sfx.jump(true);
                addCoin();
                gameState.score += 300;
                spawnParticles(b.x + 16, b.y, '#f472b6', 8, 3.5);
                spawnFloatingText(b.x, b.y - 14, '🎵 NOTE BOOST +300!', '#f472b6');
                updateHUD();
                return;
            }
            if (b.type === 'gem_block' && !b.hit) {
                b.hit = true;
                b.type = 'used';
                b.bounceY = -10;
                sfx.powerupAppear();
                gameState.shakeTimer = 8;
                spawnParticles(b.x + 16, b.y, '#22d3ee', 14, 4.5);
                spawnFloatingText(b.x - 10, b.y - 18, '💎 HIDDEN GEM UNCOVERED!', '#22d3ee');
                items.push({
                    x: b.x + 2,
                    y: b.y - TILE - 4,
                    w: 28,
                    h: 24,
                    baseY: b.y - TILE - 4,
                    vx: 0,
                    vy: 0,
                    timer: 0,
                    type: b.content || 'flappy_gem'
                });
                return;
            }
            if (b.type === 'question' && !b.hit) {
                b.hit = true;
                b.type = 'used';
                b.bounceY = -8;
                if (b.content === 'coin') {
                    sfx.coin();
                    addCoin();
                    gameState.score += 200;
                    spawnFloatingText(b.x, b.y - 12, '+200', '#fef08a');
                    updateHUD();
                } else if (b.content === 'kart_mount') {
                    sfx.kartBoost();
                    items.push({
                        x: b.x + 2, y: b.y - TILE - 2, w: 34, h: 26,
                        vx: 1.2, vy: -3.5,
                        type: 'kart_mount'
                    });
                    spawnFloatingText(b.x - 10, b.y - 16, '🏎️ 2D SUPER KART UNLOCKED!', '#f97316');
                } else if (b.content === 'power') {
                    sfx.powerupAppear();
                    const pType = player.power === 'small' ? 'mushroom' : 'flower';
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: pType === 'mushroom' ? 1.6 : 0, vy: -2,
                        type: pType
                    });
                } else if (b.content === '1up') {
                    sfx.powerupAppear();
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: 1.8, vy: -2.5,
                        type: '1up'
                    });
                } else if (b.content === 'star') {
                    sfx.powerupAppear();
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: 2.2, vy: -5,
                        type: 'star'
                    });
                }
            } else if (b.type === 'brick') {
                b.bounceY = -6;
                if (b.coinsLeft && b.coinsLeft > 0) {
                    b.coinsLeft--;
                    sfx.coin();
                    addCoin();
                    gameState.score += 200;
                    spawnFloatingText(b.x, b.y - 12, '+200', '#fef08a');
                    if (b.coinsLeft === 0) b.type = 'used';
                    updateHUD();
                } else if (player.power !== 'small' || player.groundPounding) {
                    sfx.breakBlock();
                    spawnParticles(b.x + 16, b.y + 16, '#b45309', 10, 4.5);
                    blocks = blocks.filter(blk => blk !== b);
                    gameState.score += 50;
                    updateHUD();
                } else {
                    sfx.bump();
                }
            }
        }

        // Trigger instant Flap / Menu Confirm / Kart Hop when player clicks or presses Space
        function triggerInstantFlapOrAction() {
            sfx.init();
            if (gameState.paused || gameState.isPortraitBlocked) return;

            // 1. MAIN 1985 STARTING UI
            if (gameState.phase === 'title') {
                clampTitleCursor();
                const actionIdx = gameState.titleCursor;

                if (actionIdx === 8 && gameState.previousPhase) {
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.phase = gameState.previousPhase;
                    gameState.previousPhase = null;
                    sfx.coin();
                } else if (actionIdx === 0) {
                    gameState.mapNodeIndex = 0;
                    gameState.phase = 'world_map';
                    sfx.coin();
                } else if (actionIdx === 1) {
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'flappy_collab';
                    gameState.lives = 3;
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.time = 400;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                } else if (actionIdx === 2) {
                    // Open 2D Mario Kart Grand Prix Cup Selection Menu
                    gameState.kartCursor = 0;
                    gameState.phase = 'kart_menu';
                    sfx.coin();
                } else if (actionIdx === 3) {
                    // Open 1985 Character Selection Screen
                    const currentIdx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                    gameState.charCursor = currentIdx >= 0 ? currentIdx : 0;
                    gameState.phase = 'character_select';
                    sfx.coin();
                } else if (actionIdx === 4) {
                    // Open Multiplayer Lobby (Connects ONLY when user wants multiplayer!)
                    gameState.mpCursor = 0;
                    gameState.phase = 'multiplayer_menu';
                    sfx.coin();
                } else if (actionIdx === 5) {
                    gameState.phase = 'trophies';
                    sfx.coin();
                } else if (actionIdx === 6) {
                    gameState.pixelScale = (gameState.pixelScale % 4) + 1;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (actionIdx === 7) {
                    gameState.crtEnabled = !gameState.crtEnabled;
                    document.getElementById('app-root').classList.toggle('crt-off', !gameState.crtEnabled);
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                }
                return;
            }

            // 1A. 2D MARIO KART GRAND PRIX CUP MENU
            if (gameState.phase === 'kart_menu') {
                if (gameState.kartCursor < KART_TRACK_LIST.length) {
                    const chosenTrack = KART_TRACK_LIST[gameState.kartCursor];
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    sfx.powerupCollect();
                    initMarioKartRace(chosenTrack.id);
                } else if (gameState.kartCursor === KART_TRACK_LIST.length) {
                    gameState.kartCC = gameState.kartCC === 100 ? 150 : 100;
                    sfx.coin();
                } else if (gameState.kartCursor === KART_TRACK_LIST.length + 1) {
                    const modes = ['1p_gp', '2p_vs', 'online_gp'];
                    const nextIdx = (modes.indexOf(kartState.raceMode) + 1) % modes.length;
                    kartState.raceMode = modes[nextIdx];
                    if (kartState.raceMode === 'online_gp' && window.mpConnect && !gameState.multiplayerEnabled) {
                        window.mpConnect();
                    }
                    sfx.coin();
                } else {
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 1B. 1985 CHARACTER SELECTION SCREEN
            if (gameState.phase === 'character_select') {
                if (gameState.charCursor < CHARACTER_ROSTER.length) {
                    gameState.selectedCharacter = CHARACTER_ROSTER[gameState.charCursor].id;
                    sfx.powerupCollect();
                    savePlayerProgress();
                } else if (gameState.charCursor === CHARACTER_ROSTER.length) {
                    if (!gameState.metFlappy) {
                        // Flappy has not been introduced yet, so there is nobody
                        // to team up with: the winged solo flight is the only
                        // option available.
                        gameState.collabHero = 'mario';
                        sfx.bump();
                    } else {
                        const curIdx = COLLAB_HERO_MODES.findIndex(m => m.id === gameState.collabHero);
                        gameState.collabHero = COLLAB_HERO_MODES[(curIdx + 1) % COLLAB_HERO_MODES.length].id;
                    }
                    sfx.coin();
                    savePlayerProgress();
                } else {
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 1C. MULTIPLAYER LOBBY UI
            if (gameState.phase === 'multiplayer_menu') {
                const rooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
                if (gameState.mpCursor === 0) {
                    if (gameState.multiplayerEnabled) {
                        if (window.mpDisconnect) window.mpDisconnect();
                    } else {
                        if (window.mpConnect) window.mpConnect();
                    }
                    sfx.coin();
                } else if (gameState.mpCursor === 1) {
                    const idx = (rooms.indexOf(gameState.mpRoom) + 1) % rooms.length;
                    gameState.mpRoom = rooms[idx];
                    if (window.mpSwitchRoom) window.mpSwitchRoom(gameState.mpRoom);
                    sfx.bump();
                } else if (gameState.mpCursor === 2) {
                    if (window.mpConnect && !gameState.multiplayerEnabled) window.mpConnect();
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'classic';
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'playing';
                    sfx.powerupCollect();
                } else if (gameState.mpCursor === 3) {
                    if (window.mpConnect && !gameState.multiplayerEnabled) window.mpConnect();
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'flappy_collab';
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                    sfx.powerupCollect();
                } else if (gameState.mpCursor === 4) {
                    if (window.mpConnect && !gameState.multiplayerEnabled) window.mpConnect();
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    sfx.powerupCollect();
                    initMarioKartRace('circuit');
                } else if (gameState.mpCursor === 5) {
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 2. TROPHIES SCREEN
            if (gameState.phase === 'trophies') {
                gameState.phase = 'title';
                sfx.bump();
                return;
            }

            // 3. WORLD SELECT SCREEN
            if (gameState.phase === 'world_map') {
                if (gameState.mapNodeIndex === OVERWORLD_NODES.length) {
                    gameState.phase = 'title';
                    sfx.bump();
                    return;
                }
                const node = OVERWORLD_NODES[gameState.mapNodeIndex];
                clearInputState();
                gameState.menuConfirmCooldown = 10;
                gameState.previousPhase = null;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                gameState.time = 400;
                if (node.mode === 'meet_flappy') {
                    // Meeting Flappy in the overworld is what earns his help
                    // inside the rift. Stay on the map: this is a conversation,
                    // not a level.
                    gameState.phase = 'world_map';
                    if (!gameState.metFlappy) {
                        gameState.metFlappy = true;
                        gameState.collabHero = 'duo';
                        savePlayerProgress();
                        sfx.oneUp();
                    } else {
                        sfx.bump();
                    }
                    return;
                }
                if (node.mode === 'mario_kart') {
                    sfx.powerupCollect();
                    initMarioKartRace('circuit');
                } else if (node.mode === 'flappy_collab') {
                    // No introduction, no escort: without having met him in the
                    // overworld, Mario crosses the rift alone on his own wings.
                    if (!gameState.metFlappy) {
                        gameState.collabHero = 'mario';
                    }
                    gameState.mode = 'flappy_collab';
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                    sfx.powerupCollect();
                } else {
                    gameState.mode = 'classic';
                    loadLevel(node.id, 'main');
                    gameState.phase = 'playing';
                    sfx.powerupCollect();
                }
                return;
            }

            // 4. COURSE CLEAR SCREEN
            if (gameState.phase === 'course_clear') {
                if (gameState.mode === 'mario_kart') {
                    if (gameState.clearCursor === 0) {
                        const trackIds = KART_TRACK_LIST.map(t => t.id);
                        const nextIdx = (trackIds.indexOf(kartState.trackId) + 1) % trackIds.length;
                        clearInputState();
                        gameState.menuConfirmCooldown = 10;
                        gameState.previousPhase = null;
                        sfx.powerupCollect();
                        initMarioKartRace(trackIds[nextIdx]);
                    } else if (gameState.clearCursor === 1) {
                        gameState.kartCursor = 0;
                        gameState.phase = 'kart_menu';
                        sfx.coin();
                    } else {
                        gameState.titleCursor = 0;
                        gameState.phase = 'title';
                        sfx.bump();
                    }
                    return;
                }

                if (gameState.clearCursor === 0) {
                    const order = ['1-1', '1-2', '1-3', '1-4'];
                    const nextIdx = (order.indexOf(gameState.world) + 1) % order.length;
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.mode = 'classic';
                    gameState.previousPhase = null;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel(order[nextIdx], 'main');
                    gameState.phase = 'playing';
                    sfx.powerupCollect();
                } else if (gameState.clearCursor === 1) {
                    gameState.mapNodeIndex = 0;
                    gameState.phase = 'world_map';
                    sfx.coin();
                } else {
                    gameState.titleCursor = 0;
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 5. GAME OVER SCREEN
            if (gameState.phase === 'gameover') {
                if (gameState.gameOverTimer > 8) {
                    gameState.lives = 3;
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    respawnPlayerFromIntro();
                    if (gameState.mode === 'flappy_collab') {
                        gameState.phase = 'playing';
                        player.vy = -7.6;
                        player.flapAnimTimer = 12;
                        sfx.flap();
                        spawnParticles(player.x, player.y + player.h / 2, '#fef08a', 5, 2.5);
                    }
                }
                return;
            }

            // 6. STAGE INTRO SCREEN
            if (gameState.phase === 'stage_intro') {
                respawnPlayerFromIntro();
                if (gameState.mode === 'flappy_collab') {
                    gameState.phase = 'playing';
                    player.vy = -7.6;
                    player.flapAnimTimer = 12;
                    sfx.flap();
                }
                return;
            }

            if (gameState.phase === 'dying') {
                if (gameState.deathTimer > 45 && gameState.lives > 0) {
                    respawnPlayerFromIntro();
                }
                return;
            }
            if (gameState.phase === 'warping') return;

            if (gameState.phase === 'ready') {
                gameState.phase = 'playing';
                gameState.running = true;
            }

            if (gameState.mode === 'mario_kart') {
                keys.jumpJustPressed = true;
                return;
            }

            if (gameState.mode === 'flappy_collab') {
                const charSpec = getActiveCharacterSpec();
                player.vy = -7.6 * (charSpec.id === 'luigi' ? 1.04 : 1.0);
                player.onGround = false;
                player.groundPounding = false;
                player.flapAnimTimer = 12;
                sfx.flap();
                spawnParticles(player.x - 4, player.y + player.h / 2, '#ffffff', 5, 2.2);

                if (player.power === 'fire' && player.fireCooldown === 0) {
                    player.fireCooldown = 16;
                    fireballs.push({
                        x: player.x + player.w + 4,
                        y: player.y + 12,
                        vx: 8.5,
                        vy: 1.2,
                        w: 10, h: 10,
                        fromBowser: false,
                        bounces: 0
                    });
                }
            } else {
                keys.jumpJustPressed = true;
            }
        }

        // --- 8. MAIN GAME UPDATE LOOP (LOCKED AT 60HZ VIA FIXED TIMESTEP) ---
        function update() {
            if (!gameState.running || gameState.paused || gameState.isPortraitBlocked) return;

            if (gameState.menuConfirmCooldown > 0) {
                gameState.menuConfirmCooldown--;
                keys.jumpJustPressed = false;
                keys.dashJustPressed = false;
                keys.downJustPressed = false;
            }

            if (gameState.score > gameState.topScore) {
                gameState.topScore = gameState.score;
                savePlayerProgress();
            }

            if (gameState.achievementBanner) {
                gameState.achievementBanner.timer--;
                if (gameState.achievementBanner.timer <= 0) {
                    gameState.achievementBanner = null;
                }
            }

            sfx.updateBGM(gameState.phase, gameState.mode, gameState.world, gameState.subArea, player.starTimer > 0);

            if (gameState.shakeTimer > 0) gameState.shakeTimer--;

            // 0. CLASSIC 1985 STARTING UI & SUB-MENUS
            if (
                gameState.phase === 'title' ||
                gameState.phase === 'world_map' ||
                gameState.phase === 'kart_menu' ||
                gameState.phase === 'character_select' ||
                gameState.phase === 'multiplayer_menu' ||
                gameState.phase === 'trophies' ||
                gameState.phase === 'course_clear'
            ) {
                if (!gameState.previousPhase && gameState.phase !== 'course_clear' && gameState.mode !== 'mario_kart') {
                    player.animTimer++;
                    player.x = 88 + Math.sin(player.animTimer * 0.03) * 28;
                    player.y = 12 * TILE - player.h;
                    player.onGround = true;
                    player.facing = Math.cos(player.animTimer * 0.03) >= 0 ? 1 : -1;
                    player.leanAngle = 0;
                }
                return;
            }

            // 0B. 2D MARIO KART GRAND PRIX MODE UPDATE
            if (gameState.mode === 'mario_kart' && gameState.phase === 'playing') {
                updateMarioKart();
                return;
            }

            // 1. OG MARIO DEATH ANIMATION SEQUENCE
            if (gameState.phase === 'dying') {
                gameState.deathTimer++;
                if (gameState.deathTimer === 18) {
                    player.vy = -9.5;
                } else if (gameState.deathTimer > 18) {
                    player.vy += 0.48;
                    player.y += player.vy;
                }
                if (gameState.deathTimer > 85) {
                    savePlayerProgress();
                    if (window.queueCompactCloudSync) window.queueCompactCloudSync(true);
                    if (gameState.lives <= 0) {
                        gameState.phase = 'gameover';
                        gameState.gameOverTimer = 0;
                        sfx.gameOverJingle();
                    } else {
                        gameState.phase = 'stage_intro';
                        gameState.stageIntroTimer = 0;
                    }
                    updateHUD();
                }
                return;
            }

            // 2. OG MARIO BLACK-SCREEN GAME OVER SCENE
            if (gameState.phase === 'gameover') {
                gameState.gameOverTimer++;
                return;
            }

            // 3. OG MARIO STAGE INTRO ("WORLD 1-1 / MARIO x 2")
            if (gameState.phase === 'stage_intro') {
                gameState.stageIntroTimer++;
                if (gameState.stageIntroTimer > 65) {
                    respawnPlayerFromIntro();
                }
                return;
            }

            // 4. DIMENSIONAL GEM WARP PORTAL ANIMATION
            if (gameState.phase === 'warping') {
                gameState.warpTimer++;
                player.y -= 1.2;
                player.leanAngle += 0.25;
                if (gameState.warpTimer % 4 === 0) {
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#22d3ee', 6, 4);
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                if (gameState.warpTimer > 52) {
                    gameState.mode = gameState.warpTargetMode;
                    if (gameState.mode === 'flappy_collab') {
                        loadLevel('1-1', 'main');
                        gameState.phase = 'ready';
                        spawnFloatingText(player.x, player.y - 24, 'WELCOME TO FLAPPY UNIVERSE!', '#22d3ee');
                    } else {
                        loadLevel('1-1', 'main', 14 * TILE, 6 * TILE);
                        gameState.phase = 'playing';
                        player.invincibleTimer = 90;
                        spawnFloatingText(player.x, player.y - 24, 'RETURNED TO MARIO WORLD!', '#4ade80');
                    }
                    updateHUD();
                }
                return;
            }

            // 5. READY STATE
            if (gameState.phase === 'ready') {
                player.animTimer++;
                if (gameState.mode === 'flappy_collab') {
                    player.y = 210 + Math.sin(player.animTimer * 0.08) * 10;
                    player.flapAnimTimer = (Math.floor(player.animTimer / 8) % 2 === 0) ? 5 : 0;
                    player.leanAngle = 0.18 + Math.sin(player.animTimer * 0.08) * 0.05;
                }
                if (keys.jumpJustPressed || keys.dashJustPressed || keys.left || keys.right) {
                    triggerInstantFlapOrAction();
                }
                keys.jumpJustPressed = false;
                keys.dashJustPressed = false;
                keys.downJustPressed = false;
                return;
            }

            // Level Complete / Flagpole Sequence
            if (gameState.flagSlide) {
                if (player.y < 12 * TILE - player.h) {
                    player.y += 4;
                    gameState.flagY = Math.min(11 * TILE, gameState.flagY + 4);
                } else {
                    gameState.levelCompleteTimer++;
                    if (gameState.levelCompleteTimer > 40) {
                        gameState.flagSlide = false;
                        gameState.clearHeadline = `WORLD ${gameState.world} CLEAR!`;
                        gameState.clearCursor = 0;
                        savePlayerProgress();
                        if (window.queueCompactCloudSync) window.queueCompactCloudSync(true);
                        gameState.phase = 'course_clear';
                    }
                }
                return;
            }

            // Timer countdown
            gameState.timeCounter++;
            if (gameState.timeCounter >= 40) {
                gameState.timeCounter = 0;
                if (gameState.time > 0) {
                    gameState.time--;
                    if (gameState.time === 0) {
                        hurtPlayer(true);
                        return;
                    }
                }
            }

            // Update Moving Platforms
            movingPlatforms.forEach(mp => {
                const prevX = mp.x;
                mp.x += mp.vx;
                if (mp.x < mp.minX || mp.x > mp.maxX) mp.vx *= -1;
                const deltaX = mp.x - prevX;
                if (
                    player.onGround &&
                    player.x + player.w > mp.x &&
                    player.x < mp.x + mp.w &&
                    Math.abs((player.y + player.h) - mp.y) <= 4
                ) {
                    player.x += deltaX;
                }
            });

            // Update Oscillating Warp Pipes in Flappy's Universe
            if (gameState.mode === 'flappy_collab') {
                pipes.forEach(p => {
                    if (p.oscillate) {
                        p.oscPhase += p.oscSpeed;
                        const offset = Math.round(Math.sin(p.oscPhase) * p.oscAmp);
                        if (p.inverted) {
                            p.h = Math.max(40, p.baseH + offset);
                        } else {
                            p.y = p.baseY + offset;
                            p.h = Math.max(40, p.groundY - p.y);
                        }
                    }
                });
            }

            // Block bounce recovery
            blocks.forEach(b => {
                if (b.bounceY < 0) b.bounceY += 1.5;
                if (b.bounceY > 0) b.bounceY = 0;
            });

            // Update Player Invincibility / Cooldowns
            if (player.invincibleTimer > 0) player.invincibleTimer--;
            if (player.starTimer > 0) {
                player.starTimer--;
                if (player.starTimer === 0) updateHUD();
            }
            if (player.fireCooldown > 0) player.fireCooldown--;
            if (player.flapAnimTimer > 0) player.flapAnimTimer--;

            // Secret Warp Pipe check
            if (keys.down && player.onGround && gameState.mode !== 'flappy_collab') {
                for (const p of pipes) {
                    if (p.warpTo && player.x + player.w > p.x + 6 && player.x < p.x + p.w - 6 && Math.abs((player.y + player.h) - p.y) < 6) {
                        sfx.pipe();
                        loadLevel(p.warpTo.world, p.warpTo.subArea, p.warpTo.x, p.warpTo.y);
                        return;
                    }
                }
            }

            // Mid-Stage Checkpoint Flag Check
            if (checkpointFlag && !checkpointFlag.activated && rectOverlap(player, checkpointFlag)) {
                checkpointFlag.activated = true;
                gameState.checkpointX = checkpointFlag.x;
                gameState.checkpointY = checkpointFlag.y - 8;
                sfx.checkpoint();
                gameState.score += 500;
                spawnParticles(checkpointFlag.x + 10, checkpointFlag.y, '#4ade80', 12, 4);
                spawnFloatingText(checkpointFlag.x, checkpointFlag.y - 14, '🚩 CHECKPOINT SAVED!', '#4ade80');
            }

            // Flagpole & World 1-2 / 1-4 Axe Goal Check
            if (flagpole && player.x + player.w >= flagpole.x + 8 && !gameState.flagSlide) {
                sfx.stageClear();
                gameState.flagSlide = true;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                gameState.score += 2000;
                savePlayerProgress();
                spawnFloatingText(player.x, player.y, 'STAGE CLEAR +2000!', '#4ade80');
                updateHUD();
                return;
            }
            if (axeObj && rectOverlap(player, axeObj)) {
                sfx.stageClear();
                gameState.score += 5000;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                blocks = blocks.filter(b => b.type !== 'bridge');
                enemies.forEach(e => {
                    if (e.type === 'bowser') {
                        e.dead = true;
                        unlockAchievement('bowserSlayer');
                    }
                    if (e.type === 'mecha_flappy') {
                        e.dead = true;
                        unlockAchievement('mechaSlayer');
                    }
                });
                axeObj = null;
                savePlayerProgress();
                const bossName = gameState.world === '1-4' ? 'MECHA-FLAPPY' : 'BOWSER';
                spawnFloatingText(player.x, player.y, `${bossName} DEFEATED +5000!`, '#facc15');
                updateHUD();
                setTimeout(() => {
                    gameState.clearHeadline = `${bossName} DEFEATED!`;
                    gameState.clearCursor = 0;
                    gameState.phase = 'course_clear';
                }, 1200);
            }

            const charSpec = getActiveCharacterSpec();

            // Horizontal Movement
            if (gameState.mode === 'flappy_collab') {
                const baseScroll = 3.3 + Math.min(1.8, gameState.pipesPassed * 0.04);
                player.vx = player.dashTimer > 0 ? 7.8 : baseScroll;
                player.facing = 1;

                // Spawn new Flappy-Mario pipe chunks ahead infinitely
                while (gameState.nextFlappyX < gameState.cameraX + canvas.width + 360) {
                    const nextIdx = Math.floor(gameState.nextFlappyX / 260);
                    spawnFlappyChunk(gameState.nextFlappyX, nextIdx);
                    gameState.nextFlappyX += 260;
                }

                // Cull off-screen blocks, pipes, items, skyRings, and bypassed enemies behind camera!
                const cullX = gameState.cameraX - 240;
                blocks = blocks.filter(b => b.x + b.w > cullX);
                pipes = pipes.filter(p => p.x + p.w > cullX);
                items = items.filter(it => it.x + it.w > cullX);
                skyRings = skyRings.filter(sr => sr.x + sr.w > cullX && !sr.collected);
                enemies = enemies.filter(en => en.x + en.w > cullX);
            } else {
                const kartSpeedBoost = player.inKart ? 1.32 : 1.0;
                const maxSpeed = (keys.dash ? 5.6 : 4.1) * charSpec.speedMul * kartSpeedBoost;
                const accel = (player.onGround ? 0.42 : 0.28) * charSpec.speedMul * kartSpeedBoost;
                const friction = player.onGround ? (player.inKart ? 0.90 : 0.82) : 0.93;

                if (!player.groundPounding) {
                    if (keys.left) {
                        player.vx = Math.max(player.vx - accel, -maxSpeed);
                        player.facing = -1;
                    } else if (keys.right) {
                        player.vx = Math.min(player.vx + accel, maxSpeed);
                        player.facing = 1;
                    } else {
                        player.vx *= friction;
                        if (Math.abs(player.vx) < 0.08) player.vx = 0;
                    }
                }
            }

            // 2.0 Air Dash & Fireball Action (X / Shift / B button)
            if (keys.dashJustPressed) {
                if (player.power === 'fire' && player.fireCooldown === 0) {
                    sfx.fireball();
                    player.fireCooldown = 18;
                    fireballs.push({
                        x: player.facing === 1 ? player.x + player.w : player.x - 10,
                        y: player.y + 14,
                        vx: player.facing * 7.5,
                        vy: 2,
                        w: 10, h: 10,
                        fromBowser: false,
                        bounces: 0
                    });
                } else if (gameState.moves20 && (gameState.mode === 'flappy_collab' || (!player.onGround && player.canAirDash)) && player.dashTimer === 0) {
                    sfx.dash();
                    player.canAirDash = false;
                    player.dashTimer = charSpec.id === 'wario' ? 13 : 10;
                    player.vx = player.facing * (charSpec.id === 'wario' ? 9.2 : 8.5);
                    player.vy = 0;
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#38bdf8', 8, 3);
                }
            }

            // 2.0 Ground Pound (Down in Mid-Air)
            if (gameState.moves20 && keys.downJustPressed && !player.onGround && !player.groundPounding) {
                player.groundPounding = true;
                if (gameState.mode !== 'flappy_collab') player.vx = 0;
                player.vy = 10.5;
                sfx.stomp();
            }

            // Gravity & Dash handling
            if (player.dashTimer > 0) {
                player.dashTimer--;
                player.vy = 0;
                player.trail.push({ x: player.x, y: player.y, h: player.h, alpha: 0.6 });
            } else if (gameState.mode === 'flappy_collab') {
                player.vy = Math.min(player.vy + 0.42 * charSpec.gravityMul, 9.5);
            } else {
                const gravity = ((keys.jump && player.vy < 0) ? 0.34 : 0.62) * charSpec.gravityMul;
                player.vy = Math.min(player.vy + gravity, 12);
            }

            // Fade dash afterimages
            for (let i = player.trail.length - 1; i >= 0; i--) {
                player.trail[i].alpha -= 0.08;
                if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
            }

            // Coyote timer
            if (player.onGround) {
                player.coyoteTimer = 7;
                player.canAirDash = true;
            } else if (player.coyoteTimer > 0) {
                player.coyoteTimer--;
            }

            // Jump / Flap & 2.0 Wall-Jump
            if (keys.jumpJustPressed) {
                if (gameState.mode === 'flappy_collab') {
                    triggerInstantFlapOrAction();
                } else if (player.coyoteTimer > 0) {
                    player.vy = -10.8 * charSpec.jumpMul;
                    player.onGround = false;
                    player.coyoteTimer = 0;
                    sfx.jump(player.power !== 'small');
                } else if (gameState.moves20 && player.wallSliding !== 0) {
                    player.vy = -10.2 * charSpec.jumpMul;
                    player.vx = -player.wallSliding * 6.2;
                    player.facing = -player.wallSliding;
                    player.wallSliding = 0;
                    sfx.jump(true);
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 6, 2.5);
                }
            }

            // Keep Mario inside top screen boundary in Flappy Collab
            if (gameState.mode === 'flappy_collab' && player.y < 4) {
                player.y = 4;
                player.vy = 0;
            }

            // Move & Collide X
            const obstacles = getSolidObstacles();
            player.x += player.vx;
            if (player.x < gameState.cameraX) {
                player.x = gameState.cameraX;
                player.vx = 0;
            }

            player.wallSliding = 0;
            for (let i = 0; i < obstacles.length; i++) {
                const ob = obstacles[i];
                if (rectOverlap(player, ob)) {
                    if (gameState.mode === 'flappy_collab' && pipes.includes(ob)) {
                        if (player.starTimer > 0) {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            gameState.score += 500;
                            spawnFloatingText(player.x, player.y, 'STAR SMASH +500!', '#facc15');
                            continue;
                        } else if (player.invincibleTimer > 0) {
                            continue;
                        } else if (player.power !== 'small') {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            hurtPlayer(false);
                            continue;
                        } else {
                            hurtPlayer(true);
                            return;
                        }
                    }

                    if (player.vx > 0) {
                        player.x = ob.x - player.w;
                        if (!player.onGround && keys.right) {
                            player.wallSliding = 1;
                        }
                    } else if (player.vx < 0) {
                        player.x = ob.x + ob.w;
                        if (!player.onGround && keys.left) player.wallSliding = -1;
                    }
                    if (gameState.mode !== 'flappy_collab') player.vx = 0;
                }
            }

            // Slow descent during 2.0 Wall Slide
            if (gameState.moves20 && player.wallSliding !== 0 && player.vy > 1.8) {
                player.vy = 1.8;
            }

            // Move & Collide Y
            player.y += player.vy;
            player.onGround = false;
            let hitCeilingBlock = false;

            for (let i = 0; i < obstacles.length; i++) {
                const ob = obstacles[i];
                if (rectOverlap(player, ob)) {
                    if (gameState.mode === 'flappy_collab' && pipes.includes(ob)) {
                        if (player.starTimer > 0) {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            continue;
                        } else if (player.invincibleTimer > 0) {
                            continue;
                        } else if (player.power !== 'small') {
                            sfx.breakBlock();
                            pipes = pipes.filter(p => p !== ob);
                            hurtPlayer(false);
                            continue;
                        } else {
                            hurtPlayer(true);
                            return;
                        }
                    }

                    if (player.vy > 0) {
                        player.y = ob.y - player.h;
                        if (ob.type === 'note_block') {
                            player.vy = -9.6;
                            player.onGround = false;
                            player.canAirDash = true;
                            triggerBlockHit(ob);
                        } else {
                            player.vy = 0;
                            player.onGround = true;
                        }
                        gameState.comboCount = 0;

                        if (player.groundPounding) {
                            player.groundPounding = false;
                            gameState.shakeTimer = 8;
                            spawnParticles(player.x + player.w / 2, player.y + player.h, '#facc15', 10, 4);
                            if (ob.type === 'brick' || ob.type === 'question' || ob.type === 'gem_block' || ob.type === 'note_block') {
                                triggerBlockHit(ob);
                            }
                        }
                    } else if (player.vy < 0) {
                        player.y = ob.y + ob.h;
                        player.vy = 0;
                        if (!hitCeilingBlock) {
                            hitCeilingBlock = true;
                            if (ob.type === 'question' || ob.type === 'brick' || ob.type === 'gem_block' || ob.type === 'note_block') {
                                triggerBlockHit(ob);
                            } else {
                                sfx.bump();
                            }
                        }
                    }
                }
            }

            // Ambient sparkles on Hidden Gem Blocks
            if (player.animTimer % 18 === 0) {
                blocks.forEach(b => {
                    if (b.type === 'gem_block' && Math.abs(b.x - player.x) < 420) {
                        spawnParticles(b.x + 16, b.y + 8, '#22d3ee', 2, 1.4);
                    }
                });
            }

            // Golden Sky Rings in Flappy's Universe
            for (let i = skyRings.length - 1; i >= 0; i--) {
                const sr = skyRings[i];
                if (!sr.collected && rectOverlap(player, sr)) {
                    sr.collected = true;
                    sfx.coin();
                    addCoin();
                    gameState.score += 500;
                    player.canAirDash = true;
                    spawnParticles(sr.x + 12, sr.y + 22, '#facc15', 10, 4);
                    spawnFloatingText(sr.x, sr.y, '⭕ SKY RING +500!', '#facc15');
                    skyRings.splice(i, 1);
                }
            }

            // Score Flappy Pipe Gates Passed!
            if (gameState.mode === 'flappy_collab') {
                pipes.forEach(p => {
                    if (p.flappyGate && !p.passed && player.x > p.x + p.w) {
                        p.passed = true;
                        gameState.pipesPassed++;
                        if (gameState.pipesPassed >= 10) unlockAchievement('pipeAce');
                        if (gameState.pipesPassed > gameState.bestPipes) {
                            gameState.bestPipes = gameState.pipesPassed;
                            savePlayerProgress();
                        }
                        gameState.score += 500;
                        sfx.pipePass();
                        spawnFloatingText(player.x, player.y - 16, `PIPE #${gameState.pipesPassed}!`, '#4ade80');
                        updateHUD();
                    }
                });
            }

            // Periodic Bullet Bill Spawner in World 1-3, 1-4 & high-score Flappy Universe
            if ((gameState.world === '1-3' || gameState.world === '1-4' || (gameState.mode === 'flappy_collab' && gameState.pipesPassed >= 6)) && player.animTimer % 210 === 0) {
                sfx.cannon();
                enemies.push(createEnemy('bullet_bill', gameState.cameraX + canvas.width + 40, Math.max(72, Math.min(310, player.y + (Math.random() * 80 - 40)))));
            }

            // Dynamic Lean Angle
            let targetLean = 0;
            if (gameState.mode === 'flappy_collab') {
                targetLean = Math.max(-0.26, Math.min(0.75, 0.20 + player.vy * 0.055));
                if (player.dashTimer > 0) targetLean = 0.40;
            } else {
                const speedRatio = Math.min(1, Math.abs(player.vx) / 4.1);
                targetLean = speedRatio * 0.14 + (player.dashTimer > 0 ? 0.20 : 0);
            }
            player.leanAngle += (targetLean - player.leanAngle) * 0.28;

            // Camera Smooth Scroll
            if (gameState.mode === 'flappy_collab') {
                const camLead = Math.min(160, Math.floor(canvas.width * 0.24));
                const targetCam = player.x - camLead;
                if (targetCam > gameState.cameraX) {
                    gameState.cameraX += (targetCam - gameState.cameraX) * 0.6;
                }
            } else {
                const targetCam = Math.max(0, player.x - Math.floor(canvas.width * 0.35));
                gameState.cameraX += (targetCam - gameState.cameraX) * 0.22;
            }

            // Check Bottom Pit / Lava Fall
            if (player.y > canvas.height + 30) {
                hurtPlayer(true);
                return;
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                if (it.type === 'flappy_gem' || it.type === 'return_gem') {
                    it.timer = (it.timer || 0) + 0.1;
                    it.y = (it.baseY ?? it.y) + Math.sin(it.timer) * 6;
                    if (Math.floor(it.timer * 10) % 6 === 0) {
                        spawnParticles(it.x + 14, it.y + 12, '#e879f9', 1, 1.5);
                    }
                } else if (it.type !== 'static_coin' && it.type !== 'flower') {
                    it.vy = Math.min(it.vy + 0.45, 8);
                    it.x += it.vx;
                    for (const ob of obstacles) {
                        if (rectOverlap(it, ob)) {
                            if (it.vx > 0) it.x = ob.x - it.w;
                            else it.x = ob.x + ob.w;
                            it.vx *= -1;
                        }
                    }
                    it.y += it.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(it, ob)) {
                            if (it.vy > 0) {
                                it.y = ob.y - it.h;
                                it.vy = it.type === 'star' ? -6.5 : 0;
                            } else {
                                it.y = ob.y + ob.h;
                                it.vy = 0;
                            }
                        }
                    }
                }

                if (rectOverlap(player, it)) {
                    if (it.type === 'flappy_gem') {
                        gameState.gemsFound++;
                        unlockAchievement('firstGem');
                        gameState.score += 2500;
                        savePlayerProgress();
                        if (player.power === 'small') player.setPower('super');
                        spawnFloatingText(it.x, it.y - 12, '💎 WARPING TO FLAPPY UNIVERSE! +2500', '#22d3ee');
                        items.splice(i, 1);
                        startDimensionalWarp('flappy_collab');
                        updateHUD();
                        return;
                    } else if (it.type === 'return_gem') {
                        gameState.gemsFound++;
                        unlockAchievement('firstGem');
                        gameState.score += 3000;
                        savePlayerProgress();
                        player.setPower('fire');
                        player.starTimer = 360;
                        spawnFloatingText(it.x, it.y - 12, '💎 PORTAL BACK TO MARIO WORLD! +3000', '#e879f9');
                        items.splice(i, 1);
                        startDimensionalWarp('classic');
                        updateHUD();
                        return;
                    } else if (it.type === 'static_coin') {
                        sfx.coin();
                        addCoin();
                        gameState.score += 200;
                        spawnFloatingText(it.x, it.y, '+200', '#fef08a');
                    } else if (it.type === '1up') {
                        sfx.oneUp();
                        gameState.lives++;
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, '🍄 1-UP!', '#4ade80');
                    } else if (it.type === 'kart_mount') {
                        sfx.kartBoost();
                        player.inKart = true;
                        if (player.power === 'small') player.setPower('super');
                        gameState.score += 1500;
                        spawnParticles(player.x + 14, player.y + 20, '#f97316', 12, 4);
                        spawnFloatingText(it.x, it.y - 10, `🏎️ ${charSpec.name} KART OVERDRIVE!`, '#f97316');
                    } else if (it.type === 'mushroom') {
                        sfx.powerupCollect();
                        player.setPower('super');
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, `SUPER ${charSpec.name}!`, '#4ade80');
                    } else if (it.type === 'flower') {
                        sfx.powerupCollect();
                        player.setPower('fire');
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, `FIRE ${charSpec.name}!`, '#f97316');
                    } else if (it.type === 'star') {
                        sfx.powerupCollect();
                        player.starTimer = 480;
                        gameState.score += 1500;
                        spawnFloatingText(it.x, it.y, '⭐ STAR POWER!', '#facc15');
                    }
                    items.splice(i, 1);
                    updateHUD();
                }
            }

            // Update Fireballs
            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.x += fb.vx;
                fb.y += fb.vy;
                if (!fb.fromBowser) {
                    fb.vy += 0.35;
                    for (const ob of obstacles) {
                        if (rectOverlap(fb, ob)) {
                            fb.y = ob.y - fb.h;
                            fb.vy = -4.8;
                            fb.bounces++;
                        }
                    }
                    for (const en of enemies) {
                        if (!en.dead && en.state !== 'squashed' && rectOverlap(fb, en)) {
                            sfx.stomp();
                            if (en.type === 'bowser' || en.type === 'mecha_flappy') {
                                en.hp--;
                                spawnParticles(fb.x, fb.y, '#f97316', 6, 3);
                                if (en.hp <= 0) {
                                    en.dead = true;
                                    if (en.type === 'bowser') unlockAchievement('bowserSlayer');
                                    if (en.type === 'mecha_flappy') unlockAchievement('mechaSlayer');
                                    gameState.score += 5000;
                                    spawnFloatingText(en.x, en.y, 'BOSS KO +5000!', '#facc15');
                                }
                            } else {
                                en.dead = true;
                                gameState.score += 200;
                                spawnFloatingText(en.x, en.y, '+200', '#fef08a');
                            }
                            fireballs.splice(i, 1);
                            updateHUD();
                            break;
                        }
                    }
                } else {
                    if (rectOverlap(fb, player)) {
                        hurtPlayer(false);
                        fireballs.splice(i, 1);
                        continue;
                    }
                }

                if (fb.bounces > 4 || Math.abs(fb.x - player.x) > 700) {
                    fireballs.splice(i, 1);
                }
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                if (en.dead) {
                    en.y += 6;
                    if (en.y > canvas.height + 100) enemies.splice(i, 1);
                    continue;
                }
                if (en.state === 'squashed') {
                    en.squashTimer--;
                    if (en.squashTimer <= 0) enemies.splice(i, 1);
                    continue;
                }

                if (Math.abs(en.x - player.x) > 650) continue;

                if (en.type === 'bullet_bill') {
                    en.x += en.vx;
                } else if (en.type === 'mecha_flappy') {
                    en.timer++;
                    en.x += en.vx;
                    if (gameState.mode !== 'flappy_collab' && (en.x < 67 * TILE || en.x > 76 * TILE)) en.vx *= -1;
                    en.flyPhase += 0.06;
                    en.y = en.baseY + Math.sin(en.flyPhase) * 44;
                    if (en.timer % 85 === 0) {
                        sfx.fireball();
                        fireballs.push({
                            x: en.x - 10, y: en.y + 20,
                            vx: -5.2, vy: 1.2, w: 14, h: 14,
                            fromBowser: true, bounces: 0
                        });
                    }
                    if (gameState.mode !== 'flappy_collab' && en.timer % 160 === 0) {
                        sfx.cannon();
                        enemies.push(createEnemy('bullet_bill', en.x - 16, en.y + 12));
                    }
                } else if (en.type === 'hammer_bro') {
                    en.timer++;
                    if (en.timer % 80 === 0 && en.vy === 0) en.vy = -7.2;
                    if (en.timer % 95 === 0) {
                        sfx.jump(false);
                        fireballs.push({
                            x: en.x, y: en.y - 6,
                            vx: (player.x < en.x ? -1 : 1) * 3.8,
                            vy: -6.5,
                            w: 14, h: 16,
                            fromBowser: true,
                            isHammer: true,
                            bounces: 0
                        });
                    }
                    en.vy = Math.min(en.vy + 0.4, 8);
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob) && en.vy > 0) {
                            en.y = ob.y - en.h;
                            en.vy = 0;
                        }
                    }
                } else if (en.flying) {
                    en.x += en.vx;
                    en.flyPhase += 0.07;
                    en.y = en.baseY + Math.sin(en.flyPhase) * 32;
                } else if (en.type === 'piranha') {
                    const dist = Math.abs((player.x + player.w / 2) - (en.x + 16));
                    if (dist > 48 || en.y < en.baseY - 4) {
                        en.timer += 0.04;
                    }
                    const offset = Math.sin(en.timer) * 28;
                    en.y = en.baseY - Math.max(0, offset);
                } else if (en.type === 'bowser') {
                    en.timer++;
                    en.x += en.vx;
                    if (en.x < 67 * TILE || en.x > 75 * TILE) en.vx *= -1;
                    if (en.timer % 95 === 0) en.vy = -7.5;
                    if (en.timer % 110 === 0) {
                        sfx.fireball();
                        fireballs.push({
                            x: en.x - 12, y: en.y + 16,
                            vx: -4.8, vy: 0, w: 16, h: 12,
                            fromBowser: true, bounces: 0
                        });
                    }
                    en.vy = Math.min(en.vy + 0.35, 8);
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            en.y = ob.y - en.h;
                            en.vy = 0;
                        }
                    }
                } else {
                    en.vy = Math.min(en.vy + 0.5, 9);
                    en.x += en.vx;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            if (en.vx > 0) en.x = ob.x - en.w;
                            else en.x = ob.x + ob.w;
                            en.vx *= -1;
                        }
                    }
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            if (en.vy > 0) {
                                en.y = ob.y - en.h;
                                en.vy = 0;
                            }
                        }
                    }

                    if (en.state === 'shell_moving') {
                        for (const other of enemies) {
                            if (other !== en && !other.dead && rectOverlap(en, other)) {
                                other.dead = true;
                                sfx.stomp();
                                gameState.score += 300;
                                spawnFloatingText(other.x, other.y, '+300', '#38bdf8');
                            }
                        }
                    }
                }

                // Player vs Enemy Collision
                if (rectOverlap(player, en)) {
                    if (player.starTimer > 0) {
                        sfx.stomp();
                        en.dead = true;
                        gameState.score += 200;
                        spawnFloatingText(en.x, en.y, 'STAR KO +200!', '#facc15');
                        updateHUD();
                        continue;
                    }
                    const stompFromAbove = player.vy > 0 && (player.y + player.h - player.vy) <= en.y + 18 && en.type !== 'piranha';
                    if (stompFromAbove) {
                        sfx.stomp();
                        player.vy = -8.2 * charSpec.jumpMul;
                        player.groundPounding = false;
                        gameState.comboCount = (gameState.comboCount || 0) + 1;
                        const comboBonus = Math.min(2000, gameState.comboCount * 200);
                        if (en.flying && en.type !== 'bullet_bill' && en.type !== 'mecha_flappy') {
                            en.flying = false;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `WINGS LOST +${comboBonus}!`, '#fef08a');
                        } else if (en.type === 'bullet_bill' || en.type === 'hammer_bro') {
                            en.dead = true;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `STOMP +${comboBonus}!`, '#4ade80');
                        } else if (en.type === 'goomba') {
                            en.state = 'squashed';
                            en.squashTimer = 20;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `+${comboBonus}`, '#fef08a');
                        } else if (en.type === 'koopa') {
                            if (en.state === 'walk') {
                                en.state = 'shell_idle';
                                en.vx = 0;
                                en.h = 26;
                            } else if (en.state === 'shell_idle') {
                                en.state = 'shell_moving';
                                en.vx = player.facing * 8.5;
                            } else {
                                en.state = 'shell_idle';
                                en.vx = 0;
                            }
                            gameState.score += comboBonus;
                        } else if (en.type === 'bowser' || en.type === 'mecha_flappy') {
                            en.hp--;
                            spawnParticles(en.x + en.w / 2, en.y, '#facc15', 10, 4);
                            spawnFloatingText(en.x, en.y - 10, `BOSS HIT! (${en.hp} HP)`, '#f87171');
                            if (en.hp <= 0) {
                                en.dead = true;
                                if (en.type === 'bowser') unlockAchievement('bowserSlayer');
                                if (en.type === 'mecha_flappy') unlockAchievement('mechaSlayer');
                                gameState.score += 5000;
                            }
                        }
                        updateHUD();
                    } else if (en.type === 'koopa' && en.state === 'shell_idle') {
                        sfx.stomp();
                        en.state = 'shell_moving';
                        en.vx = (player.x < en.x ? 1 : -1) * 8.5;
                    } else {
                        hurtPlayer(false);
                    }
                }
            }

            // Update Particles & Floating Score Popups (capped to prevent buildup)
            if (particles.length > 120) {
                particles.splice(0, particles.length - 120);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.1;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Update & Interpolate Remote Multiplayer Peers ONLY if Multiplayer is enabled
            if (gameState.multiplayerEnabled) {
                const nowMs = Date.now();
                Object.keys(remotePlayers).forEach(uid => {
                    const rp = remotePlayers[uid];
                    if (nowMs - (rp.updatedAt || 0) > 20000) {
                        delete remotePlayers[uid];
                        return;
                    }
                    rp.renderX = rp.renderX !== undefined ? rp.renderX + (rp.x - rp.renderX) * 0.35 : rp.x;
                    rp.renderY = rp.renderY !== undefined ? rp.renderY + (rp.y - rp.renderY) * 0.35 : rp.y;
                    rp.animTimer = (rp.animTimer || 0) + 1;

                    const sameStage = rp.mode === gameState.mode && (gameState.mode === 'flappy_collab' || (rp.world === gameState.world && rp.subArea === gameState.subArea));
                    if (sameStage && rp.phase === 'playing' && gameState.phase === 'playing' && player.vy > 0) {
                        const rpBox = { x: rp.renderX, y: rp.renderY, w: 26, h: rp.power === 'small' ? 30 : 40 };
                        if (rectOverlap(player, rpBox) && (player.y + player.h - player.vy) <= rpBox.y + 14) {
                            player.vy = -10.5 * charSpec.jumpMul;
                            player.canAirDash = true;
                            sfx.stomp();
                            gameState.score += 100;
                            spawnParticles(player.x + player.w / 2, player.y + player.h, '#4ade80', 8, 3);
                            spawnFloatingText(player.x, player.y - 12, 'CO-OP BOOST +100!', '#4ade80');
                        }
                    }
                });

                if (window.mpBroadcastState) {
                    window.mpBroadcastState();
                }
            }

            // Reset single-frame key triggers
            keys.jumpJustPressed = false;
            keys.dashJustPressed = false;
            keys.downJustPressed = false;
            player.animTimer++;
        }

        function hurtPlayer(instantKill) {
            if (gameState.phase === 'dying' || gameState.phase === 'gameover') return;
            if (!instantKill && (player.invincibleTimer > 0 || player.starTimer > 0)) return;

            if (!instantKill && player.inKart) {
                sfx.spinOut();
                player.inKart = false;
                player.invincibleTimer = 95;
                gameState.shakeTimer = 10;
                spawnParticles(player.x + 14, player.y + 16, '#f97316', 12, 4.5);
                spawnFloatingText(player.x, player.y, '🏎️ KART EJECTED!', '#facc15');
                return;
            }

            if (!instantKill && player.power !== 'small') {
                sfx.pipe();
                player.setPower('small');
                player.invincibleTimer = gameState.selectedCharacter === 'wario' ? 115 : 90;
                gameState.shakeTimer = 10;
                spawnFloatingText(player.x, player.y, 'POWER DOWN!', '#f87171');
            } else {
                sfx.die();
                clearInputState();
                player.power = 'small';
                player.groundPounding = false;
                player.dashTimer = 0;
                gameState.lives = Math.max(0, gameState.lives - 1);
                gameState.phase = 'dying';
                gameState.deathTimer = 0;
                gameState.shakeTimer = 14;
                player.vx = 0;
                player.vy = 0;
                savePlayerProgress();
                updateHUD();
            }
        }
