                        gameState.score += 500;
                        sfx.pipePass();
                        spawnFloatingText(player.x, player.y - 16, `PIPE #${gameState.pipesPassed}!`, '#4ade80');
                        updateHUD();
                    }
                });
            }

            // Periodic Bullet Bill Spawner in World 1-3, 1-4 & high-score Flappy Universe
            if ((gameState.world === '1-3' || gameState.world === '1-4' || (gameState.mode === 'flappy_collab' && gameState.pipesPassed >= 6)) && player.animTimer % 210 === 0) {
                sfx.cannon();
                enemies.push(createEnemy('bullet_bill', gameState.cameraX + canvas.width + 40, Math.max(72, Math.min(310, player.y + (Math.random() * 80 - 40)))));
            }

            // Dynamic Lean Angle
            let targetLean = 0;
            if (gameState.mode === 'flappy_collab') {
                targetLean = Math.max(-0.26, Math.min(0.75, 0.20 + player.vy * 0.055));
                if (player.dashTimer > 0) targetLean = 0.40;
            } else {
                const speedRatio = Math.min(1, Math.abs(player.vx) / 4.1);
                targetLean = speedRatio * 0.14 + (player.dashTimer > 0 ? 0.20 : 0);
            }
            player.leanAngle += (targetLean - player.leanAngle) * 0.28;

            // Camera Smooth Scroll
            if (gameState.mode === 'flappy_collab') {
                const camLead = Math.min(160, Math.floor(canvas.width * 0.24));
                const targetCam = player.x - camLead;
                if (targetCam > gameState.cameraX) {
                    gameState.cameraX += (targetCam - gameState.cameraX) * 0.6;
                }
            } else {
                const targetCam = Math.max(0, player.x - Math.floor(canvas.width * 0.35));
                gameState.cameraX += (targetCam - gameState.cameraX) * 0.22;
            }

            // Check Bottom Pit / Lava Fall
            if (player.y > canvas.height + 30) {
                hurtPlayer(true);
                return;
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                if (it.type === 'flappy_gem' || it.type === 'return_gem') {
                    it.timer = (it.timer || 0) + 0.1;
                    it.y = (it.baseY ?? it.y) + Math.sin(it.timer) * 6;
                    if (Math.floor(it.timer * 10) % 6 === 0) {
                        spawnParticles(it.x + 14, it.y + 12, '#e879f9', 1, 1.5);
                    }
                } else if (it.type !== 'static_coin' && it.type !== 'flower') {
                    it.vy = Math.min(it.vy + 0.45, 8);
                    it.x += it.vx;
                    for (const ob of obstacles) {
                        if (rectOverlap(it, ob)) {
                            if (it.vx > 0) it.x = ob.x - it.w;
                            else it.x = ob.x + ob.w;
                            it.vx *= -1;
                        }
                    }
                    it.y += it.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(it, ob)) {
                            if (it.vy > 0) {
                                it.y = ob.y - it.h;
                                it.vy = it.type === 'star' ? -6.5 : 0;
                            } else {
                                it.y = ob.y + ob.h;
                                it.vy = 0;
                            }
                        }
                    }
                }

                if (rectOverlap(player, it)) {
                    if (it.type === 'flappy_gem') {
                        gameState.gemsFound++;
                        unlockAchievement('firstGem');
                        gameState.score += 2500;
                        savePlayerProgress();
                        if (player.power === 'small') player.setPower('super');
                        spawnFloatingText(it.x, it.y - 12, '💎 WARPING TO FLAPPY UNIVERSE! +2500', '#22d3ee');
                        items.splice(i, 1);
                        startDimensionalWarp('flappy_collab');
                        updateHUD();
                        return;
                    } else if (it.type === 'return_gem') {
                        gameState.gemsFound++;
                        unlockAchievement('firstGem');
                        gameState.score += 3000;
                        savePlayerProgress();
                        player.setPower('fire');
                        player.starTimer = 360;
                        spawnFloatingText(it.x, it.y - 12, '💎 PORTAL BACK TO MARIO WORLD! +3000', '#e879f9');
                        items.splice(i, 1);
                        startDimensionalWarp('classic');
                        updateHUD();
                        return;
                    } else if (it.type === 'static_coin') {
                        sfx.coin();
                        addCoin();
                        gameState.score += 200;
                        spawnFloatingText(it.x, it.y, '+200', '#fef08a');
                    } else if (it.type === '1up') {
                        sfx.oneUp();
                        gameState.lives++;
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, '🍄 1-UP!', '#4ade80');
                    } else if (it.type === 'mushroom') {
                        sfx.powerupCollect();
                        player.setPower('super');
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, `SUPER ${charSpec.name}!`, '#4ade80');
                    } else if (it.type === 'flower') {
                        sfx.powerupCollect();
                        player.setPower('fire');
                        gameState.score += 1000;
                        spawnFloatingText(it.x, it.y, `FIRE ${charSpec.name}!`, '#f97316');
                    } else if (it.type === 'star') {
                        sfx.powerupCollect();
                        player.starTimer = 480;
                        gameState.score += 1500;
                        spawnFloatingText(it.x, it.y, '⭐ STAR POWER!', '#facc15');
                    }
                    items.splice(i, 1);
                    updateHUD();
                }
            }

            // Update Fireballs
            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.x += fb.vx;
                fb.y += fb.vy;
                if (!fb.fromBowser) {
                    fb.vy += 0.35;
                    for (const ob of obstacles) {
                        if (rectOverlap(fb, ob)) {
                            fb.y = ob.y - fb.h;
                            fb.vy = -4.8;
                            fb.bounces++;
                        }
                    }
                    for (const en of enemies) {
                        if (!en.dead && en.state !== 'squashed' && rectOverlap(fb, en)) {
                            sfx.stomp();
                            if (en.type === 'bowser' || en.type === 'mecha_flappy') {
                                en.hp--;
                                spawnParticles(fb.x, fb.y, '#f97316', 6, 3);
                                if (en.hp <= 0) {
                                    en.dead = true;
                                    if (en.type === 'bowser') unlockAchievement('bowserSlayer');
                                    if (en.type === 'mecha_flappy') unlockAchievement('mechaSlayer');
                                    gameState.score += 5000;
                                    spawnFloatingText(en.x, en.y, 'BOSS KO +5000!', '#facc15');
                                }
                            } else {
                                en.dead = true;
                                gameState.score += 200;
                                spawnFloatingText(en.x, en.y, '+200', '#fef08a');
                            }
                            fireballs.splice(i, 1);
                            updateHUD();
                            break;
                        }
                    }
                } else {
                    if (rectOverlap(fb, player)) {
                        hurtPlayer(false);
                        fireballs.splice(i, 1);
                        continue;
                    }
                }

                if (fb.bounces > 4 || Math.abs(fb.x - player.x) > 700) {
                    fireballs.splice(i, 1);
                }
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const en = enemies[i];
                if (en.dead) {
                    en.y += 6;
                    if (en.y > canvas.height + 100) enemies.splice(i, 1);
                    continue;
                }
                if (en.state === 'squashed') {
                    en.squashTimer--;
                    if (en.squashTimer <= 0) enemies.splice(i, 1);
                    continue;
                }

                if (Math.abs(en.x - player.x) > 650) continue;

                if (en.type === 'bullet_bill') {
                    en.x += en.vx;
                } else if (en.type === 'mecha_flappy') {
                    en.timer++;
                    en.x += en.vx;
                    if (gameState.mode !== 'flappy_collab' && (en.x < 67 * TILE || en.x > 76 * TILE)) en.vx *= -1;
                    en.flyPhase += 0.06;
                    en.y = en.baseY + Math.sin(en.flyPhase) * 44;
                    if (en.timer % 85 === 0) {
                        sfx.fireball();
                        fireballs.push({
                            x: en.x - 10, y: en.y + 20,
                            vx: -5.2, vy: 1.2, w: 14, h: 14,
                            fromBowser: true, bounces: 0
                        });
                    }
                    if (gameState.mode !== 'flappy_collab' && en.timer % 160 === 0) {
                        sfx.cannon();
                        enemies.push(createEnemy('bullet_bill', en.x - 16, en.y + 12));
                    }
                } else if (en.type === 'hammer_bro') {
                    en.timer++;
                    if (en.timer % 80 === 0 && en.vy === 0) en.vy = -7.2;
                    if (en.timer % 95 === 0) {
                        sfx.jump(false);
                        fireballs.push({
                            x: en.x, y: en.y - 6,
                            vx: (player.x < en.x ? -1 : 1) * 3.8,
                            vy: -6.5,
                            w: 14, h: 16,
                            fromBowser: true,
                            isHammer: true,
                            bounces: 0
                        });
                    }
                    en.vy = Math.min(en.vy + 0.4, 8);
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob) && en.vy > 0) {
                            en.y = ob.y - en.h;
                            en.vy = 0;
                        }
                    }
                } else if (en.flying) {
                    en.x += en.vx;
                    en.flyPhase += 0.07;
                    en.y = en.baseY + Math.sin(en.flyPhase) * 32;
                } else if (en.type === 'piranha') {
                    const dist = Math.abs((player.x + player.w / 2) - (en.x + 16));
                    if (dist > 48 || en.y < en.baseY - 4) {
                        en.timer += 0.04;
                    }
                    const offset = Math.sin(en.timer) * 28;
                    en.y = en.baseY - Math.max(0, offset);
                } else if (en.type === 'bowser') {
                    en.timer++;
                    en.x += en.vx;
                    if (en.x < 67 * TILE || en.x > 75 * TILE) en.vx *= -1;
                    if (en.timer % 95 === 0) en.vy = -7.5;
                    if (en.timer % 110 === 0) {
                        sfx.fireball();
                        fireballs.push({
                            x: en.x - 12, y: en.y + 16,
                            vx: -4.8, vy: 0, w: 16, h: 12,
                            fromBowser: true, bounces: 0
                        });
                    }
                    en.vy = Math.min(en.vy + 0.35, 8);
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            en.y = ob.y - en.h;
                            en.vy = 0;
                        }
                    }
                } else {
                    en.vy = Math.min(en.vy + 0.5, 9);
                    en.x += en.vx;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            if (en.vx > 0) en.x = ob.x - en.w;
                            else en.x = ob.x + ob.w;
                            en.vx *= -1;
                        }
                    }
                    en.y += en.vy;
                    for (const ob of obstacles) {
                        if (rectOverlap(en, ob)) {
                            if (en.vy > 0) {
                                en.y = ob.y - en.h;
                                en.vy = 0;
                            }
                        }
                    }

                    if (en.state === 'shell_moving') {
                        for (const other of enemies) {
                            if (other !== en && !other.dead && rectOverlap(en, other)) {
                                other.dead = true;
                                sfx.stomp();
                                gameState.score += 300;
                                spawnFloatingText(other.x, other.y, '+300', '#38bdf8');
                            }
                        }
                    }
                }

                // Player vs Enemy Collision
                if (rectOverlap(player, en)) {
                    if (player.starTimer > 0) {
                        sfx.stomp();
                        en.dead = true;
                        gameState.score += 200;
                        spawnFloatingText(en.x, en.y, 'STAR KO +200!', '#facc15');
                        updateHUD();
                        continue;
                    }
                    const stompFromAbove = player.vy > 0 && (player.y + player.h - player.vy) <= en.y + 18 && en.type !== 'piranha';
                    if (stompFromAbove) {
                        sfx.stomp();
                        player.vy = -8.2 * charSpec.jumpMul;
                        player.groundPounding = false;
                        gameState.comboCount = (gameState.comboCount || 0) + 1;
                        const comboBonus = Math.min(2000, gameState.comboCount * 200);
                        if (en.flying && en.type !== 'bullet_bill' && en.type !== 'mecha_flappy') {
                            en.flying = false;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `WINGS LOST +${comboBonus}!`, '#fef08a');
                        } else if (en.type === 'bullet_bill' || en.type === 'hammer_bro') {
                            en.dead = true;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `STOMP +${comboBonus}!`, '#4ade80');
                        } else if (en.type === 'goomba') {
                            en.state = 'squashed';
                            en.squashTimer = 20;
                            gameState.score += comboBonus;
                            spawnFloatingText(en.x, en.y, `+${comboBonus}`, '#fef08a');
                        } else if (en.type === 'koopa') {
                            if (en.state === 'walk') {
                                en.state = 'shell_idle';
                                en.vx = 0;
                                en.h = 26;
                            } else if (en.state === 'shell_idle') {
                                en.state = 'shell_moving';
                                en.vx = player.facing * 8.5;
                            } else {
                                en.state = 'shell_idle';
                                en.vx = 0;
                            }
                            gameState.score += comboBonus;
                        } else if (en.type === 'bowser' || en.type === 'mecha_flappy') {
                            en.hp--;
                            spawnParticles(en.x + en.w / 2, en.y, '#facc15', 10, 4);
                            spawnFloatingText(en.x, en.y - 10, `BOSS HIT! (${en.hp} HP)`, '#f87171');
                            if (en.hp <= 0) {
                                en.dead = true;
                                if (en.type === 'bowser') unlockAchievement('bowserSlayer');
                                if (en.type === 'mecha_flappy') unlockAchievement('mechaSlayer');
                                gameState.score += 5000;
                            }
                        }
                        updateHUD();
                    } else if (en.type === 'koopa' && en.state === 'shell_idle') {
                        sfx.stomp();
                        en.state = 'shell_moving';
                        en.vx = (player.x < en.x ? 1 : -1) * 8.5;
                    } else {
                        hurtPlayer(false);
                    }
                }
            }

            // Update Particles & Floating Score Popups (capped to prevent buildup)
            if (particles.length > 120) {
                particles.splice(0, particles.length - 120);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 1.1;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Update & Interpolate Remote Multiplayer Peers ONLY if Multiplayer is enabled
            if (gameState.multiplayerEnabled) {
                const nowMs = Date.now();
                Object.keys(remotePlayers).forEach(uid => {
                    const rp = remotePlayers[uid];
                    if (nowMs - (rp.updatedAt || 0) > 20000) {
                        delete remotePlayers[uid];
                        return;
                    }
                    rp.renderX = rp.renderX !== undefined ? rp.renderX + (rp.x - rp.renderX) * 0.35 : rp.x;
                    rp.renderY = rp.renderY !== undefined ? rp.renderY + (rp.y - rp.renderY) * 0.35 : rp.y;
                    rp.animTimer = (rp.animTimer || 0) + 1;

                    const sameStage = rp.mode === gameState.mode && (gameState.mode === 'flappy_collab' || (rp.world === gameState.world && rp.subArea === gameState.subArea));
                    if (sameStage && rp.phase === 'playing' && gameState.phase === 'playing' && player.vy > 0) {
                        const rpBox = { x: rp.renderX, y: rp.renderY, w: 26, h: rp.power === 'small' ? 30 : 40 };
                        if (rectOverlap(player, rpBox) && (player.y + player.h - player.vy) <= rpBox.y + 14) {
                            player.vy = -10.5 * charSpec.jumpMul;
                            player.canAirDash = true;
                            sfx.stomp();
                            gameState.score += 100;
                            spawnParticles(player.x + player.w / 2, player.y + player.h, '#4ade80', 8, 3);
                            spawnFloatingText(player.x, player.y - 12, 'CO-OP BOOST +100!', '#4ade80');
                        }
                    }
                });

                if (window.mpBroadcastState) {
                    window.mpBroadcastState();
                }
            }

            // Reset single-frame key triggers
            keys.jumpJustPressed = false;
            keys.dashJustPressed = false;
            keys.downJustPressed = false;
            player.animTimer++;
        }

        function hurtPlayer(instantKill) {
            if (gameState.phase === 'dying' || gameState.phase === 'gameover') return;
            if (!instantKill && (player.invincibleTimer > 0 || player.starTimer > 0)) return;

            if (!instantKill && player.power !== 'small') {
                sfx.pipe();
                player.setPower('small');
                player.invincibleTimer = gameState.selectedCharacter === 'wario' ? 115 : 90;
                gameState.shakeTimer = 10;
                spawnFloatingText(player.x, player.y, 'POWER DOWN!', '#f87171');
            } else {
                sfx.die();
                clearInputState();
                player.power = 'small';
                player.groundPounding = false;
                player.dashTimer = 0;
                gameState.lives = Math.max(0, gameState.lives - 1);
                gameState.phase = 'dying';
                gameState.deathTimer = 0;
                gameState.shakeTimer = 14;
                player.vx = 0;
                player.vy = 0;
                savePlayerProgress();
                updateHUD();
            }
        }

        // --- 9. RENDER ENGINE ---
        function drawClassicNESStatusBar() {
            const w = canvas.width;
            const isCompact = w < 480;
            const fontSize = isCompact ? 8 : 10;
            const charSpec = getActiveCharacterSpec();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
            ctx.fillRect(0, 0, w, isCompact ? 34 : 38);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, isCompact ? 34 : 38, w, 2);

            ctx.font = `bold ${fontSize}px "Press Start 2P", monospace`;
            ctx.textAlign = 'left';

            const col1 = 12;
            const col2 = Math.floor(w * 0.25);
            const col3 = Math.floor(w * 0.45);
            const col4 = Math.floor(w * 0.65);

            // HERO NAME / SCORE
            ctx.fillStyle = charSpec.color;
            ctx.fillText(charSpec.name, col1, 14);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(String(gameState.score).padStart(6, '0'), col1, 29);

            // COINS + LIVES
            ctx.fillStyle = '#facc15';
            ctx.fillText(`🪙×${String(gameState.coins).padStart(2, '0')}`, col2, 14);
            ctx.fillStyle = '#f87171';
            ctx.fillText(`♥×${gameState.lives}`, col2, 29);

            // WORLD / PIPES
            ctx.fillStyle = '#fc9838';
            ctx.fillText(gameState.mode === 'flappy_collab' ? 'PIPES' : 'WORLD', col3, 14);
            ctx.fillStyle = '#ffffff';
            const worldStr = gameState.mode === 'flappy_collab'
                ? `${gameState.pipesPassed}/${gameState.bestPipes}`
                : (gameState.subArea === 'underground' ? `${gameState.world}B` : gameState.world);
            ctx.fillText(worldStr, col3, 29);

            // TIME
            ctx.fillStyle = '#fc9838';
            ctx.fillText('TIME', col4, 14);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(String(gameState.time).padStart(3, '0'), col4, 29);

            // Multiplayer status is ONLY shown when player turns on Online Sync in Multiplayer Lobby!
            if (gameState.multiplayerEnabled) {
                const peerCount = Object.keys(remotePlayers).length + 1;
                ctx.textAlign = 'right';
                ctx.fillStyle = '#4ade80';
                ctx.fillText(`🟢${gameState.mpRoom} (${peerCount}P)`, w - 10, 14);
                ctx.fillStyle = '#38bdf8';
                ctx.font = `${Math.max(6, fontSize - 2)}px "Press Start 2P", monospace`;
                ctx.fillText(`ID:${gameState.mpUserId}`, w - 10, 29);
                ctx.textAlign = 'left';
            }
        }

        function drawRetroTitleOverlay() {
            const cx = Math.floor(canvas.width / 2);
            const isCompact = canvas.width < 460;
            const boardW = Math.min(436, canvas.width - 24);
            const boardH = isCompact ? 100 : 112;
            const boardX = cx - Math.floor(boardW / 2);
            const boardY = 38;
            const charSpec = getActiveCharacterSpec();

            // Classic 1985 Brick-Orange Title Signboard with 3D Drop Shadow
            ctx.fillStyle = '#000000';
            ctx.fillRect(boardX + 6, boardY + 6, boardW, boardH);
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(boardX, boardY, boardW, boardH);

            ctx.strokeStyle = '#fcBCB0';
            ctx.lineWidth = 4;
            ctx.strokeRect(boardX + 4, boardY + 4, boardW - 8, boardH - 8);

            let mainHeading = 'SUPER MARIO';
            let subHeading = `HERO: ${charSpec.name} • BEST PIPES: ${gameState.bestPipes}`;
            let footerHint = gameState.previousPhase
                ? 'GAME PAUSED • PRESS ESC TO RESUME OR CHANGE SETTINGS'
                : 'FIND THE HIDDEN 💎 GEM IN 1-1 TO WARP DIMENSIONS!';

            if (gameState.phase === 'world_map') {
                subHeading = '🗺️ SELECT YOUR WORLD STAGE';
                footerHint = 'CLICK ANY STAGE OR PRESS ENTER TO PLAY!';
            } else if (gameState.phase === 'character_select') {
                const previewIdx = Math.min(CHARACTER_ROSTER.length - 1, gameState.charCursor);
                const previewHero = CHARACTER_ROSTER[previewIdx] || charSpec;
                subHeading = `🎭 HERO SELECT: ${previewHero.name}`;
                footerHint = previewHero.desc;
            } else if (gameState.phase === 'multiplayer_menu') {
                const peerCount = Object.keys(remotePlayers).length + (gameState.multiplayerEnabled ? 1 : 0);
                subHeading = `🌐 ONLINE CO-OP • ${gameState.mpStatus} (${peerCount}P)`;
                footerHint = gameState.multiplayerEnabled ? `YOUR ID: ${gameState.mpUserId}` : 'OFFLINE BY DEFAULT TO SAVE DATA • CLICK TO CONNECT';
            } else if (gameState.phase === 'trophies') {
                subHeading = '🏆 8-BIT HALL OF TROPHIES';
                footerHint = `SAVED LOCALLY + FIREBASE CLOUD (${gameState.cloudSyncStatus})`;
            } else if (gameState.phase === 'course_clear') {
                mainHeading = gameState.clearHeadline || 'COURSE CLEAR!';
                subHeading = `SCORE: ${String(gameState.score).padStart(6, '0')} • COINS: ${gameState.coins}`;
                footerHint = 'CHOOSE YOUR NEXT DESTINATION BELOW';
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#000000';
            ctx.font = `bold ${isCompact ? 15 : 20}px "Press Start 2P", monospace`;
            ctx.fillText(mainHeading, cx + 3, boardY + (isCompact ? 32 : 36) + 3);
            ctx.fillStyle = '#fcBCB0';
            ctx.fillText(mainHeading, cx, boardY + (isCompact ? 32 : 36));

            if (subHeading) {
                ctx.fillStyle = '#000000';
                ctx.font = `bold ${isCompact ? 8 : 9.5}px "Press Start 2P", monospace`;
                ctx.fillText(subHeading, cx + 2, boardY + (isCompact ? 56 : 62) + 2);
                ctx.fillStyle = '#facc15';
                ctx.fillText(subHeading, cx, boardY + (isCompact ? 56 : 62));
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = `${isCompact ? 6.2 : 7.2}px "Press Start 2P", monospace`;
            ctx.fillText(footerHint, cx, boardY + boardH - 12);

            // Draw Character Preview Sprite inside Signboard when in Character Select!
            if (gameState.phase === 'character_select') {
                const previewIdx = Math.min(CHARACTER_ROSTER.length - 1, gameState.charCursor);
                const previewHero = CHARACTER_ROSTER[previewIdx] || charSpec;
                const sprSet = getCharacterSprites(previewHero.id);
                const bounce = Math.floor(Date.now() / 180) % 2 === 0 ? sprSet.idle : sprSet.jump;
                ctx.drawImage(bounce, boardX + boardW - 44, boardY + 14, 28, 32);
            }

            const menuY = boardY + boardH + (isCompact ? 14 : 18);
            const rowStep = isCompact ? 16 : 17;
            const menuBoxW = Math.min(416, canvas.width - 18);

            let rows = [];
            let activeCursor = 0;

            if (gameState.phase === 'title') {
                const scaleNames = { 1: '1X HD', 2: '2X NES', 3: '3X DAMPY', 4: '4X PEXL' };
                const onlineCount = Object.keys(remotePlayers).length + (gameState.multiplayerEnabled ? 1 : 0);
                rows = [
                    { label: '1 PLAYER GAME (SELECT WORLD)', color: '#ffffff' },
                    { label: 'FLAPPY UNIVERSE GAUNTLET', color: '#22d3ee' },
                    { label: `CHARACTER SELECT < ${charSpec.name} >`, color: '#facc15' },
                    { label: `MULTIPLAYER LOBBY (${gameState.multiplayerEnabled ? onlineCount + 'P LIVE' : 'OFFLINE'})`, color: gameState.multiplayerEnabled ? '#4ade80' : '#94a3b8' },
                    { label: '8-BIT TROPHIES & MEDALS', color: '#ffffff' },
                    { label: `GRAPHICS: < ${scaleNames[gameState.pixelScale]} >`, color: '#38bdf8' },
                    { label: `CRT SCANLINES: < ${gameState.crtEnabled ? 'ON' : 'OFF'} >`, color: '#38bdf8' }
                ];
                if (gameState.previousPhase) {
                    rows.push({ label: 'RESUME CURRENT GAME [ESC]', color: '#4ade80' });
                }
                clampTitleCursor();
                activeCursor = gameState.titleCursor;
            } else if (gameState.phase === 'character_select') {
                const wingMode = COLLAB_HERO_MODES.find(m => m.id === gameState.collabHero) || COLLAB_HERO_MODES[0];
                rows = CHARACTER_ROSTER.map(c => ({
                    label: `${gameState.selectedCharacter === c.id ? '★ ' : ''}${c.title}`,
                    color: gameState.selectedCharacter === c.id ? '#4ade80' : c.color
                }));
                rows.push({
                    label: `FLAPPY STYLE: < ${wingMode.label} >`,
                    color: '#22d3ee'
                });
                rows.push({ label: '◀ BACK TO STARTING MENU', color: '#94a3b8' });
                activeCursor = gameState.charCursor;
            } else if (gameState.phase === 'multiplayer_menu') {
                const peerCount = Object.keys(remotePlayers).length + (gameState.multiplayerEnabled ? 1 : 0);
                rows = [
                    { label: `ONLINE SYNC: < ${gameState.multiplayerEnabled ? 'ON (LIVE)' : 'OFF (LOCAL ONLY)'} >`, color: gameState.multiplayerEnabled ? '#4ade80' : '#f87171' },
                    { label: `ROOM CHANNEL: < ${gameState.mpRoom} (${peerCount}P) >`, color: '#38bdf8' },
                    { label: '▶ PLAY CO-OP WORLD 1-1', color: '#facc15' },
                    { label: '▶ PLAY CO-OP FLAPPY UNIVERSE', color: '#22d3ee' },
                    { label: '◀ BACK TO STARTING MENU', color: '#94a3b8' }
                ];
                activeCursor = gameState.mpCursor;
            } else if (gameState.phase === 'world_map') {
                rows = OVERWORLD_NODES.map(n => ({
                    label: n.name,
                    color: n.color
                }));
                rows.push({ label: '◀ BACK TO STARTING MENU', color: '#94a3b8' });
                activeCursor = gameState.mapNodeIndex;
            } else if (gameState.phase === 'trophies') {
                rows = TROPHY_LIST.map(t => {
                    const unlocked = gameState.achievements[t.key];
                    return {
                        label: `${unlocked ? '★' : '🔒'} ${t.title}`,
                        color: unlocked ? '#4ade80' : '#64748b'
                    };
                });
                rows.push({ label: '◀ BACK TO STARTING MENU', color: '#facc15' });
                activeCursor = rows.length - 1;
            } else if (gameState.phase === 'course_clear') {
                rows = [
                    { label: '▶ PLAY NEXT WORLD STAGE', color: '#4ade80' },
                    { label: '🗺️ SELECT WORLD STAGE', color: '#ffffff' },
                    { label: '☰ BACK TO STARTING MENU', color: '#94a3b8' }
                ];
                activeCursor = gameState.clearCursor;
            }

            const boxH = rows.length * rowStep + 18;

            menuHitBounds = {
                menuY,
                rowStep,
                boxLeft: cx - menuBoxW / 2,
                boxRight: cx + menuBoxW / 2,
                rowCount: rows.length
            };

            ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            ctx.fillRect(cx - menuBoxW / 2, menuY - 15, menuBoxW, boxH);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(cx - menuBoxW / 2, menuY - 15, menuBoxW, boxH);

            rows.forEach((row, idx) => {
                const oy = menuY + idx * rowStep;
                const selected = activeCursor === idx;
                ctx.fillStyle = selected ? '#facc15' : row.color;
                ctx.font = `${isCompact ? 6.5 : 7.8}px "Press Start 2P", monospace`;
                ctx.fillText(selected ? `🍄 ${row.label}` : `   ${row.label}`, cx, oy);
            });

            ctx.fillStyle = '#fc9838';
            ctx.font = `${isCompact ? 6.5 : 7.8}px "Press Start 2P", monospace`;
            ctx.fillText(
                gameState.previousPhase
                    ? 'PRESS [ESC] TO RESUME  •  TOP: ' + String(gameState.topScore).padStart(6, '0')
                    : `TOP- ${String(gameState.topScore).padStart(6, '0')}  •  GEMS- ${gameState.gemsFound}`,
                cx,
                menuY + rows.length * rowStep + 14
            );

            ctx.textAlign = 'left';
        }

        function draw() {
            ctx = mainCtx;
            ctx.imageSmoothingEnabled = false;
            ctx.save();

            const charSprites = getCharacterSprites(gameState.selectedCharacter);
            const charSpec = getActiveCharacterSpec();

            // --- OG NES STAGE INTRO SCREEN ---
            if (gameState.phase === 'stage_intro') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = Math.floor(canvas.width / 2);
                const cy = Math.floor(canvas.height / 2);

                ctx.drawImage(charSprites.idle, cx - 44, cy - 12, 28, 32);
                ctx.restore();
                applyPixelPass();

                beginUILayer();
                drawClassicNESStatusBar();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`WORLD  ${gameState.world}`, cx, cy - 36);
                ctx.fillText(`×  ${gameState.lives}`, cx + 18, cy + 12);

                ctx.fillStyle = '#fc9838';
                ctx.font = '9px "Press Start 2P", monospace';
                ctx.fillText('PRESS START / SPACE OR CLICK', cx, cy + 68);
                ctx.textAlign = 'left';
                endUILayer();
                return;
            }

            // --- OG NES BLACK-SCREEN GAME OVER SCENE ---
            if (gameState.phase === 'gameover') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = Math.floor(canvas.width / 2);
                const cy = Math.floor(canvas.height / 2);
                const isCompact = canvas.width < 430;
                const boxW = Math.min(300, canvas.width - 28);

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(cx - boxW / 2, cy - 18, boxW, 92);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4;
                ctx.strokeRect(cx - boxW / 2, cy - 18, boxW, 92);

                ctx.restore();
                applyPixelPass();

                beginUILayer();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = `${isCompact ? 8 : 11}px "Press Start 2P", monospace`;
                ctx.fillText(
                    `${charSpec.name} ${String(gameState.score).padStart(6, '0')}   COINS x${String(gameState.coins).padStart(2, '0')}   ${gameState.mode === 'flappy_collab' ? 'FLAPPY' : gameState.world}`,
                    cx,
                    48
                );

                ctx.fillStyle = '#ef4444';
                ctx.font = `bold ${isCompact ? 20 : 26}px "Press Start 2P", monospace`;
                ctx.fillText('GAME OVER', cx, cy - 42);

                ctx.fillStyle = '#facc15';
                ctx.font = `${isCompact ? 9 : 11}px "Press Start 2P", monospace`;
                ctx.fillText(`PIPES PASSED: ${gameState.pipesPassed}`, cx, cy + 12);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`BEST PIPES:   ${gameState.bestPipes}`, cx, cy + 36);
                ctx.fillStyle = '#4ade80';
                const medal = gameState.pipesPassed >= 20 ? '🏆 GOLD' : gameState.pipesPassed >= 10 ? '🥈 SILVER' : gameState.pipesPassed >= 5 ? '🥉 BRONZE' : '🍄 TRY AGAIN';
                ctx.fillText(`MEDAL: ${medal}`, cx, cy + 60);

                if (Math.floor(gameState.gameOverTimer / 20) % 2 === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${isCompact ? 8 : 11}px "Press Start 2P", monospace`;
                    ctx.fillText('TAP OR PRESS SPACE TO PLAY AGAIN', cx, cy + 108);
                }

                ctx.textAlign = 'left';
                endUILayer();
                return;
            }

            // Screen Shake
            if (gameState.shakeTimer > 0) {
                const dx = Math.round((Math.random() - 0.5) * 8);
                const dy = Math.round((Math.random() - 0.5) * 8);
                ctx.translate(dx, dy);
            }

            // Dynamic Background Sky (Improvised Flappy Universe cycles through 4 Biomes every 5 pipes!)
            const flappyBiome = Math.floor(gameState.pipesPassed / 5) % 4;
            if (gameState.subArea === 'underground') {
                ctx.fillStyle = '#070b14';
            } else if (gameState.world === '1-2') {
                ctx.fillStyle = '#180c24';
            } else if (gameState.mode === 'flappy_collab') {
                const biomeSkies = ['#4ec0ca', '#fb923c', '#0f172a', '#31102f'];
                ctx.fillStyle = biomeSkies[flappyBiome];
            } else {
                ctx.fillStyle = '#5c94fc';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const camX = Math.floor(gameState.cameraX);

            // Draw Scenery
            if (gameState.mode === 'flappy_collab') {
                const isDarkBiome = flappyBiome === 2 || flappyBiome === 3;
                cityBuildings.forEach(b => {
                    const bx = Math.floor(b.x - camX * 0.25);
                    if (bx + b.w > -60 && bx < canvas.width + 60) {
                        const by = 12 * TILE - b.h;
                        ctx.fillStyle = isDarkBiome ? '#1e293b' : (flappyBiome === 1 ? '#fed7aa' : '#a3e4d7');
                        ctx.fillRect(bx, by, b.w, b.h);
                        ctx.strokeStyle = isDarkBiome ? '#334155' : (flappyBiome === 1 ? '#f97316' : '#76d7c4');
                        ctx.lineWidth = 2;
                        ctx.strokeRect(bx, by, b.w, b.h);
                        ctx.fillStyle = isDarkBiome ? '#fef08a' : '#e8f8f5';
                        for (let wy = by + 10; wy < 12 * TILE - 18; wy += 16) {
                            for (let wx = bx + 8; wx < bx + b.w - 10; wx += 14) {
                                ctx.fillRect(wx, wy, 6, 8);
                            }
                        }
                    }
                });
                clouds.forEach(c => {
                    const cx = Math.floor(c.x - camX * 0.35);
                    if (cx + c.w > -50 && cx < canvas.width + 50) {
                        ctx.drawImage(SPRITES.cloud, cx, Math.floor(c.y), c.w, 28);
                    }
                });
            } else if (gameState.world === '1-1' && gameState.subArea === 'main') {
                hills.forEach(h => {
                    const hx = Math.floor(h.x - camX * 0.5);
                    if (hx + h.w > -50 && hx < canvas.width + 50) {
                        const steps = 6;
                        const stepH = Math.floor(h.h / steps);
                        for (let s = 0; s < steps; s++) {
                            const inset = s * 10;
                            const sy = 12 * TILE - (s + 1) * stepH;
                            const sw = Math.max(16, h.w - inset * 2);
                            ctx.fillStyle = '#15803d';
                            ctx.fillRect(hx + inset, sy, sw, stepH);
                            ctx.fillStyle = '#052e16';
                            ctx.fillRect(hx + inset, sy, 4, stepH);
                            ctx.fillRect(hx + inset + sw - 4, sy, 4, stepH);
                            ctx.fillRect(hx + inset, sy, sw, 4);
                        }
                    }
                });
                clouds.forEach(c => {
                    const cx = Math.floor(c.x - camX * 0.3);
                    if (cx + c.w > -50 && cx < canvas.width + 50) {
                        ctx.drawImage(SPRITES.cloud, cx, Math.floor(c.y), c.w, 28);
                    }
                });
            }

            ctx.translate(-camX, 0);

            // Lava Pit in World 1-2
            if (gameState.world === '1-2') {
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(camX, 12 * TILE + 12, canvas.width, 60);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(camX, 12 * TILE + 12, canvas.width, 6);
            }

            // Draw Flagpole
            if (flagpole) {
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(flagpole.x + 12, flagpole.y, 6, flagpole.h);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(flagpole.x + 8, flagpole.y - 10, 14, 14);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(flagpole.x - 22, gameState.flagY, 34, 24);
            }

            // Draw Mid-Stage Checkpoint Flag
            if (checkpointFlag) {
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(checkpointFlag.x + 8, checkpointFlag.y, 4, checkpointFlag.h);
                ctx.fillStyle = checkpointFlag.activated ? '#4ade80' : '#ef4444';
                ctx.fillRect(checkpointFlag.x + 12, checkpointFlag.y + 4, 20, 14);
            }

            // Draw Golden Axe
            if (axeObj) {
                ctx.fillStyle = '#facc15';
                ctx.fillRect(axeObj.x, axeObj.y, 20, 18);
                ctx.fillStyle = '#78350f';
                ctx.fillRect(axeObj.x + 8, axeObj.y + 18, 6, 14);
            }

            // Draw Blocks
            blocks.forEach(b => {
                if (b.x + b.w < camX - 32 || b.x > camX + canvas.width + 32) return;
                const bx = Math.floor(b.x);
                const by = Math.floor(b.y + (b.bounceY || 0));

                if (b.type === 'ground') {
                    if (gameState.mode === 'flappy_collab') {
                        ctx.fillStyle = '#ded895';
                        ctx.fillRect(bx, by, TILE, TILE * 2);
                        ctx.fillStyle = '#73bf2e';
                        ctx.fillRect(bx, by, TILE, 10);
                        ctx.fillStyle = '#558c22';
                        ctx.fillRect(bx + 8, by + 2, 10, 6);
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(bx, by, TILE, 2);
                        ctx.fillRect(bx, by + 10, TILE, 2);
                    } else {
                        ctx.drawImage(SPRITES.brick, bx, by, TILE, TILE);
                        ctx.drawImage(SPRITES.brick, bx, by + TILE, TILE, TILE);
                    }
                } else if (b.type === 'castle') {
                    ctx.drawImage(SPRITES.castleBrick, bx, by, TILE, TILE);
                    ctx.drawImage(SPRITES.castleBrick, bx, by + TILE, TILE, TILE);
                } else if (b.type === 'question') {
                    ctx.drawImage(SPRITES.question, bx, by, TILE, TILE);
                } else if (b.type === 'note_block') {
                    ctx.drawImage(SPRITES.noteBlock, bx, by, TILE, TILE);
                } else if (b.type === 'gem_block') {
                    ctx.drawImage(SPRITES.gemBlock, bx, by, TILE, TILE);
                } else if (b.type === 'brick') {
                    ctx.drawImage(SPRITES.brick, bx, by, TILE, TILE);
                } else if (b.type === 'hard') {
                    ctx.drawImage(SPRITES.hardBlock, bx, by, TILE, TILE);
                } else if (b.type === 'used') {
                    ctx.drawImage(SPRITES.usedBlock, bx, by, TILE, TILE);
                } else if (b.type === 'bridge') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(bx, by, b.w, b.h);
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, by, b.w, b.h);
                }
            });

            // Draw Golden Sky Rings in Flappy's Universe
            skyRings.forEach(sr => {
                if (sr.collected || sr.x + sr.w < camX - 32 || sr.x > camX + canvas.width + 32) return;
                const pulse = Math.sin(Date.now() * 0.008 + sr.phase) * 2;
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 6;
                ctx.strokeRect(Math.floor(sr.x - pulse), Math.floor(sr.y - pulse), Math.floor(sr.w + pulse * 2), Math.floor(sr.h + pulse * 2));
                ctx.strokeStyle = (Math.floor(Date.now() / 120) % 2 === 0) ? '#facc15' : '#fef08a';
                ctx.lineWidth = 3;
                ctx.strokeRect(Math.floor(sr.x - pulse), Math.floor(sr.y - pulse), Math.floor(sr.w + pulse * 2), Math.floor(sr.h + pulse * 2));
            });

            // Draw Moving Platforms
            movingPlatforms.forEach(mp => {
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(Math.floor(mp.x), Math.floor(mp.y), mp.w, mp.h);
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.strokeRect(Math.floor(mp.x), Math.floor(mp.y), mp.w, mp.h);
            });

            // Draw Piranha Plants BEHIND pipes
            enemies.forEach(en => {
                if (en.type === 'piranha' && !en.dead) {
                    ctx.drawImage(SPRITES.piranha, Math.floor(en.x), Math.floor(en.y), en.w, en.h);
                }
            });

            // Draw Pipes (Moving pipes in Flappy Universe get a sleek golden-teal highlight!)
            pipes.forEach(p => {
                const px = Math.floor(p.x);
                const py = Math.floor(p.y);
                if (px + p.w < camX - 64 || px > camX + canvas.width + 64) return;

                const mainPipeColor = p.oscillate ? '#0d9488' : '#16a34a';
                const shinePipeColor = p.oscillate ? '#5eead4' : '#4ade80';
                const shadowPipeColor = p.oscillate ? '#115e59' : '#14532d';

                ctx.fillStyle = mainPipeColor;
                if (p.inverted) {
                    const rimY = py + p.h - 24;
                    ctx.fillRect(px + 4, py, p.w - 8, Math.max(0, p.h - 24));
                    ctx.fillRect(px, rimY, p.w, 24);
                    ctx.fillStyle = shinePipeColor;
                    ctx.fillRect(px + 8, py, 8, Math.max(0, p.h - 4));
                    ctx.fillStyle = shadowPipeColor;
                    ctx.fillRect(px + p.w - 14, py, 6, Math.max(0, p.h - 4));
                    ctx.strokeStyle = '#052e16';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(px + 4, py, p.w - 8, Math.max(0, p.h - 24));
                    ctx.strokeRect(px, rimY, p.w, 24);
                } else {
                    ctx.fillRect(px + 4, py + 24, p.w - 8, Math.max(0, p.h - 24));
                    ctx.fillRect(px, py, p.w, 24);
                    ctx.fillStyle = shinePipeColor;
                    ctx.fillRect(px + 8, py + 4, 8, Math.max(0, p.h - 4));
                    ctx.fillStyle = shadowPipeColor;
                    ctx.fillRect(px + p.w - 14, py + 4, 6, Math.max(0, p.h - 4));
                    ctx.strokeStyle = '#052e16';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(px, py, p.w, 24);
                    ctx.strokeRect(px + 4, py + 24, p.w - 8, Math.max(0, p.h - 24));
                }
            });

            // Draw Items
            items.forEach(it => {
                const ix = Math.floor(it.x);
                const iy = Math.floor(it.y);
                if (it.type === 'flappy_gem' || it.type === 'return_gem') {
                    ctx.fillStyle = (Math.floor(Date.now() / 120) % 2 === 0) ? 'rgba(34, 211, 238, 0.35)' : 'rgba(232, 121, 249, 0.35)';
                    ctx.fillRect(ix - 4, iy - 4, it.w + 8, it.h + 8);
                    ctx.drawImage(SPRITES.flappyGem, ix, iy, it.w, it.h);
                } else if (it.type === 'static_coin') {
                    ctx.drawImage(SPRITES.coin, ix, iy, it.w, it.h);
                } else if (it.type === '1up') {
                    ctx.drawImage(SPRITES.oneUp, ix, iy, it.w, it.h);
                } else if (it.type === 'mushroom') {
                    ctx.drawImage(SPRITES.mushroom, ix, iy, it.w, it.h);
                } else if (it.type === 'flower') {
                    ctx.drawImage(SPRITES.flower, ix, iy, it.w, it.h);
                } else if (it.type === 'star') {
                    ctx.drawImage(SPRITES.star, ix, iy, it.w, it.h);
                }
            });

            // Draw Dash Afterimages
            player.trail.forEach(t => {
                ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha * 0.6})`;
                ctx.fillRect(Math.floor(t.x), Math.floor(t.y), player.w, t.h);
            });

            // Draw Fireballs & Hammer Bro Hammers
            fireballs.forEach(fb => {
                if (fb.isHammer) {
                    ctx.drawImage(SPRITES.hammer, Math.floor(fb.x), Math.floor(fb.y), fb.w, fb.h);
                } else {
                    ctx.drawImage(SPRITES.fireball, Math.floor(fb.x), Math.floor(fb.y), fb.w, fb.h);
                }
            });

            // Draw Enemies
            enemies.forEach(en => {
                if (en.type === 'piranha') return;
                const ex = Math.floor(en.x);
                const ey = Math.floor(en.y);
                if (en.flying && en.type !== 'bullet_bill') {
                    const wingSpr = Math.floor(Date.now() / 120) % 2 === 0 ? SPRITES.wingUp : SPRITES.wingDown;
                    ctx.drawImage(wingSpr, ex + en.w - 6, ey - 8, 18, 14);
                }
                if (en.type === 'goomba') {
                    if (en.state === 'squashed') {
                        ctx.drawImage(SPRITES.goomba, ex, ey + 16, en.w, 14);
                    } else {
                        ctx.drawImage(SPRITES.goomba, ex, ey, en.w, en.h);
                    }
                } else if (en.type === 'koopa') {
                    if (en.state === 'walk') {
                        ctx.drawImage(SPRITES.koopa, ex, ey, en.w, en.h);
                    } else {
                        ctx.drawImage(SPRITES.shell, ex, ey, en.w, en.h);
                    }
                } else if (en.type === 'bullet_bill') {
                    ctx.drawImage(SPRITES.bulletBill, ex, ey, en.w, en.h);
                } else if (en.type === 'hammer_bro') {
                    ctx.drawImage(SPRITES.hammerBro, ex, ey, en.w, en.h);
                } else if (en.type === 'bowser') {
                    ctx.drawImage(SPRITES.bowser, ex, ey, en.w, en.h);
                } else if (en.type === 'mecha_flappy') {
                    ctx.drawImage(SPRITES.mechaFlappy, ex, ey, en.w, en.h);
                }
            });

            // Draw Remote Multiplayer Peers ONLY when Multiplayer is enabled
            if (gameState.multiplayerEnabled) {
                Object.keys(remotePlayers).forEach((uid, idx) => {
                    const rp = remotePlayers[uid];
                    const sameStage = rp.mode === gameState.mode && (gameState.mode === 'flappy_collab' || (rp.world === gameState.world && rp.subArea === gameState.subArea));
                    if (!sameStage) return;

                    const rx = Math.floor(rp.renderX ?? rp.x);
                    const ry = Math.floor(rp.renderY ?? rp.y);
                    const rw = 26;
                    const rh = rp.power === 'small' ? 30 : 40;

                    ctx.save();
                    ctx.globalAlpha = 0.92;
                    ctx.translate(Math.floor(rx + rw / 2), Math.floor(ry + rh / 2));
                    if (rp.facing === -1) ctx.scale(-1, 1);
                    ctx.rotate(rp.leanAngle || 0);

                    const wingSpr = (Math.floor((rp.animTimer || 0) / 6) % 2 === 0) ? SPRITES.wingUp : SPRITES.wingDown;
                    if (rp.mode === 'flappy_collab') {
                        ctx.drawImage(wingSpr, Math.floor(-rw / 2 - 14), Math.floor(-rh / 2 + 4), 20, 14);
                    }

                    const fallbackChar = (idx % 2 === 0) ? 'luigi' : 'wario';
                    const peerCharSprites = getCharacterSprites(rp.character || fallbackChar);

                    let peerSpr = peerCharSprites.idle;
                    if (rp.phase === 'dying') {
                        peerSpr = peerCharSprites.dead;
                    } else if (rp.mode === 'flappy_collab' || Math.abs(rp.vx || 0) > 0.5) {
                        peerSpr = (Math.floor((rp.animTimer || 0) / 5) % 2 === 0) ? peerCharSprites.lean : peerCharSprites.jump;
                    } else if (!rp.onGround) {
                        peerSpr = peerCharSprites.jump;
                    }

                    ctx.drawImage(peerSpr, Math.floor(-rw / 2 - 3), Math.floor(-rh / 2), rw + 6, rh);
                    ctx.restore();
                });
            }

            // Draw Player (Uses Selected Hero from 1985 Character Select + Winged Collab Modes)
            if (gameState.phase === 'dying') {
                ctx.drawImage(charSprites.dead, Math.floor(player.x - 3), Math.floor(player.y), 32, 32);
            } else if (player.invincibleTimer % 4 < 2) {
                ctx.save();
                ctx.translate(Math.floor(player.x + player.w / 2), Math.floor(player.y + player.h / 2));
                if (player.facing === -1) ctx.scale(-1, 1);

                ctx.rotate(player.leanAngle || 0);

                const wingSpr = player.flapAnimTimer > 0 ? SPRITES.wingUp : SPRITES.wingDown;
                const isMovingForward = gameState.mode === 'flappy_collab' || Math.abs(player.vx) > 0.6;

                if (gameState.mode === 'flappy_collab' && gameState.collabHero === 'bird') {
                    ctx.drawImage(SPRITES.flappyBird, -16, -14, 34, 28);
                    ctx.drawImage(wingSpr, -12, -4, 18, 12);
                } else {
                    if (gameState.mode === 'flappy_collab') {
                        ctx.drawImage(wingSpr, Math.floor(-player.w / 2 - 14), Math.floor(-player.h / 2 + 4), 20, 14);
                    }

                    let spr = charSprites.idle;
                    if (player.starTimer > 0 && Math.floor(Date.now() / 60) % 2 === 0) {
                        spr = isMovingForward ? SPRITES.starLean : SPRITES.starIdle;
                    } else if (player.power === 'fire') {
                        if (isMovingForward) spr = (Math.floor(player.animTimer / 5) % 2 === 0) ? SPRITES.fireLean : SPRITES.fireJump;
                        else spr = !player.onGround ? SPRITES.fireJump : SPRITES.fireIdle;
                    } else {
                        if (isMovingForward) spr = (Math.floor(player.animTimer / 5) % 2 === 0) ? charSprites.lean : charSprites.jump;
                        else spr = !player.onGround ? charSprites.jump : charSprites.idle;
                    }

                    const bob = (player.onGround && Math.abs(player.vx) > 0.3) ? (Math.floor(player.animTimer / 4) % 2) * 2 : 0;
                    ctx.drawImage(spr, Math.floor(-player.w / 2 - 3), Math.floor(-player.h / 2 + bob), player.w + 6, player.h);

                    if (gameState.mode === 'flappy_collab' && gameState.collabHero === 'duo') {
                        const birdBob = Math.sin(player.animTimer * 0.2) * 4;
                        ctx.drawImage(SPRITES.flappyBird, -24, Math.floor(-player.h / 2 - 22 + birdBob), 26, 20);
                    }
                }
                ctx.restore();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
            });

            ctx.restore();

            // Pixelate the game world & sprites at full selected graphics scale (1X - 4X)
            applyPixelPass();

            // Switch to the UI & Text layer (downscaled with graphics, but capped at >= 80% resolution)
            beginUILayer();

            // Draw Pipe Labels & Floating Score Popups in screen space
            pipes.forEach(p => {
                if (p.label) {
                    const screenX = Math.floor(p.x - camX);
                    if (screenX + p.w >= -32 && screenX <= canvas.width + 32) {
                        ctx.fillStyle = '#000000';
                        ctx.font = 'bold 10px "Press Start 2P", monospace';
                        ctx.fillText(p.label, screenX + 5, Math.floor(p.y) - 7);
                        ctx.fillStyle = '#fef08a';
                        ctx.fillText(p.label, screenX + 4, Math.floor(p.y) - 8);
                    }
                }
            });

            floatingTexts.forEach(ft => {
                const screenX = Math.floor(ft.x - camX);
                const screenY = Math.floor(ft.y);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 10px "Press Start 2P", monospace';
                ctx.fillText(ft.text, screenX + 1, screenY + 1);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, screenX, screenY);
            });

            // Draw Remote Multiplayer Peer Name & Full ID Tags in Screen Space ONLY when Multiplayer is enabled
            if (gameState.multiplayerEnabled) {
                Object.keys(remotePlayers).forEach((uid, idx) => {
                    const rp = remotePlayers[uid];
                    const sameStage = rp.mode === gameState.mode && (gameState.mode === 'flappy_collab' || (rp.world === gameState.world && rp.subArea === gameState.subArea));
                    if (!sameStage) return;

                    const rx = Math.floor((rp.renderX ?? rp.x) - camX + 13);
                    const ry = Math.floor((rp.renderY ?? rp.y) - 8);
                    if (rx >= -80 && rx <= canvas.width + 80) {
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 7px "Press Start 2P", monospace';
                        const tag = `P${idx + 2}:${uid}`;
                        ctx.fillStyle = '#000000';
                        ctx.fillText(tag, rx + 1, ry + 1);
                        ctx.fillStyle = (idx % 2 === 0) ? '#4ade80' : '#facc15';
                        ctx.fillText(tag, rx, ry);
                        ctx.textAlign = 'left';
                    }
                });
            }

            // Always draw the authentic 1985 in-canvas NES Status Bar at the top
            drawClassicNESStatusBar();

            // Draw Unlocked Achievement Banner Toast
            if (gameState.achievementBanner) {
                const cx = Math.floor(canvas.width / 2);
                ctx.fillStyle = '#000000';
                ctx.fillRect(cx - 170, 44, 340, 26);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 2;
                ctx.strokeRect(cx - 170, 44, 340, 26);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#4ade80';
                ctx.font = 'bold 8px "Press Start 2P", monospace';
                ctx.fillText(gameState.achievementBanner.text, cx, 61);
                ctx.textAlign = 'left';
            }

            // Draw the unified 1985 Starting UI for Title, World Select, Character Select, Multiplayer, Trophies, and Course Clear
            if (
                gameState.phase === 'title' ||
                gameState.phase === 'world_map' ||
                gameState.phase === 'character_select' ||
                gameState.phase === 'multiplayer_menu' ||
                gameState.phase === 'trophies' ||
                gameState.phase === 'course_clear'
            ) {
                drawRetroTitleOverlay();
                endUILayer();
                return;
            }

            // --- DIMENSIONAL PORTAL WARP OVERLAY ---
            if (gameState.phase === 'warping') {
                const cx = Math.floor(canvas.width / 2);
                const cy = Math.floor(canvas.height / 2);
                ctx.fillStyle = (Math.floor(gameState.warpTimer / 3) % 2 === 0)
                    ? 'rgba(34, 211, 238, 0.28)'
                    : 'rgba(232, 121, 249, 0.28)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px "Press Start 2P", monospace';
                ctx.fillText(
                    gameState.warpTargetMode === 'flappy_collab'
                        ? '💎 TRAVELING TO FLAPPY\'S UNIVERSE...'
                        : '🍄 WARPING BACK TO MARIO WORLD...',
                    cx,
                    cy - 20
                );
                ctx.textAlign = 'left';
            }

            // --- FLAPPY BIRD BIG PIXEL SCORE COUNTER & BIOME BADGE ---
            if (gameState.mode === 'flappy_collab' && gameState.phase === 'playing') {
                const cx = Math.floor(canvas.width / 2);
                const biomeNames = ['DAY SKY', 'SUNSET DRIFT', 'STARLIGHT NIGHT', 'NEON FORTRESS'];
                const biomeLabel = biomeNames[flappyBiome];

                ctx.textAlign = 'center';
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 28px "Press Start 2P", monospace';
                ctx.fillText(String(gameState.pipesPassed), cx + 3, 81);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(String(gameState.pipesPassed), cx, 78);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 7px "Press Start 2P", monospace';
                ctx.fillText(biomeLabel, cx + 1, 95);
                ctx.fillStyle = '#facc15';
                ctx.fillText(biomeLabel, cx, 94);
                ctx.textAlign = 'left';
            }

            if (gameState.phase === 'ready') {
                const cx = Math.floor(canvas.width / 2);
                const cy = Math.floor(canvas.height / 2);
                const isCompact = canvas.width < 440;
                const boxW = Math.min(440, canvas.width - 20);
                const boxH = isCompact ? 116 : 126;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.fillRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);
                ctx.strokeStyle = '#22d3ee';
                ctx.lineWidth = 4;
                ctx.strokeRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#22d3ee';
                ctx.font = `bold ${isCompact ? 10.5 : 13}px "Press Start 2P", monospace`;
                ctx.fillText(`💎 FLAPPY UNIVERSE • ${charSpec.name}`, cx, cy - 30);

                ctx.fillStyle = '#facc15';
                ctx.font = `${isCompact ? 6.5 : 8}px "Press Start 2P", monospace`;
                ctx.fillText(
                    isCompact
                        ? 'MOVING PIPES • SKY RINGS • NOTE BLOCKS • GEMS'
                        : 'MOVING PIPES • GOLDEN SKY RINGS • BOUNCY NOTE BLOCKS',
                    cx,
                    cy - 4
                );

                if (Math.floor(Date.now() / 300) % 2 === 0) {
                    ctx.fillStyle = '#4ade80';
                    ctx.font = `bold ${isCompact ? 8.5 : 10.5}px "Press Start 2P", monospace`;
                    ctx.fillText(isCompact ? '▶ TAP SCREEN TO FLAP & FLY! ◀' : '▶ TAP OR PRESS SPACE TO FLAP & FLY! ◀', cx, cy + 28);
                }
                ctx.textAlign = 'left';
            }

            endUILayer();
        }

        function applyPixelPass() {
            if (gameState.pixelScale > 1) {
                const sw = Math.floor(canvas.width / gameState.pixelScale);
                const sh = Math.floor(canvas.height / gameState.pixelScale);
                if (pixelBuffer.width !== sw || pixelBuffer.height !== sh) {
                    pixelBuffer.width = sw;
                    pixelBuffer.height = sh;
                }
                pctx.imageSmoothingEnabled = false;
                pctx.clearRect(0, 0, sw, sh);
                pctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, sw, sh);

                mainCtx.imageSmoothingEnabled = false;
                mainCtx.clearRect(0, 0, canvas.width, canvas.height);
                mainCtx.drawImage(pixelBuffer, 0, 0, sw, sh, 0, 0, canvas.width, canvas.height);
            }
        }

        function beginUILayer() {
            if (uiCanvas.width !== canvas.width || uiCanvas.height !== canvas.height) {
                uiCanvas.width = canvas.width;
                uiCanvas.height = canvas.height;
            }
            uiCtx.imageSmoothingEnabled = false;
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            ctx = uiCtx;
        }

        function endUILayer() {
            ctx = mainCtx;
            const uiResolutionRatio = Math.max(0.80, 1 - (gameState.pixelScale - 1) * (0.20 / 3));

            if (uiResolutionRatio < 0.999) {
                const sw = Math.max(1, Math.floor(canvas.width * uiResolutionRatio));
                const sh = Math.max(1, Math.floor(canvas.height * uiResolutionRatio));
                if (pixelBuffer.width !== sw || pixelBuffer.height !== sh) {
                    pixelBuffer.width = sw;
                    pixelBuffer.height = sh;
                }
                pctx.imageSmoothingEnabled = false;
                pctx.clearRect(0, 0, sw, sh);
                pctx.drawImage(uiCanvas, 0, 0, canvas.width, canvas.height, 0, 0, sw, sh);

                mainCtx.imageSmoothingEnabled = false;
                mainCtx.drawImage(pixelBuffer, 0, 0, sw, sh, 0, 0, canvas.width, canvas.height);
            } else {
                mainCtx.imageSmoothingEnabled = false;
                mainCtx.drawImage(uiCanvas, 0, 0);
            }
        }

        // --- 10. UI & CONTROLS BINDINGS ---
        function updateHUD() {
            const appRoot = document.getElementById('app-root');
            if (appRoot) {
                appRoot.classList.toggle('crt-off', !gameState.crtEnabled);
            }
        }

        function toggleStartingUI() {
            clearInputState();
            // BACK: every menu-style screen steps up to the starting menu instead
            // of being remembered as a "paused run" you would resume into.
            if (
                gameState.phase === 'world_map' ||
                gameState.phase === 'character_select' ||
                gameState.phase === 'multiplayer_menu' ||
                gameState.phase === 'trophies' ||
                gameState.phase === 'course_clear' ||
                gameState.phase === 'gameover' ||
                gameState.phase === 'stage_intro'
            ) {
                gameState.previousPhase = null;
                gameState.phase = 'title';
                updateHUD();
                return;
            }
            if (gameState.phase === 'title') {
                if (gameState.previousPhase) {
                    gameState.phase = gameState.previousPhase;
                    gameState.previousPhase = null;
                } else {
                    gameState.mode = 'classic';
                    gameState.phase = 'playing';
                }
            } else {
                gameState.previousPhase = gameState.phase;
                gameState.titleCursor = 0;
                gameState.phase = 'title';
            }
            updateHUD();
        }

        function triggerStageReset() {
            sfx.init();
            sfx.bump();
            clearInputState();
            gameState.paused = false;
            gameState.previousPhase = null;
            gameState.lives = 3;
            gameState.score = 0;
            gameState.coins = 0;
            gameState.time = 400;
            gameState.checkpointX = null;
            gameState.checkpointY = null;
            player.power = 'small';
            loadLevel(gameState.world, 'main');
            gameState.phase = gameState.mode === 'flappy_collab' ? 'ready' : 'playing';
            gameState.running = true;
            updateHUD();
        }

        bindTouchButton('btn-restart', () => {
            triggerStageReset();
        }, () => {});

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            canvas.focus();
            if (gameState.paused || gameState.isPortraitBlocked) return;

            if (
                gameState.phase === 'title' ||
                gameState.phase === 'world_map' ||
                gameState.phase === 'character_select' ||
                gameState.phase === 'multiplayer_menu' ||
                gameState.phase === 'trophies' ||
                gameState.phase === 'course_clear'
            ) {
                const rect = canvas.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
                const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
                const { menuY, rowStep, boxLeft, boxRight, rowCount } = menuHitBounds;
                const topEdge = menuY - 15;
                const bottomEdge = menuY + rowCount * rowStep + 6;

                if (gameState.phase === 'trophies') {
                    triggerInstantFlapOrAction();
                    return;
                }

                if (clickX >= boxLeft - 16 && clickX <= boxRight + 16 && clickY >= topEdge && clickY <= bottomEdge) {
                    const clickedRow = Math.max(0, Math.min(rowCount - 1, Math.floor((clickY - (menuY - 12)) / rowStep)));

                    if (gameState.phase === 'title') {
                        gameState.titleCursor = clickedRow;
                        triggerInstantFlapOrAction();
                    } else if (gameState.phase === 'character_select') {
                        gameState.charCursor = clickedRow;
                        triggerInstantFlapOrAction();
                    } else if (gameState.phase === 'multiplayer_menu') {
                        gameState.mpCursor = clickedRow;
                        triggerInstantFlapOrAction();
                    } else if (gameState.phase === 'world_map') {
                        gameState.mapNodeIndex = clickedRow;
                        if (gameState.mapNodeIndex < OVERWORLD_NODES.length) {
                            const previewNode = OVERWORLD_NODES[gameState.mapNodeIndex];
                            if (previewNode.mode === 'classic' && gameState.world !== previewNode.id) {
                                loadLevel(previewNode.id, 'main');
                            }
                        }
                        triggerInstantFlapOrAction();
                    } else if (gameState.phase === 'course_clear') {
                        gameState.clearCursor = clickedRow;
                        triggerInstantFlapOrAction();
                    }
                }
                return;
            }

            if (e.button === 2) {
                keys.dashJustPressed = true;
                return;
            }

            pointerJumpHeld = true;
            setTouchAction('jump', true);
            triggerInstantFlapOrAction();
        });

        function releasePointerJump() {
            if (!pointerJumpHeld) return;
            pointerJumpHeld = false;
            setTouchAction('jump', false);
        }
        window.addEventListener('pointerup', releasePointerJump);
        window.addEventListener('pointercancel', releasePointerJump);
        canvas.addEventListener('pointerleave', releasePointerJump);

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        function getNormalizedActions(e) {
            const code = e.code || '';
            const key = (e.key || '').toLowerCase();
            return {
                left: code === 'ArrowLeft' || code === 'KeyA' || key === 'arrowleft' || key === 'a',
                right: code === 'ArrowRight' || code === 'KeyD' || key === 'arrowright' || key === 'd',
                up: code === 'ArrowUp' || code === 'KeyW' || key === 'arrowup' || key === 'w',
                down: code === 'ArrowDown' || code === 'KeyS' || key === 'arrowdown' || key === 's',
                jump: code === 'Space' || code === 'ArrowUp' || code === 'KeyW' || code === 'KeyZ' || key === ' ' || key === 'arrowup' || key === 'w' || key === 'z',
                dash: code === 'KeyX' || code === 'ShiftLeft' || code === 'ShiftRight' || key === 'x' || key === 'shift',
                confirm: code === 'Enter' || code === 'Space' || code === 'KeyZ' || key === 'enter' || key === ' ' || key === 'z',
                escape: code === 'Escape' || key === 'escape',
                menu: code === 'KeyE' || key === 'e',
                reset: code === 'KeyR' || key === 'r'
            };
        }

        // Keyboard Listeners
        window.addEventListener('keydown', (e) => {
            const act = getNormalizedActions(e);

            if (act.left || act.right || act.up || act.down || act.jump || act.dash || act.escape) {
                e.preventDefault();
                if (document.activeElement && document.activeElement !== canvas && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }
            }

            if (act.escape || act.menu) {
                sfx.init();
                sfx.bump();
                toggleStartingUI();
                return;
            }

            if (act.reset) {
                e.preventDefault();
                triggerStageReset();
                return;
            }

            if (gameState.paused || gameState.isPortraitBlocked) return;

            if (gameState.phase === 'title') {
                clampTitleCursor();
                const maxRows = gameState.previousPhase ? 8 : 7;
                const charRowIdx = 2;
                const gfxRowIdx = 5;
                const crtRowIdx = 6;

                if (act.up) {
                    gameState.titleCursor = (gameState.titleCursor + maxRows - 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if (act.down) {
                    gameState.titleCursor = (gameState.titleCursor + 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if (act.left) {
                    if (gameState.titleCursor === charRowIdx) {
                        const idx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                        gameState.selectedCharacter = CHARACTER_ROSTER[(idx + CHARACTER_ROSTER.length - 1) % CHARACTER_ROSTER.length].id;
                        sfx.coin();
                        savePlayerProgress();
                    } else if (gameState.titleCursor === gfxRowIdx) {
                        gameState.pixelScale = ((gameState.pixelScale + 2) % 4) + 1;
                        sfx.bump();
                        savePlayerProgress();
                        updateHUD();
                    } else if (gameState.titleCursor === crtRowIdx) {
                        gameState.crtEnabled = !gameState.crtEnabled;
                        sfx.bump();
                        savePlayerProgress();
                        updateHUD();
                    }
                    return;
                }
                if (act.right) {
                    if (gameState.titleCursor === charRowIdx) {
                        const idx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                        gameState.selectedCharacter = CHARACTER_ROSTER[(idx + 1) % CHARACTER_ROSTER.length].id;
                        sfx.coin();
                        savePlayerProgress();
                    } else if (gameState.titleCursor === gfxRowIdx) {
                        gameState.pixelScale = (gameState.pixelScale % 4) + 1;
                        sfx.bump();
                        savePlayerProgress();
                        updateHUD();
                    } else if (gameState.titleCursor === crtRowIdx) {
                        gameState.crtEnabled = !gameState.crtEnabled;
                        sfx.bump();
                        savePlayerProgress();
                        updateHUD();
                    }
                    return;
                }
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            if (gameState.phase === 'character_select') {
                const maxRows = CHARACTER_ROSTER.length + 2;
                if (act.up) {
                    gameState.charCursor = (gameState.charCursor + maxRows - 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if (act.down) {
                    gameState.charCursor = (gameState.charCursor + 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if ((act.left || act.right) && gameState.charCursor === CHARACTER_ROSTER.length) {
                    const curIdx = COLLAB_HERO_MODES.findIndex(m => m.id === gameState.collabHero);
                    const dir = act.left ? COLLAB_HERO_MODES.length - 1 : 1;
                    gameState.collabHero = COLLAB_HERO_MODES[(curIdx + dir) % COLLAB_HERO_MODES.length].id;
                    sfx.coin();
                    savePlayerProgress();
                    return;
                }
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            if (gameState.phase === 'multiplayer_menu') {
                const maxRows = 5;
                const rooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
                if (act.up) {
                    gameState.mpCursor = (gameState.mpCursor + maxRows - 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if (act.down) {
                    gameState.mpCursor = (gameState.mpCursor + 1) % maxRows;
                    sfx.bump();
                    return;
                }
                if (act.left || act.right) {
                    if (gameState.mpCursor === 0) {
