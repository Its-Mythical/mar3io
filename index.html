<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Press Start 2P', monospace;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
        }
        /* Subtle Retro CRT Scanlines & Pixel Grid */
        .crt-overlay {
            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.32) 50%
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 0, 0, 0.04),
                    rgba(0, 255, 0, 0.01),
                    rgba(0, 0, 255, 0.04)
                );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .crt-off .crt-overlay {
            display: none;
        }
        /* Classy Beveled 8-Bit Pixel Art UI & Buttons */
        .classy-pixel-modal {
            background-color: #0c1021;
            border: 4px solid #facc15;
            outline: 4px solid #000000;
            box-shadow:
                inset 0 0 0 4px #1e293b,
                0 12px 0 #000000;
            border-radius: 0;
        }
        .pixel-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 0.95rem;
            font-size: 9px;
            line-height: 1;
            color: #fefce8;
            background-color: #1e293b;
            border-top: 3px solid #64748b;
            border-left: 3px solid #64748b;
            border-right: 3px solid #020617;
            border-bottom: 3px solid #020617;
            outline: 2px solid #000000;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: transform 0.05s;
        }
        .pixel-btn:hover {
            background-color: #334155;
            color: #facc15;
            border-top-color: #94a3b8;
            border-left-color: #94a3b8;
        }
        .pixel-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-gold {
            background-color: #b45309;
            color: #ffffff;
            border-top: 3px solid #fde047;
            border-left: 3px solid #fde047;
            border-right: 3px solid #451a03;
            border-bottom: 3px solid #451a03;
        }
        .pixel-btn-gold:hover {
            background-color: #d97706;
            color: #ffffff;
        }
        .pixel-btn-active {
            background-color: #15803d;
            color: #ffffff;
            border-top: 3px solid #86efac;
            border-left: 3px solid #86efac;
            border-right: 3px solid #052e16;
            border-bottom: 3px solid #052e16;
        }
        .pixel-btn-active:hover {
            background-color: #16a34a;
            color: #ffffff;
        }
        .pixel-top-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.42rem 0.7rem;
            font-size: 8px;
            color: #fef08a;
            background-color: #0f172a;
            border-top: 2px solid #facc15;
            border-left: 2px solid #facc15;
            border-right: 2px solid #713f12;
            border-bottom: 2px solid #713f12;
            outline: 2px solid #000000;
            box-shadow: 0 3px 0 #000000;
            cursor: pointer;
        }
        .pixel-top-btn:hover {
            background-color: #1e293b;
            color: #ffffff;
        }
        .pixel-top-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-reset {
            background-color: #991b1b;
            color: #fef2f2;
            border-top: 3px solid #f87171;
            border-left: 3px solid #f87171;
            border-right: 3px solid #450a0a;
            border-bottom: 3px solid #450a0a;
            outline: 2px solid #000000;
            box-shadow: 0 3px 0 #000000;
        }
        .pixel-btn-reset:hover {
            background-color: #b91c1c;
            color: #facc15;
            border-top-color: #fca5a5;
            border-left-color: #fca5a5;
        }
        .pixel-btn-reset:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000000;
        }
        /* Classy Beveled Pixel D-Pad & Action Buttons */
        .pixel-dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            border-top: 3px solid #64748b;
            border-left: 3px solid #64748b;
            border-right: 3px solid #020617;
            border-bottom: 3px solid #020617;
            outline: 2px solid #000000;
            color: #f8fafc;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
        }
        .pixel-dpad-btn:active {
            transform: translateY(3px);
            background-color: #facc15;
            color: #000000;
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #b91c1c;
            border-top: 3px solid #fca5a5;
            border-left: 3px solid #fca5a5;
            border-right: 3px solid #450a0a;
            border-bottom: 3px solid #450a0a;
            outline: 2px solid #000000;
            color: #ffffff;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
        }
        .pixel-action-btn:active {
            transform: translateY(3px);
            background-color: #facc15;
            color: #000000;
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-pressed {
            transform: translateY(3px) !important;
            background-color: #facc15 !important;
            color: #000000 !important;
            box-shadow: 0 1px 0 #000000 !important;
        }
        /* Ergonomic Corner Docking for Mobile & Subtle Auto-Fade on Desktop PC */
        #virtual-gamepad {
            padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
            padding-left: max(0.35rem, env(safe-area-inset-left, 0px));
            padding-right: max(0.35rem, env(safe-area-inset-right, 0px));
            transition: opacity 0.2s ease;
        }
        .pad-btn-size {
            width: clamp(38px, 9.5vmin, 50px);
            height: clamp(38px, 9.5vmin, 50px);
            font-size: clamp(9px, 2.2vmin, 12px);
            touch-action: none;
        }
        /* Landscape on a phone leaves little height, so the on-screen buttons
           get a bigger minimum target and scale with the shorter edge. */
        html.touch-ui .pad-btn-size {
            width: clamp(46px, 12vmin, 62px);
            height: clamp(46px, 12vmin, 62px);
            font-size: clamp(11px, 3vmin, 15px);
        }
        /* Desktop keeps the original small buttons. Declared after the touch rule
           so it wins even if both classes ever end up on <html>. */
        html.desktop-ui .pad-btn-size {
            width: clamp(38px, 9.5vmin, 50px);
            height: clamp(38px, 9.5vmin, 50px);
            font-size: clamp(9px, 2.2vmin, 12px);
        }
        /* Controls fade back while idle so they stop covering the view, and
           come straight back to full opacity on any touch. */
        #virtual-gamepad { transition: opacity 0.35s ease; }
        html.touch-ui.pad-idle #virtual-gamepad { opacity: 0.55; }
        @media (hover: hover) and (pointer: fine) {
            #virtual-gamepad:not(.touch-active) {
                opacity: 0.35;
            }
            #virtual-gamepad:hover {
                opacity: 0.95;
            }
        }
        /* 1985 NES Portrait Rotate Dialog Styling */
        .nes-brick-border {
            background-color: #000000;
            border: 6px solid #c84c0c;
            outline: 4px solid #fcBCB0;
            box-shadow:
                inset 0 0 0 4px #000000,
                0 0 0 8px #000000,
                0 14px 0 #000000;
        }
        .nes-signboard {
            background-color: #c84c0c;
            border: 3px solid #fcBCB0;
            box-shadow: 4px 4px 0 #000000;
        }
        @keyframes nesRotatePhone {
            0%, 15% { transform: rotate(0deg); }
            45%, 75% { transform: rotate(-90deg); }
            95%, 100% { transform: rotate(0deg); }
        }
        .nes-rotate-anim {
            animation: nesRotatePhone 2.6s steps(6, end) infinite;
        }

        /* =====================================================================
           TOUCH CONTROLS
           The D-pad is a single row  ◀  ▼  ▶  on every device. The old raised-
           button / indented layout existed only to dodge the Google Sites (i)
           icon; the game is hosted directly now, so that workaround is gone.
           ===================================================================== */
        html.touch-ui #virtual-gamepad {
            bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
            left: calc(0.5rem + env(safe-area-inset-left, 0px));
            right: calc(0.5rem + env(safe-area-inset-right, 0px));
        }


        /* EXPAND button: mobile devices only, and only where the browser
           actually allows fullscreen (an embedded iframe without
           allowfullscreen cannot, so the button is hidden rather than dead). */
        #btn-fullscreen { display: none; }               /* desktop: never shown */
        html.touch-ui #btn-fullscreen { display: block; } /* mobile: shown */
        html.desktop-ui #btn-fullscreen { display: none; } /* belt and braces */
        html.no-fullscreen #btn-fullscreen { display: none !important; }
        /* Once fullscreen is running there is nothing left to press. */
        html.is-fullscreen #btn-fullscreen { display: none !important; }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden select-none">

    <!-- Fullscreen Game Container -->
    <div id="app-root" class="relative w-screen h-full overflow-hidden bg-black">

        <!-- CRT Scanline Mesh Overlay -->
        <div class="crt-overlay absolute inset-0 z-10"></div>

        <!-- 1985 Mario NES-Style Portrait Rotate Screen Dialog (Auto-pauses game without damaging run) -->
        <div id="nes-rotate-overlay" class="hidden absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-5 text-center select-none">
            <div class="nes-brick-border w-full max-w-xs p-5 flex flex-col items-center gap-4 relative">
                <!-- Corner Gold Rivets -->
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute top-2 left-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute top-2 right-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute bottom-2 left-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute bottom-2 right-2"></div>

                <!-- 1985 Brick-Orange Signboard Header -->
                <div class="nes-signboard w-full py-2.5 px-3">
                    <div class="text-xs text-[#fcBCB0] tracking-wider drop-shadow-[2px_2px_0_#000]">SUPER MARIO</div>
                </div>

                <!-- Animated 8-Bit NES Screen Rotate Icon -->
                <div class="my-2 flex items-center justify-center gap-4">
                    <div class="nes-rotate-anim w-14 h-20 border-4 border-white bg-slate-900 flex flex-col items-center justify-between p-1.5 shadow-[4px_4px_0_#c84c0c]">
                        <div class="w-full h-1.5 bg-sky-400"></div>
                        <div class="text-[9px] text-yellow-300">1-1</div>
                        <div class="flex gap-1">
                            <span class="w-2 h-2 bg-red-500 inline-block"></span>
                            <span class="w-2 h-2 bg-red-500 inline-block"></span>
                        </div>
                    </div>
                </div>

                <div class="text-[10px] leading-relaxed text-yellow-300">
                    ROTATE YOUR DEVICE<br>TO LANDSCAPE
                </div>
                <div class="text-[7.5px] leading-relaxed text-slate-300 px-1">
                    FOR PROPER 8-BIT WIDE VIEW &amp; MULTI-TOUCH CONTROLS.<br>
                    <span class="text-green-400">(YOUR GAME IS SAFELY PAUSED)</span>
                </div>
                <div class="text-[7.5px] leading-relaxed text-yellow-300 px-1">
                    TURN THE PHONE SIDEWAYS TO CONTINUE.
                </div>
            </div>
        </div>

        <!-- Floating Bottom Overlay: Classy Pixel Controller Pad -->
        <div id="virtual-gamepad" class="absolute bottom-2 left-2 right-2 sm:bottom-3 sm:left-4 sm:right-4 z-20 flex items-end justify-between pointer-events-none">
            <!-- Left Beveled Pixel D-Pad: only the down button is raised (it sits above
                 the Google Sites (i) button); left/right stay down at the bottom edge,
                 indented so they clear the icon. -->
            <div id="dpad" class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">
                <button id="t-left" type="button" data-pad-action="left" class="pixel-dpad-btn pad-btn-size" aria-label="Move Left">◀</button>
                <button id="t-down" type="button" data-pad-action="down" class="pixel-dpad-btn pad-btn-size" aria-label="Crouch / Pipe / Slam">▼</button>
                <button id="t-right" type="button" data-pad-action="right" class="pixel-dpad-btn pad-btn-size" aria-label="Move Right">▶</button>
            </div>

            <!-- Right Beveled Pixel R / B / A Buttons (E above A, so the rest sit on the bottom line) -->
            <div class="flex items-end gap-1.5 sm:gap-2.5 pointer-events-auto">
                <button id="btn-restart" type="button" data-pad-action="reset" class="pixel-action-btn pixel-btn-reset pad-btn-size" aria-label="Reset Stage" title="Reset Stage (R)">
                    R
                </button>
                <button id="t-dash" type="button" data-pad-action="dash" class="pixel-action-btn pad-btn-size" aria-label="Dash or Fire">
                    B
                </button>
                <!-- E (menu) sits just above A; R, B and A share the bottom line -->
                <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                    <button id="t-menu" type="button" class="pixel-action-btn pad-btn-size" aria-label="Open Menu" title="Menu (E)">E</button>
                    <button id="t-jump" type="button" data-pad-action="jump" class="pixel-action-btn pad-btn-size" aria-label="Jump or Flap">
                        A
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Fullscreen Toggle -->
        <button id="btn-fullscreen" type="button" class="pixel-btn pixel-btn-gold absolute top-2 right-2 z-30 text-[10px] px-2.5 py-1.5" aria-label="Expand to fullscreen" title="Expand">⛶ EXPAND</button>

        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" width="800" height="450" tabindex="0"></canvas>
    </div>

    <script>
        /******************************************************************
         * SUPER MARIO - ENGINE, SPRITES, LOCAL SAVE & AUDIO
         ******************************************************************/

        // --- 1. RETRO 8-BIT WEB AUDIO SYNTHESIZER ---
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmEnabled = true;
                this.bgmStep = 0;
                this.bgmTimer = 0;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, startTime = 0, slideTo = null, vol = 0.12) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime + startTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
                    }
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {}
            }
            updateBGM(phase, mode, world, subArea, starActive) {
                if (!this.enabled || !this.bgmEnabled || !this.ctx) return;
                if (phase !== 'playing' && phase !== 'world_map' && phase !== 'character_select') return;
                this.bgmTimer++;
                const tempo = starActive ? 6 : (mode === 'flappy_collab' ? 7 : 9);
                if (this.bgmTimer < tempo) return;
                this.bgmTimer = 0;

                const overworldNotes = [330, 330, 0, 330, 0, 262, 330, 0, 392, 0, 0, 0, 196, 0, 0, 0, 262, 0, 196, 0, 165, 0, 220, 0, 247, 0, 233, 220, 0, 196, 330, 392];
                const undergroundNotes = [262, 523, 220, 440, 233, 466, 0, 0, 196, 392, 165, 330, 175, 349, 0, 0];
                const castleNotes = [220, 233, 220, 196, 220, 233, 220, 185, 220, 233, 220, 196, 247, 262, 247, 220];
                const flappyNotes = [523, 659, 784, 659, 587, 698, 880, 698, 659, 784, 987, 784, 1046, 0, 784, 0];
                const starNotes = [523, 523, 523, 392, 440, 523, 392, 523, 587, 587, 587, 440, 494, 587, 440, 587];
                const mapNotes = [262, 330, 392, 523, 392, 330, 294, 349, 440, 587, 440, 349];

                let seq = overworldNotes;
                if (phase === 'world_map' || phase === 'character_select') seq = mapNotes;
                else if (starActive) seq = starNotes;
                else if (mode === 'flappy_collab') seq = flappyNotes;
                else if (subArea === 'underground') seq = undergroundNotes;
                else if (world === '1-2' || world === '1-4') seq = castleNotes;

                const freq = seq[this.bgmStep % seq.length];
                this.bgmStep++;
                if (freq > 0) {
                    this.playTone(freq, mode === 'flappy_collab' ? 'triangle' : 'square', 0.08, 0, null, 0.032);
                }
            }
            jump(isSuper = false) {
                this.init();
                this.playTone(isSuper ? 160 : 220, 'square', 0.22, 0, isSuper ? 580 : 680, 0.1);
            }
            oneUp() {
                this.init();
                const notes = [330, 392, 659, 523, 587, 784];
                notes.forEach((n, i) => this.playTone(n, 'triangle', 0.09, i * 0.075, null, 0.15));
            }
            checkpoint() {
                this.init();
                this.playTone(440, 'square', 0.09, 0, 660, 0.12);
                this.playTone(660, 'square', 0.18, 0.09, 880, 0.12);
            }
            cannon() {
                this.init();
                this.playTone(110, 'sawtooth', 0.18, 0, 45, 0.18);
            }
            flap() {
                this.init();
                this.playTone(280, 'triangle', 0.09, 0, 540, 0.13);
                this.playTone(540, 'square', 0.07, 0.05, 760, 0.07);
            }
            pipePass() {
                this.init();
                this.playTone(784, 'square', 0.07, 0, null, 0.09);
                this.playTone(1174.66, 'square', 0.18, 0.07, null, 0.1);
            }
            coin() {
                this.init();
                this.playTone(987.77, 'square', 0.08, 0, null, 0.1);
                this.playTone(1318.51, 'square', 0.28, 0.08, null, 0.1);
            }
            stomp() {
                this.init();
                this.playTone(400, 'triangle', 0.12, 0, 120, 0.16);
            }
            bump() {
                this.init();
                this.playTone(140, 'square', 0.09, 0, 75, 0.14);
            }
            breakBlock() {
                this.init();
                this.playTone(210, 'sawtooth', 0.08, 0, 80, 0.15);
                this.playTone(160, 'sawtooth', 0.12, 0.05, 55, 0.15);
            }
            powerupAppear() {
                this.init();
                const notes = [330, 392, 659, 523, 587, 784];
                notes.forEach((n, i) => this.playTone(n, 'square', 0.06, i * 0.055, null, 0.09));
            }
            powerupCollect() {
                this.init();
                const notes = [330, 392, 659, 523, 587, 784, 1046];
                notes.forEach((n, i) => this.playTone(n, 'triangle', 0.08, i * 0.05, null, 0.14));
            }
            fireball() {
                this.init();
                this.playTone(760, 'sawtooth', 0.09, 0, 220, 0.09);
            }
            dash() {
                this.init();
                this.playTone(300, 'triangle', 0.12, 0, 880, 0.12);
            }
            pipe() {
                this.init();
                this.playTone(440, 'square', 0.09, 0, 220, 0.12);
                this.playTone(330, 'square', 0.09, 0.11, 165, 0.12);
                this.playTone(220, 'square', 0.12, 0.22, 110, 0.12);
            }
            gemWarp() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.5, 987.77, 1174.66, 1318.51, 1567.98];
                notes.forEach((n, i) => this.playTone(n, 'triangle', 0.11, i * 0.065, n * 1.15, 0.15));
            }
            stageClear() {
                this.init();
                const melody = [262, 330, 392, 523, 659, 784, 659, 523, 784, 1046];
                melody.forEach((n, i) => this.playTone(n, 'square', 0.12, i * 0.1, null, 0.12));
            }
            die() {
                this.init();
                const notes = [
                    { f: 493.88, d: 0.08, t: 0.00 },
                    { f: 698.46, d: 0.14, t: 0.12 },
                    { f: 698.46, d: 0.10, t: 0.30 },
                    { f: 698.46, d: 0.12, t: 0.44 },
                    { f: 659.25, d: 0.12, t: 0.58 },
                    { f: 587.33, d: 0.12, t: 0.72 },
                    { f: 523.25, d: 0.22, t: 0.86 },
                    { f: 329.63, d: 0.14, t: 1.10 },
                    { f: 261.63, d: 0.28, t: 1.26 }
                ];
                notes.forEach(n => this.playTone(n.f, 'square', n.d, n.t, null, 0.13));
            }
            gameOverJingle() {
                this.init();
                const notes = [
                    { f: 523.25, d: 0.16, t: 0.00 },
                    { f: 392.00, d: 0.16, t: 0.22 },
                    { f: 329.63, d: 0.20, t: 0.44 },
                    { f: 440.00, d: 0.18, t: 0.68 },
                    { f: 493.88, d: 0.18, t: 0.88 },
                    { f: 440.00, d: 0.18, t: 1.08 },
                    { f: 415.30, d: 0.22, t: 1.28 },
                    { f: 466.16, d: 0.22, t: 1.52 },
                    { f: 415.30, d: 0.22, t: 1.76 },
                    { f: 329.63, d: 0.15, t: 2.00 },
                    { f: 293.66, d: 0.15, t: 2.16 },
                    { f: 329.63, d: 0.45, t: 2.32 }
                ];
                notes.forEach(n => this.playTone(n.f, 'triangle', n.d, n.t, null, 0.15));
            }
        }

        const sfx = new RetroAudio();

        // --- 2. PIXEL ART SPRITE GENERATOR ---
        function createPixelSprite(matrix, palette, scale = 2) {
            const h = matrix.length;
            const w = matrix[0].length;
            const off = document.createElement('canvas');
            off.width = w * scale;
            off.height = h * scale;
            const octx = off.getContext('2d');
            octx.imageSmoothingEnabled = false;
            for (let r = 0; r < h; r++) {
                for (let c = 0; c < w; c++) {
                    const ch = matrix[r][c];
                    if (ch !== '.' && palette[ch]) {
                        octx.fillStyle = palette[ch];
                        octx.fillRect(c * scale, r * scale, scale, scale);
                    }
                }
            }
            return off;
        }

        // Pack all 5 boolean achievements into a single tiny integer (0-31) for ultra-small Firebase payload
        const ACHIEVEMENT_BIT_ORDER = ['firstGem', 'pipeAce', 'coinHunter', 'bowserSlayer', 'mechaSlayer'];

        function packAchievementsMask(achObj = gameState.achievements) {
            let mask = 0;
            ACHIEVEMENT_BIT_ORDER.forEach((key, idx) => {
                if (achObj && achObj[key]) mask |= (1 << idx);
            });
            return mask;
        }

        function unpackAchievementsMask(mask, targetAch = gameState.achievements) {
            if (!Number.isFinite(mask)) return;
            const m = Math.floor(mask);
            ACHIEVEMENT_BIT_ORDER.forEach((key, idx) => {
                if ((m & (1 << idx)) !== 0) targetAch[key] = true;
            });
        }

                gf: Math.max(0, Math.floor(gameState.gemsFound || 0)),

                ct: gameState.crtEnabled ? 1 : 0
            };
        }

        // Merges a compact cloud packet from Firebase into local state without losing higher local progress
        function mergeCompactCloudPacket(pkt) {
            if (!pkt || typeof pkt !== 'object') return;
            let updatedLocal = false;

            if (Number.isFinite(pkt.ts) && pkt.ts > gameState.topScore) {
                gameState.topScore = Math.floor(pkt.ts);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.bp) && pkt.bp > gameState.bestPipes) {
                gameState.bestPipes = Math.floor(pkt.bp);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.gf) && pkt.gf > gameState.gemsFound) {
                gameState.gemsFound = Math.floor(pkt.gf);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.ac)) {
                const beforeMask = packAchievementsMask(gameState.achievements);
                unpackAchievementsMask(pkt.ac, gameState.achievements);
                if (packAchievementsMask(gameState.achievements) !== beforeMask) {
                    updatedLocal = true;
                }
            }
            // Only adopt cloud character/display preferences if local storage had none saved yet
            let hasLocalSave = false;
            try {
                hasLocalSave = Boolean(window.localStorage && window.localStorage.getItem(SAVE_STORAGE_KEY));
            } catch (e) {}

            if (!hasLocalSave) {
                if (['mario', 'luigi', 'wario', 'toad'].includes(pkt.ch)) gameState.selectedCharacter = pkt.ch;
                if (['duo', 'mario', 'bird'].includes(pkt.cm)) gameState.collabHero = pkt.cm;
                if ([1, 2, 3, 4].includes(pkt.ps)) gameState.pixelScale = pkt.ps;
                if (pkt.ct === 0 || pkt.ct === 1) gameState.crtEnabled = Boolean(pkt.ct);
                updatedLocal = true;
            }

            if (updatedLocal) {
                savePlayerProgress(false);
                updateHUD();
            }
        }

                const raw = window.localStorage ? window.localStorage.getItem(SAVE_STORAGE_KEY) : null;
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (!saved || typeof saved !== 'object') return;

                if (Number.isFinite(saved.topScore) && saved.topScore > gameState.topScore) {
                    gameState.topScore = Math.floor(saved.topScore);
                }
                if (Number.isFinite(saved.bestPipes) && saved.bestPipes > gameState.bestPipes) {
                    gameState.bestPipes = Math.floor(saved.bestPipes);
                }
                if (Number.isFinite(saved.gemsFound) && saved.gemsFound > gameState.gemsFound) {
                    gameState.gemsFound = Math.floor(saved.gemsFound);
                }
                if (Number.isFinite(saved.ac)) {
                    unpackAchievementsMask(saved.ac, gameState.achievements);
                }
                if (saved.achievements && typeof saved.achievements === 'object') {
                    Object.keys(gameState.achievements).forEach(k => {
                        if (saved.achievements[k]) gameState.achievements[k] = true;
                    });
                }
                if (['mario', 'luigi', 'wario', 'toad'].includes(saved.selectedCharacter)) {
                    gameState.selectedCharacter = saved.selectedCharacter;
                }
                if (['duo', 'mario', 'bird'].includes(saved.collabHero)) {
                    gameState.collabHero = saved.collabHero;

                if ([1, 2, 3, 4].includes(saved.pixelScale)) {
                    gameState.pixelScale = saved.pixelScale;
                }
                if (typeof saved.crtEnabled === 'boolean') {
                    gameState.crtEnabled = saved.crtEnabled;
                }
            } catch (e) {}
        }

        function actionsForCodeId(id) {
            const s = id || '';
            const k = s.toLowerCase();
            return {
                left:  s === 'ArrowLeft'  || s === 'KeyA' || k === 'arrowleft'  || k === 'a',
                right: s === 'ArrowRight' || s === 'KeyD' || k === 'arrowright' || k === 'd',
                down:  s === 'ArrowDown'  || s === 'KeyS' || k === 'arrowdown'  || k === 's',
                jump:  s === 'Space' || s === 'ArrowUp' || s === 'KeyW' || s === 'KeyZ' ||
                       k === ' ' || k === 'spacebar' || k === 'arrowup' || k === 'w' || k === 'z',
                dash:  s === 'KeyX' || s === 'ShiftLeft' || s === 'ShiftRight' || k === 'x' || k === 'shift'
            };
        }

        function syncControlStates() {
            keys.left = kbState.left || touchState.left;
            keys.right = kbState.right || touchState.right;
            keys.down = kbState.down || touchState.down;
            keys.jump = kbState.jump || touchState.jump;
            keys.dash = kbState.dash || touchState.dash;

        function canFireInputEdges() {

        function fireInputEdges(prevJump, prevDown, prevDash) {
            if (!canFireInputEdges()) return;

                    triggerInstantFlapOrAction();

            if (!prevDown && keys.down) keys.downJustPressed = true;
            if (!prevDash && keys.dash) keys.dashJustPressed = true;
        }

        function recomputeKeyboardState() {
            const prevJump = keys.jump, prevDown = keys.down, prevDash = keys.dash;
            let left = false, right = false, down = false, jump = false, dash = false;
            heldKeyCodes.forEach((id) => {
                const a = actionsForCodeId(id);
                left = left || a.left;
                right = right || a.right;
                down = down || a.down;
                jump = jump || a.jump;
                dash = dash || a.dash;
            });
            kbState.left = left;
            kbState.right = right;
            kbState.down = down;
            kbState.jump = jump;
            kbState.dash = dash;
            syncControlStates();
            fireInputEdges(prevJump, prevDown, prevDash);
        }

        // --- 6. IMPROVISED FLAPPY × MARIO COLLAB PROCEDURAL GAUNTLET GENERATOR ---
        function spawnFlappyChunk(chunkX, index) {
            const groundY = 12 * TILE; // 384

            // Ground tiles under this chunk
            const startCol = Math.floor(chunkX / TILE);
            for (let gx = startCol; gx < startCol + 9; gx++) {
                blocks.push({ x: gx * TILE, y: groundY, w: TILE, h: TILE * 2, type: 'ground' });
            }

            // Gap height and vertical position
            const gapH = Math.max(106, 138 - Math.floor(index * 1.05));
            const minGapY = 66;
            const maxGapY = groundY - gapH - 66;
            const gapY = Math.floor(minGapY + ((Math.sin(index * 1.7 + Math.random() * 2) * 0.5 + 0.5) * (maxGapY - minGapY)));

            // Starting from Pipe #4, every 3rd pipe pair gently oscillates up and down!
            const isMovingPipe = index >= 4 && (index % 3 === 0);
            const oscSpeed = isMovingPipe ? (0.032 + Math.min(0.025, index * 0.001)) : 0;
            const oscAmp = isMovingPipe ? 22 : 0;

            // Top Inverted Warp Pipe (hanging from top of screen)
            const topPipe = {
                x: chunkX,
                y: 0,
                baseH: gapY,
                w: TILE * 2,
                h: gapY,
                inverted: true,
                flappyGate: true,
                passed: false,
                oscillate: isMovingPipe,
                oscPhase: index * 0.9,
                oscSpeed,
                oscAmp
            };

            // Bottom Classic Warp Pipe (rising from ground)
            const bottomPipe = {
                x: chunkX,
                y: gapY + gapH,
                baseY: gapY + gapH,
                groundY,
                w: TILE * 2,
                h: groundY - (gapY + gapH),
                inverted: false,
                flappyGate: false,
                oscillate: isMovingPipe,
                oscPhase: index * 0.9,
                oscSpeed,
                oscAmp
            };

            pipes.push(topPipe, bottomPipe);

            // Coin or Golden Sky Ring inside the pipe gap
            if (index % 4 === 0) {
                skyRings.push({
                    x: chunkX + 20,
                    y: gapY + Math.floor(gapH / 2) - 22,
                    w: 24,
                    h: 44,
                    collected: false,
                    phase: index
                });
            } else {
                items.push({
                    x: chunkX + 22,
                    y: gapY + Math.floor(gapH / 2) - 12,
                    w: 20,
                    h: 24,
                    vx: 0,
                    vy: 0,
                    type: 'static_coin'
                });
            }

            // Between pipes: Question blocks, Bouncy Note Blocks, Sky Rings, Power-ups & Flying Enemies!
            const midX = chunkX + 140;
            const midY = Math.max(96, Math.min(260, gapY + 20));

            if (index % 5 === 0) {
                // Every 5th pipe in Flappy's Universe spawns a Return / Bonus Dimensional Gem Block!
                blocks.push({
                    x: midX,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'gem_block',
                    content: 'return_gem',
                    hit: false,
                    bounceY: 0
                });
            } else if (index % 4 === 2) {
                // Improvised Bouncy Musical Note Block + Golden Sky Ring above it!
                blocks.push({
                    x: midX,
                    y: Math.min(280, midY + 34),
                    w: TILE,
                    h: TILE,
                    type: 'note_block',
                    content: 'coin',
                    hit: false,
                    bounceY: 0
                });
                skyRings.push({
                    x: midX + 4,
                    y: Math.max(64, midY - 42),
                    w: 24,
                    h: 44,
                    collected: false,
                    phase: index * 1.3
                });
            } else if (index % 3 === 1) {
                const reward = (index % 9 === 0) ? 'star' : (index % 7 === 0 ? '1up' : 'power');
                blocks.push({
                    x: midX,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'question',
                    content: reward,
                    hit: false,
                    bounceY: 0
                });
                blocks.push({
                    x: midX + TILE,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'brick',
                    content: null,
                    coinsLeft: 2,
                    hit: false,
                    bounceY: 0
                });
            } else {
                for (let c = 0; c < 3; c++) {
                    items.push({
                        x: midX - 16 + c * 28,
                        y: midY - Math.sin((c / 2) * Math.PI) * 24,
                        w: 20,
                        h: 24,
                        vx: 0,
                        vy: 0,
                        type: 'static_coin'
                    });
                }
            }

            // Flying Paragoomba, Parakoopa, or Mini Mecha-Drone Wave
            if (index >= 10 && index % 10 === 0) {
                const drone = createEnemy('mecha_flappy', midX + 50, Math.max(90, Math.min(240, gapY + 20)));
                drone.hp = 2; // Mini-boss drone in Flappy Universe
                enemies.push(drone);
            } else if (index >= 2 && index % 2 === 0) {
                enemies.push({
                    type: index % 4 === 0 ? 'koopa' : 'goomba',
                    x: midX + 36,
                    y: Math.max(80, Math.min(280, gapY + 30)),
                    baseY: Math.max(80, Math.min(280, gapY + 30)),

                    h: 30,
                    vx: -0.9,
                    vy: 0,
                    flying: true,
                    flyPhase: index,
                    state: 'walk',
                    squashTimer: 0,
                    dead: false
                });
            }
        }

        function createEnemy(type, x, y) {
            return {
                type,
                x,
                y,
                baseY: y,
                w: type === 'mecha_flappy' ? 60 : (type === 'bowser' ? 48 : 30),
                h: type === 'mecha_flappy' ? 48 : (type === 'bowser' ? 48 : (type === 'bullet_bill' ? 24 : 30)),
                vx: type === 'bullet_bill' ? -4.8 : (type === 'bowser' || type === 'mecha_flappy' ? -1.4 : -1.3),
                vy: 0,
                flying: type === 'bullet_bill' || type === 'mecha_flappy',
                flyPhase: 0,
                state: 'walk',
                squashTimer: 0,
                timer: 0,
                hp: type === 'mecha_flappy' ? 6 : (type === 'bowser' ? 5 : 1),
                dead: false
            };
        }

        function respawnPlayerFromIntro() {
            clearInputState();
            gameState.time = 400;
            gameState.timeCounter = 0;
            player.power = 'small';
            player.dead = false;
            loadLevel(gameState.world, 'main');
            player.invincibleTimer = 60;
            if (gameState.mode === 'flappy_collab') {
                gameState.phase = 'ready';
            } else {
                gameState.phase = 'playing';
            }
            updateHUD();
        }

        function getSolidObstacles() {
            return [...blocks, ...pipes, ...movingPlatforms];
        }

        function triggerBlockHit(b) {
            if (b.type === 'note_block') {
                b.bounceY = -10;
                sfx.jump(true);
                addCoin();
                gameState.score += 300;
                spawnParticles(b.x + 16, b.y, '#f472b6', 8, 3.5);
                spawnFloatingText(b.x, b.y - 14, '🎵 NOTE BOOST +300!', '#f472b6');
                updateHUD();
                return;
            }
            if (b.type === 'gem_block' && !b.hit) {
                b.hit = true;
                b.type = 'used';
                b.bounceY = -10;
                sfx.powerupAppear();
                gameState.shakeTimer = 8;
                spawnParticles(b.x + 16, b.y, '#22d3ee', 14, 4.5);
                spawnFloatingText(b.x - 10, b.y - 18, '💎 HIDDEN GEM UNCOVERED!', '#22d3ee');
                items.push({
                    x: b.x + 2,
                    y: b.y - TILE - 4,
                    w: 28,
                    h: 24,
                    baseY: b.y - TILE - 4,
                    vx: 0,
                    vy: 0,
                    timer: 0,
                    type: b.content || 'flappy_gem'
                });
                return;
            }
            if (b.type === 'question' && !b.hit) {
                b.hit = true;
                b.type = 'used';
                b.bounceY = -8;
                if (b.content === 'coin') {
                    sfx.coin();
                    addCoin();
                    gameState.score += 200;
                    spawnFloatingText(b.x, b.y - 12, '+200', '#fef08a');
                    updateHUD();
                } else if (b.content === 'power') {
                    sfx.powerupAppear();
                    const pType = player.power === 'small' ? 'mushroom' : 'flower';
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: pType === 'mushroom' ? 1.6 : 0, vy: -2,
                        type: pType
                    });
                } else if (b.content === '1up') {
                    sfx.powerupAppear();
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: 1.8, vy: -2.5,
                        type: '1up'
                    });
                } else if (b.content === 'star') {
                    sfx.powerupAppear();
                    items.push({
                        x: b.x + 4, y: b.y - TILE, w: 24, h: 24,
                        vx: 2.2, vy: -5,
                        type: 'star'
                    });
                }
            } else if (b.type === 'brick') {
                b.bounceY = -6;
                if (b.coinsLeft && b.coinsLeft > 0) {
                    b.coinsLeft--;
                    sfx.coin();
                    addCoin();
                    gameState.score += 200;
                    spawnFloatingText(b.x, b.y - 12, '+200', '#fef08a');
                    if (b.coinsLeft === 0) b.type = 'used';
                    updateHUD();
                } else if (player.power !== 'small' || player.groundPounding) {
                    sfx.breakBlock();
                    spawnParticles(b.x + 16, b.y + 16, '#b45309', 10, 4.5);
                    blocks = blocks.filter(blk => blk !== b);
                    gameState.score += 50;
                    updateHUD();
                } else {
                    sfx.bump();
                }
            }
        }

        // Trigger instant Flap / Menu Confirm when player clicks or presses Space
        function triggerInstantFlapOrAction() {
            sfx.init();
            if (gameState.paused || gameState.isPortraitBlocked) return;

            // 1. MAIN 1985 STARTING UI
            if (gameState.phase === 'title') {
                clampTitleCursor();
                const actionIdx = gameState.titleCursor;

                if (actionIdx === 7 && gameState.previousPhase) {
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.phase = gameState.previousPhase;
                    gameState.previousPhase = null;
                    sfx.coin();
                } else if (actionIdx === 0) {
                    gameState.mapNodeIndex = 0;
                    gameState.phase = 'world_map';
                    sfx.coin();
                } else if (actionIdx === 1) {
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'flappy_collab';
                    gameState.lives = 3;
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.time = 400;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                } else if (actionIdx === 2) {
                    // Open 1985 Character Selection Screen
                    const currentIdx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                    gameState.charCursor = currentIdx >= 0 ? currentIdx : 0;
                    gameState.phase = 'character_select';
                    sfx.coin();
                } else if (actionIdx === 3) {
                    // Open Multiplayer Lobby (Connects ONLY when user wants multiplayer!)
                    gameState.mpCursor = 0;
                    gameState.phase = 'multiplayer_menu';
                    sfx.coin();
                } else if (actionIdx === 4) {
                    gameState.phase = 'trophies';
                    sfx.coin();
                } else if (actionIdx === 5) {
                    gameState.pixelScale = (gameState.pixelScale % 4) + 1;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (actionIdx === 6) {
                    gameState.crtEnabled = !gameState.crtEnabled;
                    document.getElementById('app-root').classList.toggle('crt-off', !gameState.crtEnabled);
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                }
                return;
            }

            // 1A. 1985 CHARACTER SELECTION SCREEN
            if (gameState.phase === 'character_select') {
                if (gameState.charCursor < CHARACTER_ROSTER.length) {
                    gameState.selectedCharacter = CHARACTER_ROSTER[gameState.charCursor].id;
                    sfx.powerupCollect();
                    savePlayerProgress();
                } else if (gameState.charCursor === CHARACTER_ROSTER.length) {
                    // Cycle Flappy Wingman Mode (Duo / Solo Hero / Solo Bird)
                    const curIdx = COLLAB_HERO_MODES.findIndex(m => m.id === gameState.collabHero);
                    gameState.collabHero = COLLAB_HERO_MODES[(curIdx + 1) % COLLAB_HERO_MODES.length].id;
                    sfx.coin();
                    savePlayerProgress();
                } else {
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 1B. MULTIPLAYER LOBBY UI (IN 1985 STARTING UI STYLE)
            if (gameState.phase === 'multiplayer_menu') {
                const rooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
                if (gameState.mpCursor === 0) {
                    if (gameState.multiplayerEnabled) {
                        if (window.mpDisconnect) window.mpDisconnect();
                    } else {
                        if (window.mpConnect) window.mpConnect();
                    }
                    sfx.coin();
                } else if (gameState.mpCursor === 1) {
                    const idx = (rooms.indexOf(gameState.mpRoom) + 1) % rooms.length;
                    gameState.mpRoom = rooms[idx];
                    if (window.mpSwitchRoom) window.mpSwitchRoom(gameState.mpRoom);
                    sfx.bump();
                } else if (gameState.mpCursor === 2) {
                    if (window.mpConnect && !gameState.multiplayerEnabled) window.mpConnect();
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'classic';
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'playing';
                    sfx.powerupCollect();
                } else if (gameState.mpCursor === 3) {
                    if (window.mpConnect && !gameState.multiplayerEnabled) window.mpConnect();
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.previousPhase = null;
                    gameState.mode = 'flappy_collab';
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                    sfx.powerupCollect();
                } else if (gameState.mpCursor === 4) {
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // 2. TROPHIES SCREEN (IN STARTING UI STYLE)
            if (gameState.phase === 'trophies') {
                gameState.phase = 'title';
                sfx.bump();
                return;
            }

            // 3. WORLD SELECT SCREEN (IN STARTING UI STYLE)
            if (gameState.phase === 'world_map') {
                if (gameState.mapNodeIndex === OVERWORLD_NODES.length) {
                    gameState.phase = 'title';
                    sfx.bump();
                    return;
                }
                const node = OVERWORLD_NODES[gameState.mapNodeIndex];
                clearInputState();
                gameState.menuConfirmCooldown = 10;
                gameState.previousPhase = null;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                gameState.time = 400;
                if (node.mode === 'flappy_collab') {
                    gameState.mode = 'flappy_collab';
                    loadLevel('1-1', 'main');
                    gameState.phase = 'ready';
                } else {
                    gameState.mode = 'classic';
                    loadLevel(node.id, 'main');
                    gameState.phase = 'playing';
                }
                sfx.powerupCollect();
                return;
            }

            // 4. COURSE CLEAR SCREEN (IN STARTING UI STYLE)
            if (gameState.phase === 'course_clear') {
                if (gameState.clearCursor === 0) {
                    const order = ['1-1', '1-2', '1-3', '1-4'];
                    const nextIdx = (order.indexOf(gameState.world) + 1) % order.length;
                    clearInputState();
                    gameState.menuConfirmCooldown = 10;
                    gameState.mode = 'classic';
                    gameState.previousPhase = null;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    gameState.time = 400;
                    loadLevel(order[nextIdx], 'main');
                    gameState.phase = 'playing';
                    sfx.powerupCollect();
                } else if (gameState.clearCursor === 1) {
                    gameState.mapNodeIndex = 0;
                    gameState.phase = 'world_map';
                    sfx.coin();
                } else {
                    gameState.titleCursor = 0;
                    gameState.phase = 'title';
                    sfx.bump();
                }
                return;
            }

            // If on OG Game Over screen, clicking immediately starts a fresh run!
            if (gameState.phase === 'gameover') {
                if (gameState.gameOverTimer > 8) {
                    gameState.lives = 3;
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.checkpointX = null;
                    gameState.checkpointY = null;
                    respawnPlayerFromIntro();
                    if (gameState.mode === 'flappy_collab') {
                        gameState.phase = 'playing';
                        player.vy = -7.6;
                        player.flapAnimTimer = 12;
                        sfx.flap();
                        spawnParticles(player.x, player.y + player.h / 2, '#fef08a', 5, 2.5);
                    }
                }
                return;
            }

            // If in stage intro screen, properly reload & respawn on click
            if (gameState.phase === 'stage_intro') {
                respawnPlayerFromIntro();
                if (gameState.mode === 'flappy_collab') {
                    gameState.phase = 'playing';
                    player.vy = -7.6;
                    player.flapAnimTimer = 12;
                    sfx.flap();
                }
                return;
            }

            if (gameState.phase === 'dying') {
                if (gameState.deathTimer > 45 && gameState.lives > 0) {
                    respawnPlayerFromIntro();
                }
                return;
            }
            if (gameState.phase === 'warping') return;

            if (gameState.phase === 'ready') {
                gameState.phase = 'playing';
                gameState.running = true;
            }

            if (gameState.mode === 'flappy_collab') {
                const charSpec = getActiveCharacterSpec();
                player.vy = -7.6 * (charSpec.id === 'luigi' ? 1.04 : 1.0);
                player.onGround = false;
                player.groundPounding = false;
                player.flapAnimTimer = 12;
                sfx.flap();
                spawnParticles(player.x - 4, player.y + player.h / 2, '#ffffff', 5, 2.2);

                if (player.power === 'fire' && player.fireCooldown === 0) {
                    player.fireCooldown = 16;
                    fireballs.push({
                        x: player.x + player.w + 4,
                        y: player.y + 12,
                        vx: 8.5,
                        vy: 1.2,
                        w: 10, h: 10,
                        fromBowser: false,
                        bounces: 0
                    });
                }
            } else {
                keys.jumpJustPressed = true;
            }
        }

        // --- 8. MAIN GAME UPDATE LOOP (LOCKED AT 60HZ VIA FIXED TIMESTEP) ---
        function update() {
            if (!gameState.running || gameState.paused || gameState.isPortraitBlocked) return;

            if (gameState.menuConfirmCooldown > 0) {
                gameState.menuConfirmCooldown--;
                keys.jumpJustPressed = false;
                keys.dashJustPressed = false;
                keys.downJustPressed = false;
            }

            if (gameState.score > gameState.topScore) {
                gameState.topScore = gameState.score;
                savePlayerProgress();
            }

            if (gameState.achievementBanner) {
                gameState.achievementBanner.timer--;
                if (gameState.achievementBanner.timer <= 0) {
                    gameState.achievementBanner = null;
                }
            }

            sfx.updateBGM(gameState.phase, gameState.mode, gameState.world, gameState.subArea, player.starTimer > 0);

            if (gameState.shakeTimer > 0) gameState.shakeTimer--;

            // 0. CLASSIC 1985 STARTING UI & SUB-MENUS
            if (
                gameState.phase === 'title' ||
                gameState.phase === 'world_map' ||
                gameState.phase === 'character_select' ||
                gameState.phase === 'multiplayer_menu' ||
                gameState.phase === 'trophies' ||
                gameState.phase === 'course_clear'
            ) {
                if (!gameState.previousPhase && gameState.phase !== 'course_clear') {
                    player.animTimer++;
                    player.x = 88 + Math.sin(player.animTimer * 0.03) * 28;
                    player.y = 12 * TILE - player.h;
                    player.onGround = true;
                    player.facing = Math.cos(player.animTimer * 0.03) >= 0 ? 1 : -1;
                    player.leanAngle = 0;
                }
                return;
            }

            // 1. OG MARIO DEATH ANIMATION SEQUENCE
            if (gameState.phase === 'dying') {
                gameState.deathTimer++;
                if (gameState.deathTimer === 18) {
                    player.vy = -9.5;
                } else if (gameState.deathTimer > 18) {
                    player.vy += 0.48;
                    player.y += player.vy;
                }
                if (gameState.deathTimer > 85) {
                    savePlayerProgress();
                    if (window.queueCompactCloudSync) window.queueCompactCloudSync(true);
                    if (gameState.lives <= 0) {
                        gameState.phase = 'gameover';
                        gameState.gameOverTimer = 0;
                        sfx.gameOverJingle();
                    } else {
                        gameState.phase = 'stage_intro';
                        gameState.stageIntroTimer = 0;
                    }
                    updateHUD();
                }
                return;
            }

            // 2. OG MARIO BLACK-SCREEN GAME OVER SCENE
            if (gameState.phase === 'gameover') {
                gameState.gameOverTimer++;
                return;
            }

            // 3. OG MARIO STAGE INTRO ("WORLD 1-1 / MARIO x 2")
            if (gameState.phase === 'stage_intro') {
                gameState.stageIntroTimer++;
                if (gameState.stageIntroTimer > 65) {
                    respawnPlayerFromIntro();
                }
                return;
            }

            // 4. DIMENSIONAL GEM WARP PORTAL ANIMATION
            if (gameState.phase === 'warping') {
                gameState.warpTimer++;
                player.y -= 1.2;
                player.leanAngle += 0.25;
                if (gameState.warpTimer % 4 === 0) {
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#22d3ee', 6, 4);
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                if (gameState.warpTimer > 52) {
                    gameState.mode = gameState.warpTargetMode;
                    if (gameState.mode === 'flappy_collab') {
                        loadLevel('1-1', 'main');
                        gameState.phase = 'ready';
                        spawnFloatingText(player.x, player.y - 24, 'WELCOME TO FLAPPY UNIVERSE!', '#22d3ee');
                    } else {
                        loadLevel('1-1', 'main', 14 * TILE, 6 * TILE);
                        gameState.phase = 'playing';
                        player.invincibleTimer = 90;
                        spawnFloatingText(player.x, player.y - 24, 'RETURNED TO MARIO WORLD!', '#4ade80');
                    }
                    updateHUD();
                }
                return;
            }

            // 5. READY STATE
            if (gameState.phase === 'ready') {
                player.animTimer++;
                if (gameState.mode === 'flappy_collab') {
                    player.y = 210 + Math.sin(player.animTimer * 0.08) * 10;
                    player.flapAnimTimer = (Math.floor(player.animTimer / 8) % 2 === 0) ? 5 : 0;
                    player.leanAngle = 0.18 + Math.sin(player.animTimer * 0.08) * 0.05;
                }
                if (keys.jumpJustPressed || keys.dashJustPressed || keys.left || keys.right) {
                    triggerInstantFlapOrAction();
                }
                keys.jumpJustPressed = false;
                keys.dashJustPressed = false;
                keys.downJustPressed = false;
                return;
            }

            // Level Complete / Flagpole Sequence
            if (gameState.flagSlide) {
                if (player.y < 12 * TILE - player.h) {
                    player.y += 4;
                    gameState.flagY = Math.min(11 * TILE, gameState.flagY + 4);
                } else {
                    gameState.levelCompleteTimer++;
                    if (gameState.levelCompleteTimer > 40) {
                        gameState.flagSlide = false;
                        gameState.clearHeadline = `WORLD ${gameState.world} CLEAR!`;
                        gameState.clearCursor = 0;
                        savePlayerProgress();
                        if (window.queueCompactCloudSync) window.queueCompactCloudSync(true);
                        gameState.phase = 'course_clear';
                    }
                }
                return;
            }

            // Timer countdown
            gameState.timeCounter++;
            if (gameState.timeCounter >= 40) {
                gameState.timeCounter = 0;
                if (gameState.time > 0) {
                    gameState.time--;
                    if (gameState.time === 0) {
                        hurtPlayer(true);
                        return;
                    }
                }
            }

            // Update Moving Platforms
            movingPlatforms.forEach(mp => {
                const prevX = mp.x;
                mp.x += mp.vx;
                if (mp.x < mp.minX || mp.x > mp.maxX) mp.vx *= -1;
                const deltaX = mp.x - prevX;
                if (
                    player.onGround &&
                    player.x + player.w > mp.x &&
                    player.x < mp.x + mp.w &&
                    Math.abs((player.y + player.h) - mp.y) <= 4
                ) {
                    player.x += deltaX;
                }
            });

            // Update Oscillating Warp Pipes in Flappy's Universe
            if (gameState.mode === 'flappy_collab') {
                pipes.forEach(p => {
                    if (p.oscillate) {
                        p.oscPhase += p.oscSpeed;
                        const offset = Math.round(Math.sin(p.oscPhase) * p.oscAmp);
                        if (p.inverted) {
                            p.h = Math.max(40, p.baseH + offset);
                        } else {
                            p.y = p.baseY + offset;
                            p.h = Math.max(40, p.groundY - p.y);
                        }
                    }
                });
            }

            // Block bounce recovery
            blocks.forEach(b => {
                if (b.bounceY < 0) b.bounceY += 1.5;
                if (b.bounceY > 0) b.bounceY = 0;
            });

            // Update Player Invincibility / Cooldowns
            if (player.invincibleTimer > 0) player.invincibleTimer--;
            if (player.starTimer > 0) {
                player.starTimer--;
                if (player.starTimer === 0) updateHUD();
            }
            if (player.fireCooldown > 0) player.fireCooldown--;
            if (player.flapAnimTimer > 0) player.flapAnimTimer--;

            // Secret Warp Pipe check
            if (keys.down && player.onGround && gameState.mode !== 'flappy_collab') {
                for (const p of pipes) {
                    if (p.warpTo && player.x + player.w > p.x + 6 && player.x < p.x + p.w - 6 && Math.abs((player.y + player.h) - p.y) < 6) {
                        sfx.pipe();
                        loadLevel(p.warpTo.world, p.warpTo.subArea, p.warpTo.x, p.warpTo.y);
                        return;
                    }
                }
            }

            // Mid-Stage Checkpoint Flag Check
            if (checkpointFlag && !checkpointFlag.activated && rectOverlap(player, checkpointFlag)) {
                checkpointFlag.activated = true;
                gameState.checkpointX = checkpointFlag.x;
                gameState.checkpointY = checkpointFlag.y - 8;
                sfx.checkpoint();
                gameState.score += 500;
                spawnParticles(checkpointFlag.x + 10, checkpointFlag.y, '#4ade80', 12, 4);
                spawnFloatingText(checkpointFlag.x, checkpointFlag.y - 14, '🚩 CHECKPOINT SAVED!', '#4ade80');
            }

            // Flagpole & World 1-2 / 1-4 Axe Goal Check
            if (flagpole && player.x + player.w >= flagpole.x + 8 && !gameState.flagSlide) {
                sfx.stageClear();
                gameState.flagSlide = true;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                gameState.score += 2000;
                savePlayerProgress();
                spawnFloatingText(player.x, player.y, 'STAGE CLEAR +2000!', '#4ade80');
                updateHUD();
                return;
            }
            if (axeObj && rectOverlap(player, axeObj)) {
                sfx.stageClear();
                gameState.score += 5000;
                gameState.checkpointX = null;
                gameState.checkpointY = null;
                blocks = blocks.filter(b => b.type !== 'bridge');
                enemies.forEach(e => {
                    if (e.type === 'bowser') {
                        e.dead = true;
                        unlockAchievement('bowserSlayer');
                    }
                    if (e.type === 'mecha_flappy') {
                        e.dead = true;
                        unlockAchievement('mechaSlayer');
                    }
                });
                axeObj = null;
                savePlayerProgress();
                const bossName = gameState.world === '1-4' ? 'MECHA-FLAPPY' : 'BOWSER';
                spawnFloatingText(player.x, player.y, `${bossName} DEFEATED +5000!`, '#facc15');
                updateHUD();
                setTimeout(() => {
                    gameState.clearHeadline = `${bossName} DEFEATED!`;
                    gameState.clearCursor = 0;
                    gameState.phase = 'course_clear';
                }, 1200);
            }

            const charSpec = getActiveCharacterSpec();

            // Horizontal Movement
            if (gameState.mode === 'flappy_collab') {
                const baseScroll = 3.3 + Math.min(1.8, gameState.pipesPassed * 0.04);
                player.vx = player.dashTimer > 0 ? 7.8 : baseScroll;
                player.facing = 1;

                // Spawn new Flappy-Mario pipe chunks ahead infinitely
                while (gameState.nextFlappyX < gameState.cameraX + canvas.width + 360) {
                    const nextIdx = Math.floor(gameState.nextFlappyX / 260);
                    spawnFlappyChunk(gameState.nextFlappyX, nextIdx);
                    gameState.nextFlappyX += 260;
                }

                // Cull off-screen blocks, pipes, items, skyRings, and bypassed enemies behind camera!
                const cullX = gameState.cameraX - 240;
                blocks = blocks.filter(b => b.x + b.w > cullX);
                pipes = pipes.filter(p => p.x + p.w > cullX);
                items = items.filter(it => it.x + it.w > cullX);
                skyRings = skyRings.filter(sr => sr.x + sr.w > cullX && !sr.collected);
                enemies = enemies.filter(en => en.x + en.w > cullX);
            } else {
                const maxSpeed = (keys.dash ? 5.6 : 4.1) * charSpec.speedMul;
                const accel = (player.onGround ? 0.42 : 0.28) * charSpec.speedMul;
                const friction = player.onGround ? 0.82 : 0.93;

                if (!player.groundPounding) {
                    if (keys.left) {
                        player.vx = Math.max(player.vx - accel, -maxSpeed);
                        player.facing = -1;
                    } else if (keys.right) {
                        player.vx = Math.min(player.vx + accel, maxSpeed);
                        player.facing = 1;
                    } else {
                        player.vx *= friction;
                        if (Math.abs(player.vx) < 0.08) player.vx = 0;
                    }
                }
            }

            // 2.0 Air Dash & Fireball Action (X / Shift / B button)
            if (keys.dashJustPressed) {
                if (player.power === 'fire' && player.fireCooldown === 0) {
                    sfx.fireball();
                    player.fireCooldown = 18;
                    fireballs.push({
                        x: player.facing === 1 ? player.x + player.w : player.x - 10,
                        y: player.y + 14,
                        vx: player.facing * 7.5,
                        vy: 2,
                        w: 10, h: 10,
                        fromBowser: false,
                        bounces: 0
                    });
                } else if (gameState.moves20 && (gameState.mode === 'flappy_collab' || (!player.onGround && player.canAirDash)) && player.dashTimer === 0) {
                    sfx.dash();
                    player.canAirDash = false;
                    player.dashTimer = charSpec.id === 'wario' ? 13 : 10;
                    player.vx = player.facing * (charSpec.id === 'wario' ? 9.2 : 8.5);
                    player.vy = 0;
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#38bdf8', 8, 3);
                }
            }

            // 2.0 Ground Pound (Down in Mid-Air)
            if (gameState.moves20 && keys.downJustPressed && !player.onGround && !player.groundPounding) {
                player.groundPounding = true;
                if (gameState.mode !== 'flappy_collab') player.vx = 0;
                player.vy = 10.5;
                sfx.stomp();
            }

            // Gravity & Dash handling
            if (player.dashTimer > 0) {
                player.dashTimer--;
                player.vy = 0;
                player.trail.push({ x: player.x, y: player.y, h: player.h, alpha: 0.6 });
            } else if (gameState.mode === 'flappy_collab') {
                player.vy = Math.min(player.vy + 0.42 * charSpec.gravityMul, 9.5);
            } else {
                const gravity = ((keys.jump && player.vy < 0) ? 0.34 : 0.62) * charSpec.gravityMul;
                player.vy = Math.min(player.vy + gravity, 12);
            }

            // Fade dash afterimages
            for (let i = player.trail.length - 1; i >= 0; i--) {
                player.trail[i].alpha -= 0.08;
                if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
            }

            // Coyote timer
            if (player.onGround) {
                player.coyoteTimer = 7;
                player.canAirDash = true;
            } else if (player.coyoteTimer > 0) {
                player.coyoteTimer--;
            }

            // Jump / Flap & 2.0 Wall-Jump
            if (keys.jumpJustPressed) {
                if (gameState.mode === 'flappy_collab') {
                    triggerInstantFlapOrAction();
                } else if (player.coyoteTimer > 0) {
                    player.vy = -10.8 * charSpec.jumpMul;
                    player.onGround = false;
                    player.coyoteTimer = 0;
                    sfx.jump(player.power !== 'small');
                } else if (gameState.moves20 && player.wallSliding !== 0) {
                    player.vy = -10.2 * charSpec.jumpMul;
                    player.vx = -player.wallSliding * 6.2;
                    player.facing = -player.wallSliding;
                    player.wallSliding = 0;
                    sfx.jump(true);
                    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 6, 2.5);
                }
            }

            // Keep Mario inside top screen boundary in Flappy Collab
            if (gameState.mode === 'flappy_collab' && player.y < 4) {
                player.y = 4;
                player.vy = 0;
            }

            // Move & Collide X
            const obstacles = getSolidObstacles();
            player.x += player.vx;
            if (player.x < gameState.cameraX) {
                player.x = gameState.cameraX;
                player.vx = 0;
            }

            player.wallSliding = 0;
            for (let i = 0; i < obstacles.length; i++) {
                const ob = obstacles[i];
                if (rectOverlap(player, ob)) {
                    if (gameState.mode === 'flappy_collab' && pipes.includes(ob)) {
                        if (player.starTimer > 0) {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            gameState.score += 500;
                            spawnFloatingText(player.x, player.y, 'STAR SMASH +500!', '#facc15');
                            continue;
                        } else if (player.invincibleTimer > 0) {
                            continue;
                        } else if (player.power !== 'small') {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            hurtPlayer(false);
                            continue;
                        } else {
                            hurtPlayer(true);
                            return;
                        }
                    }

                    if (player.vx > 0) {
                        player.x = ob.x - player.w;
                        if (!player.onGround && keys.right) {
                            player.wallSliding = 1;
                        }
                    } else if (player.vx < 0) {
                        player.x = ob.x + ob.w;
                        if (!player.onGround && keys.left) player.wallSliding = -1;
                    }
                    if (gameState.mode !== 'flappy_collab') player.vx = 0;
                }
            }

            // Slow descent during 2.0 Wall Slide
            if (gameState.moves20 && player.wallSliding !== 0 && player.vy > 1.8) {
                player.vy = 1.8;
            }

            // Move & Collide Y
            player.y += player.vy;
            player.onGround = false;
            let hitCeilingBlock = false;

            for (let i = 0; i < obstacles.length; i++) {
                const ob = obstacles[i];
                if (rectOverlap(player, ob)) {
                    if (gameState.mode === 'flappy_collab' && pipes.includes(ob)) {
                        if (player.starTimer > 0) {
                            sfx.breakBlock();
                            spawnParticles(ob.x + ob.w / 2, player.y, '#4ade80', 12, 5);
                            pipes = pipes.filter(p => p !== ob);
                            continue;
                        } else if (player.invincibleTimer > 0) {
                            continue;
                        } else if (player.power !== 'small') {
                            sfx.breakBlock();
                            pipes = pipes.filter(p => p !== ob);
                            hurtPlayer(false);
                            continue;
                        } else {
                            hurtPlayer(true);
                            return;
                        }
                    }

                    if (player.vy > 0) {
                        player.y = ob.y - player.h;
                        if (ob.type === 'note_block') {
                            player.vy = -9.6;
                            player.onGround = false;
                            player.canAirDash = true;
                            triggerBlockHit(ob);
                        } else {
                            player.vy = 0;
                            player.onGround = true;
                        }
                        gameState.comboCount = 0;

                        if (player.groundPounding) {
                            player.groundPounding = false;
                            gameState.shakeTimer = 8;
                            spawnParticles(player.x + player.w / 2, player.y + player.h, '#facc15', 10, 4);
                            if (ob.type === 'brick' || ob.type === 'question' || ob.type === 'gem_block' || ob.type === 'note_block') {
                                triggerBlockHit(ob);
                            }
                        }
                    } else if (player.vy < 0) {
                        player.y = ob.y + ob.h;
                        player.vy = 0;
                        if (!hitCeilingBlock) {
                            hitCeilingBlock = true;
                            if (ob.type === 'question' || ob.type === 'brick' || ob.type === 'gem_block' || ob.type === 'note_block') {
                                triggerBlockHit(ob);
                            } else {
                                sfx.bump();
                            }
                        }
                    }
                }
            }

            // Ambient sparkles on Hidden Gem Blocks
            if (player.animTimer % 18 === 0) {
                blocks.forEach(b => {
                    if (b.type === 'gem_block' && Math.abs(b.x - player.x) < 420) {
                        spawnParticles(b.x + 16, b.y + 8, '#22d3ee', 2, 1.4);
                    }
                });
            }

            // Golden Sky Rings in Flappy's Universe
            for (let i = skyRings.length - 1; i >= 0; i--) {
                const sr = skyRings[i];
                if (!sr.collected && rectOverlap(player, sr)) {
                    sr.collected = true;
                    sfx.coin();
                    addCoin();
                    gameState.score += 500;
                    player.canAirDash = true;
                    spawnParticles(sr.x + 12, sr.y + 22, '#facc15', 10, 4);
                    spawnFloatingText(sr.x, sr.y, '⭕ SKY RING +500!', '#facc15');
                    skyRings.splice(i, 1);
                }
            }

            // Score Flappy Pipe Gates Passed!
            if (gameState.mode === 'flappy_collab') {
                pipes.forEach(p => {
                    if (p.flappyGate && !p.passed && player.x > p.x + p.w) {
                        p.passed = true;
                        gameState.pipesPassed++;
                        if (gameState.pipesPassed >= 10) unlockAchievement('pipeAce');
                        if (gameState.pipesPassed > gameState.bestPipes) {
                            gameState.bestPipes = gameState.pipesPassed;
                            savePlayerProgress();
                        }
