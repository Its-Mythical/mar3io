<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iPhone Safari has no Element Fullscreen API at all. "Add to Home Screen"
         is the only route to a chrome-free screen there, and these tags make
         the installed shortcut launch fullscreen. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Super Mario">
    <title>Super Mario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Press Start 2P', monospace;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
        }
        /* Subtle Retro CRT Scanlines & Pixel Grid */
        .crt-overlay {
            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.32) 50%
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 0, 0, 0.04),
                    rgba(0, 255, 0, 0.01),
                    rgba(0, 0, 255, 0.04)
                );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .crt-off .crt-overlay {
            display: none;
        }
        /* Classy Beveled 8-Bit Pixel Art UI & Buttons */
        .classy-pixel-modal {
            background-color: #0c1021;
            border: 4px solid #facc15;
            outline: 4px solid #000000;
            box-shadow:
                inset 0 0 0 4px #1e293b,
                0 12px 0 #000000;
            border-radius: 0;
        }
        .pixel-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 0.95rem;
            font-size: 9px;
            line-height: 1;
            color: #fefce8;
            background-color: #1e293b;
            border-top: 3px solid #64748b;
            border-left: 3px solid #64748b;
            border-right: 3px solid #020617;
            border-bottom: 3px solid #020617;
            outline: 2px solid #000000;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: transform 0.05s;
        }
        .pixel-btn:hover {
            background-color: #334155;
            color: #facc15;
            border-top-color: #94a3b8;
            border-left-color: #94a3b8;
        }
        .pixel-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-gold {
            background-color: #b45309;
            color: #ffffff;
            border-top: 3px solid #fde047;
            border-left: 3px solid #fde047;
            border-right: 3px solid #451a03;
            border-bottom: 3px solid #451a03;
        }
        .pixel-btn-gold:hover {
            background-color: #d97706;
            color: #ffffff;
        }
        .pixel-btn-active {
            background-color: #15803d;
            color: #ffffff;
            border-top: 3px solid #86efac;
            border-left: 3px solid #86efac;
            border-right: 3px solid #052e16;
            border-bottom: 3px solid #052e16;
        }
        .pixel-btn-active:hover {
            background-color: #16a34a;
            color: #ffffff;
        }
        .pixel-top-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.42rem 0.7rem;
            font-size: 8px;
            color: #fef08a;
            background-color: #0f172a;
            border-top: 2px solid #facc15;
            border-left: 2px solid #facc15;
            border-right: 2px solid #713f12;
            border-bottom: 2px solid #713f12;
            outline: 2px solid #000000;
            box-shadow: 0 3px 0 #000000;
            cursor: pointer;
        }
        .pixel-top-btn:hover {
            background-color: #1e293b;
            color: #ffffff;
        }
        .pixel-top-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-reset {
            background-color: #991b1b;
            color: #fef2f2;
            border-top: 3px solid #f87171;
            border-left: 3px solid #f87171;
            border-right: 3px solid #450a0a;
            border-bottom: 3px solid #450a0a;
            outline: 2px solid #000000;
            box-shadow: 0 3px 0 #000000;
        }
        .pixel-btn-reset:hover {
            background-color: #b91c1c;
            color: #facc15;
            border-top-color: #fca5a5;
            border-left-color: #fca5a5;
        }
        .pixel-btn-reset:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000000;
        }
        /* Classy Beveled Pixel D-Pad & Action Buttons */
        .pixel-dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            border-top: 3px solid #64748b;
            border-left: 3px solid #64748b;
            border-right: 3px solid #020617;
            border-bottom: 3px solid #020617;
            outline: 2px solid #000000;
            color: #f8fafc;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
        }
        .pixel-dpad-btn:active {
            transform: translateY(3px);
            background-color: #facc15;
            color: #000000;
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #b91c1c;
            border-top: 3px solid #fca5a5;
            border-left: 3px solid #fca5a5;
            border-right: 3px solid #450a0a;
            border-bottom: 3px solid #450a0a;
            outline: 2px solid #000000;
            color: #ffffff;
            box-shadow: 0 4px 0 #000000;
            cursor: pointer;
        }
        .pixel-action-btn:active {
            transform: translateY(3px);
            background-color: #facc15;
            color: #000000;
            box-shadow: 0 1px 0 #000000;
        }
        .pixel-btn-pressed {
            transform: translateY(3px) !important;
            background-color: #facc15 !important;
            color: #000000 !important;
            box-shadow: 0 1px 0 #000000 !important;
        }
        /* Nitro button while the engine is overheated */
        .kart-mode-pad.kart-overheat #t-down {
            background-color: #7f1d1d !important;
            border-top-color: #ef4444 !important;
            border-left-color: #ef4444 !important;
            color: #fecaca !important;
        }

        /* Clean Nitro SVG highlight when in Mario Kart Mode */
        .kart-mode-pad #t-down {
            background-color: #0369a1;
            border-top: 3px solid #7dd3fc;
            border-left: 3px solid #7dd3fc;
            border-right: 3px solid #082f49;
            border-bottom: 3px solid #082f49;
            color: #fef08a;
        }
        /* Ergonomic Corner Docking for Mobile & Subtle Auto-Fade on Desktop PC */
        #virtual-gamepad {
            padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
            padding-left: max(0.35rem, env(safe-area-inset-left, 0px));
            padding-right: max(0.35rem, env(safe-area-inset-right, 0px));
            transition: opacity 0.25s ease;   /* idle fade + desktop hover fade */
        }
        .pad-btn-size {
            width: clamp(38px, 9.5vmin, 50px);
            height: clamp(38px, 9.5vmin, 50px);
            font-size: clamp(9px, 2.2vmin, 12px);
            touch-action: none;
        }
        /* Landscape on a phone leaves little height, so the on-screen buttons
           get a bigger minimum target and scale with the shorter edge. */
        html.touch-ui .pad-btn-size {
            width: clamp(46px, 12vmin, 62px);
            height: clamp(46px, 12vmin, 62px);
            font-size: clamp(11px, 3vmin, 15px);
        }
        /* Desktop keeps the original small buttons. Declared after the touch rule
           so it wins even if both classes ever end up on <html>. */
        html.desktop-ui .pad-btn-size {
            width: clamp(38px, 9.5vmin, 50px);
            height: clamp(38px, 9.5vmin, 50px);
            font-size: clamp(9px, 2.2vmin, 12px);
        }
        /* Controls fade back while idle so they stop covering the view, and
           come straight back to full opacity on any touch. */
        html.touch-ui.pad-idle #virtual-gamepad { opacity: 0.55; }
        @media (hover: hover) and (pointer: fine) {
            #virtual-gamepad:not(.touch-active) {
                opacity: 0.35;
            }
            #virtual-gamepad:hover {
                opacity: 0.95;
            }
        }
        /* 1985 NES Portrait Rotate Dialog Styling */
        .nes-brick-border {
            background-color: #000000;
            border: 6px solid #c84c0c;
            outline: 4px solid #fcBCB0;
            box-shadow:
                inset 0 0 0 4px #000000,
                0 0 0 8px #000000,
                0 14px 0 #000000;
        }
        .nes-signboard {
            background-color: #c84c0c;
            border: 3px solid #fcBCB0;
            box-shadow: 4px 4px 0 #000000;
        }
        @keyframes nesRotatePhone {
            0%, 15% { transform: rotate(0deg); }
            45%, 75% { transform: rotate(-90deg); }
            95%, 100% { transform: rotate(0deg); }
        }
        .nes-rotate-anim {
            animation: nesRotatePhone 2.6s steps(6, end) infinite;
        }

        /* =====================================================================
           TOUCH CONTROLS
           The D-pad is a single row  ◀  ▼  ▶  on every device. The old raised-
           button / indented layout existed only to dodge the Google Sites (i)
           icon; the game is hosted directly now, so that workaround is gone.
           ===================================================================== */
        html.touch-ui #virtual-gamepad {
            bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
            left: calc(0.5rem + env(safe-area-inset-left, 0px));
            right: calc(0.5rem + env(safe-area-inset-right, 0px));
        }

        /* Embedded on a phone (Google Sites iframe): the host page draws its (i)
           button over the bottom-left corner, so lift ▼ above it and indent
           ◀ ▶ past it. Standalone visits keep the plain single row. */
        html.embedded.touch-ui #dpad {
            display: grid;
            grid-template-columns: auto auto;
            grid-template-areas:
                "down ."
                "left right";
            gap: 0.5rem;
            justify-items: start;
            align-items: center;
        }
        html.embedded.touch-ui #t-down  { grid-area: down; }
        html.embedded.touch-ui #t-left  { grid-area: left; margin-left: 3.25rem; }
        html.embedded.touch-ui #t-right { grid-area: right; }


        /* EXPAND button: mobile devices only, and only where the browser
           actually allows fullscreen (an embedded iframe without
           allowfullscreen cannot, so the button is hidden rather than dead). */
        #btn-fullscreen { display: none; }               /* desktop: never shown */
        html.touch-ui #btn-fullscreen { display: block; } /* mobile: shown */
        html.desktop-ui #btn-fullscreen { display: none; } /* belt and braces */
        html.no-fullscreen #btn-fullscreen { display: none !important; }
        /* Once fullscreen is running there is nothing left to press. */
        html.is-fullscreen #btn-fullscreen { display: none !important; }
    </style>

    <script>
        /* Running inside an iframe (Google Sites embed, or the redirect page)
           means the host page's (i) button can overlap the bottom-left corner,
           so the D-pad needs its offset layout. Set this before first paint. */
        (function () {
            var root = document.documentElement;
            try {
                if (window.self !== window.top) root.classList.add('embedded');
            } catch (e) {
                root.classList.add('embedded');
            }
            /* Apply the touch layout before first paint too, so the pad never
               flashes the desktop row before the main script runs. */
            try {
                var pref = localStorage.getItem('super_mario_site_mode');
                var finger = window.matchMedia &&
                    window.matchMedia('(hover: none) and (pointer: coarse)').matches;
                if (pref === 'mobile' || (pref !== 'desktop' && finger)) {
                    root.classList.add('touch-ui');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="w-screen h-screen overflow-hidden select-none">

    <!-- Fullscreen Game Container -->
    <div id="app-root" class="relative w-screen h-full overflow-hidden bg-black">

        <!-- CRT Scanline Mesh Overlay -->
        <div class="crt-overlay absolute inset-0 z-10"></div>

        <!-- 1985 Mario NES-Style Portrait Rotate Screen Dialog (Auto-pauses game without damaging run) -->
        <div id="nes-rotate-overlay" class="hidden absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-5 text-center select-none">
            <div class="nes-brick-border w-full max-w-xs p-5 flex flex-col items-center gap-4 relative">
                <!-- Corner Gold Rivets -->
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute top-2 left-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute top-2 right-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute bottom-2 left-2"></div>
                <div class="w-2.5 h-2.5 bg-yellow-300 absolute bottom-2 right-2"></div>

                <!-- 1985 Brick-Orange Signboard Header -->
                <div class="nes-signboard w-full py-2.5 px-3">
                    <div class="text-xs text-[#fcBCB0] tracking-wider drop-shadow-[2px_2px_0_#000]">SUPER MARIO</div>
                </div>

                <!-- Animated 8-Bit NES Screen Rotate Icon -->
                <div class="my-2 flex items-center justify-center gap-4">
                    <div class="nes-rotate-anim w-14 h-20 border-4 border-white bg-slate-900 flex flex-col items-center justify-between p-1.5 shadow-[4px_4px_0_#c84c0c]">
                        <div class="w-full h-1.5 bg-sky-400"></div>
                        <div class="text-[9px] text-yellow-300">1-1</div>
                        <div class="flex gap-1">
                            <span class="w-2 h-2 bg-red-500 inline-block"></span>
                            <span class="w-2 h-2 bg-red-500 inline-block"></span>
                        </div>
                    </div>
                </div>

                <div class="text-[10px] leading-relaxed text-yellow-300">
                    ROTATE YOUR DEVICE<br>TO LANDSCAPE
                </div>
                <div class="text-[7.5px] leading-relaxed text-slate-300 px-1">
                    FOR PROPER 8-BIT WIDE VIEW &amp; MULTI-TOUCH CONTROLS.<br>
                    <span class="text-green-400">(YOUR GAME IS SAFELY PAUSED)</span>
                </div>
            </div>
        </div>

        <!-- Floating Bottom Overlay: Classy Pixel Controller Pad -->
        <div id="virtual-gamepad" class="absolute bottom-2 left-2 right-2 sm:bottom-3 sm:left-4 sm:right-4 z-20 flex items-end justify-between pointer-events-none">
            <!-- Left Beveled Pixel D-Pad -->
            <div id="dpad" class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">
                <button id="t-left" type="button" data-pad-action="left" class="pixel-dpad-btn pad-btn-size" aria-label="Move Left">◀</button>
                <button id="t-down" type="button" data-pad-action="down" class="pixel-dpad-btn pad-btn-size" aria-label="Crouch / Pipe / Drift">▼</button>
                <button id="t-right" type="button" data-pad-action="right" class="pixel-dpad-btn pad-btn-size" aria-label="Move Right">▶</button>
            </div>

            <!-- Right Beveled Pixel R / B / A Buttons (E above A, so the rest sit on the bottom line) -->
            <div class="flex items-end gap-1.5 sm:gap-2.5 pointer-events-auto">
                <button id="btn-restart" type="button" data-pad-action="reset" class="pixel-action-btn pixel-btn-reset pad-btn-size" aria-label="Reset Stage" title="Reset Stage (R)">
                    R
                </button>
                <button id="t-dash" type="button" data-pad-action="dash" class="pixel-action-btn pad-btn-size" aria-label="Dash / Fire / Kart Item">
                    B
                </button>
                <!-- E (menu) sits just above A; R, B and A share the bottom line -->
                <div class="flex flex-col items-center gap-1.5 sm:gap-2">
                    <button id="t-menu" type="button" class="pixel-action-btn pad-btn-size" aria-label="Open Menu" title="Menu (E)">E</button>
                    <button id="t-jump" type="button" data-pad-action="jump" class="pixel-action-btn pad-btn-size" aria-label="Jump / Flap / Gas">
                        A
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Fullscreen Toggle -->
        <button id="btn-fullscreen" type="button" class="pixel-btn pixel-btn-gold absolute top-2 right-2 z-30 text-[10px] px-2.5 py-1.5" aria-label="Expand to fullscreen" title="Expand">⛶ EXPAND</button>

        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" width="800" height="450" tabindex="0"></canvas>
    </div>

    <script>
        /******************************************************************
         * SUPER MARIO & MARIO KART - ENGINE, SPRITES, LOCAL SAVE & AUDIO
         ******************************************************************/

        // --- 1. RETRO 8-BIT WEB AUDIO SYNTHESIZER ---
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmEnabled = true;
                this.bgmStep = 0;
                this.bgmTimer = 0;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, duration, startTime = 0, slideTo = null, vol = 0.12) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime + startTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
                    }
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) {}
            }
            updateBGM(phase, mode, world, subArea, starActive) {
                if (!this.enabled || !this.bgmEnabled || !this.ctx) return;
                if (phase !== 'playing' && phase !== 'world_map' && phase !== 'character_select' && phase !== 'kart_menu') return;
                this.bgmTimer++;
                const tempo = starActive ? 5 : (mode === 'mario_kart' ? 6 : (mode === 'flappy_collab' ? 7 : 9));
                if (this.bgmTimer < tempo) return;
                this.bgmTimer = 0;

                const overworldNotes = [330, 330, 0, 330, 0, 262, 330, 0, 392, 0, 0, 0, 196, 0, 0, 0, 262, 0, 196, 0, 165, 0, 220, 0, 247, 0, 233, 220, 0, 196, 330, 392];
                const undergroundNotes = [262, 523, 220, 440, 233, 466, 0, 0, 196, 392, 165, 330, 175, 349, 0, 0];
                const castleNotes = [220, 233, 220, 196, 220, 233, 220, 185, 220, 233, 220, 196, 247, 262, 247, 220];
                const flappyNotes = [523, 659, 784, 659, 587, 698, 880, 698, 659, 784, 987, 784, 1046, 0, 784, 0];
                const kartCircuitNotes = [523, 659, 784, 1046, 0, 784, 659, 523, 587, 698, 880, 1175, 0, 880, 698, 587, 659, 784, 987, 1318, 1175, 1046, 987, 784];
                const kartRainbowNotes = [659, 784, 987, 1318, 1175, 987, 784, 987, 698, 880, 1046, 1397, 1318, 1046, 880, 698];
                const starNotes = [523, 523, 523, 392, 440, 523, 392, 523, 587, 587, 587, 440, 494, 587, 440, 587];
                const mapNotes = [262, 330, 392, 523, 392, 330, 294, 349, 440, 587, 440, 349];

                let seq = overworldNotes;
                if (phase === 'world_map' || phase === 'character_select' || phase === 'kart_menu') seq = mapNotes;
                else if (starActive) seq = starNotes;
                else if (mode === 'mario_kart') {
                    seq = (kartState && kartState.trackId === 'rainbow') ? kartRainbowNotes : (kartState && kartState.trackId === 'castle' ? castleNotes : kartCircuitNotes);
                }
                else if (mode === 'flappy_collab') seq = flappyNotes;
                else if (subArea === 'underground') seq = undergroundNotes;
                else if (world === '1-2' || world === '1-4') seq = castleNotes;

                const freq = seq[this.bgmStep % seq.length];
                this.bgmStep++;
                if (freq > 0) {
                    const wave = mode === 'mario_kart' ? 'sawtooth' : (mode === 'flappy_collab' ? 'triangle' : 'square');
                    this.playTone(freq, wave, 0.075, 0, null, mode === 'mario_kart' ? 0.028 : 0.032);
                }
            }
            lakituBeep(go = false) {
                this.init();
                if (go) {
                    this.playTone(880, 'square', 0.32, 0, 1046.5, 0.16);
                } else {
                    this.playTone(440, 'square', 0.14, 0, null, 0.13);
                }
            }
            kartBoost() {
                this.init();
                this.playTone(260, 'sawtooth', 0.24, 0, 920, 0.14);
                this.playTone(520, 'square', 0.20, 0.06, 1180, 0.11);
            }
            enginePulse(speedRatio, isBoosting = false, isBraking = false) {
                if (!this.enabled || !this.ctx) return;
                if (isBraking && speedRatio > 0.25) {
                    this.playTone(190 + Math.random() * 60, 'sawtooth', 0.045, 0, 110, 0.045);
                    return;
                }
                const baseFreq = isBoosting ? 155 : 68;
                const freq = baseFreq + Math.min(1.4, Math.abs(speedRatio)) * 135;
                this.playTone(freq, 'sawtooth', 0.05, 0, freq * 1.04, isBoosting ? 0.05 : 0.03);
            }
            suspensionLand(impact = 1) {
                this.init();
                const clamped = Math.min(2.5, Math.max(0.5, impact));
                this.playTone(120 * clamped, 'triangle', 0.11, 0, 48, 0.12);
            }
            spinOut() {
                this.init();
                const notes = [620, 540, 460, 380, 520, 340];
                notes.forEach((n, i) => this.playTone(n, 'sawtooth', 0.06, i * 0.045, n * 0.8, 0.12));
            }
            // Nitro ignition: a rising whoosh, then an airy tail.
            nitroWhoosh() {
                this.init();
                this.playTone(180, 'sawtooth', 0.26, 0, 1150, 0.12);
                this.playTone(340, 'triangle', 0.20, 0.04, 1500, 0.09);
                this.playTone(90, 'square', 0.22, 0.02, 240, 0.07);
            }
            // Overheat: a falling two-note alarm, deliberately distinct from spinOut.
            overheatAlarm() {
                this.init();
                this.playTone(760, 'square', 0.10, 0, 520, 0.12);
                this.playTone(430, 'square', 0.16, 0.13, 240, 0.12);
            }
            // Tyre screech while power-sliding (short, called on a throttle).
            kartSkid(intensity = 1) {
                if (!this.enabled || !this.ctx) return;
                const amt = Math.min(1.6, Math.max(0.4, intensity));

        // --- 2. PIXEL ART SPRITE GENERATOR ---
        function createPixelSprite(matrix, palette, scale = 2) {
            const h = matrix.length;
            const w = matrix[0].length;
            const off = document.createElement('canvas');
            off.width = w * scale;
            off.height = h * scale;
            const octx = off.getContext('2d');
            octx.imageSmoothingEnabled = false;
            for (let r = 0; r < h; r++) {
                for (let c = 0; c < w; c++) {
                    const ch = matrix[r][c];
                    if (ch !== '.' && palette[ch]) {
                        octx.fillStyle = palette[ch];
                        octx.fillRect(c * scale, r * scale, scale, scale);
                    }
                }
            }
            return off;
        }

        // -------------------------------------------------------------------
        // VECTOR ICONS
        // These replace the emoji that used to stand in for icons. Emoji render
        // differently on every OS (and not at all on some), so the UI now draws
        // its own shapes with canvas primitives - no font, image or network.
        // -------------------------------------------------------------------
        const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu;

        function stripEmoji(str) {
            return String(str).replace(EMOJI_RE, '');
        }

        function cleanLabel(str) {
            return stripEmoji(str).replace(/\s{2,}/g, ' ').trim();
        }

        // Belt and braces: whatever string reaches the canvas, emoji never do.
        // Every counter, banner and label now renders through this, so a stray
        // emoji in any future string cannot reach the screen as a tofu box.
        (function sanitizeCanvasText() {
            if (typeof CanvasRenderingContext2D === 'undefined') return;
            const proto = CanvasRenderingContext2D.prototype;
            const original = proto.fillText;
            proto.fillText = function (text, ...rest) {
                return original.call(this, typeof text === 'string' ? stripEmoji(text) : text, ...rest);
            };
        })();

        // name: mushroom | kart | gem | bird | trophy | coin | banana | bolt |
        //       rocket | flag | globe | star | arrow
        function drawPixelIcon(name, cx, cy, s = 10, color = null) {
            const x = Math.round(cx - s / 2);
            const y = Math.round(cy - s / 2);
            const px = Math.max(1, Math.round(s / 10));   // "pixel" unit
            const fill = (c) => { ctx.fillStyle = c; };

            switch (name) {
                case 'mushroom':
                    fill(color || '#ef4444');
                    ctx.fillRect(x + s * 0.1, y + s * 0.15, s * 0.8, s * 0.4);
                    ctx.fillRect(x + s * 0.2, y + s * 0.05, s * 0.6, s * 0.12);
                    fill('#f8fafc');
                    ctx.fillRect(x + s * 0.22, y + s * 0.22, s * 0.18, s * 0.16);
                    ctx.fillRect(x + s * 0.6, y + s * 0.22, s * 0.18, s * 0.16);
                    fill('#fde68a');
                    ctx.fillRect(x + s * 0.25, y + s * 0.55, s * 0.5, s * 0.35);
                    fill('#0f172a');
                    ctx.fillRect(x + s * 0.35, y + s * 0.62, px, s * 0.1);
                    ctx.fillRect(x + s * 0.6, y + s * 0.62, px, s * 0.1);
                    break;
                case 'kart':
                    fill(color || '#f97316');
                    ctx.fillRect(x + s * 0.15, y + s * 0.35, s * 0.7, s * 0.28);
                    fill('#ef4444');
                    ctx.fillRect(x + s * 0.3, y + s * 0.2, s * 0.3, s * 0.18);
                    fill('#0f172a');
                    ctx.fillRect(x + s * 0.18, y + s * 0.62, s * 0.22, s * 0.22);
                    ctx.fillRect(x + s * 0.6, y + s * 0.62, s * 0.22, s * 0.22);
                    fill('#cbd5e1');
                    ctx.fillRect(x + s * 0.24, y + s * 0.68, s * 0.1, s * 0.1);
                    ctx.fillRect(x + s * 0.66, y + s * 0.68, s * 0.1, s * 0.1);
                    break;
                case 'gem':
                    fill(color || '#22d3ee');
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.5, y);
                    ctx.lineTo(x + s, y + s * 0.38);
                    ctx.lineTo(x + s * 0.5, y + s);
                    ctx.lineTo(x, y + s * 0.38);
                    ctx.closePath();
                    ctx.fill();
                    fill('rgba(255,255,255,0.65)');
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.5, y + s * 0.08);
                    ctx.lineTo(x + s * 0.78, y + s * 0.38);
                    ctx.lineTo(x + s * 0.5, y + s * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'bird':
                    fill(color || '#facc15');
                    ctx.fillRect(x + s * 0.15, y + s * 0.25, s * 0.6, s * 0.5);
                    ctx.fillRect(x + s * 0.3, y + s * 0.1, s * 0.4, s * 0.2);
                    fill('#f97316');
                    ctx.fillRect(x + s * 0.75, y + s * 0.42, s * 0.22, s * 0.12);
                    fill('#0f172a');
                    ctx.fillRect(x + s * 0.55, y + s * 0.3, px, px);
                    break;
                case 'trophy':
                    fill(color || '#facc15');
                    ctx.fillRect(x + s * 0.25, y + s * 0.1, s * 0.5, s * 0.42);
                    ctx.fillRect(x + s * 0.4, y + s * 0.5, s * 0.2, s * 0.22);
                    ctx.fillRect(x + s * 0.25, y + s * 0.72, s * 0.5, s * 0.16);
                    fill('#fde68a');
                    ctx.fillRect(x + s * 0.1, y + s * 0.16, s * 0.14, s * 0.2);
                    ctx.fillRect(x + s * 0.76, y + s * 0.16, s * 0.14, s * 0.2);
                    break;
                case 'coin':
                    fill(color || '#facc15');
                    ctx.beginPath();
                    ctx.arc(cx, cy, s * 0.44, 0, Math.PI * 2);
                    ctx.fill();
                    fill('#fde68a');
                    ctx.beginPath();
                    ctx.arc(cx, cy, s * 0.26, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'shell':
                    fill(color || '#f87171');
                    ctx.beginPath();
                    ctx.arc(cx, cy + s * 0.12, s * 0.42, Math.PI, 0);
                    ctx.closePath();
                    ctx.fill();
                    fill('#f8fafc');
                    ctx.fillRect(cx - s * 0.42, cy + s * 0.1, s * 0.84, s * 0.12);
                    fill('#0f172a');
                    ctx.fillRect(cx - s * 0.3, cy + s * 0.26, s * 0.6, s * 0.1);
                    break;
                case 'banana':
                    fill(color || '#fde047');
                    ctx.beginPath();
                    ctx.arc(cx - s * 0.05, cy, s * 0.42, Math.PI * 0.15, Math.PI * 1.05);
                    ctx.lineTo(cx, cy);
                    ctx.closePath();
                    ctx.fill();
                    fill('#a16207');
                    ctx.fillRect(cx + s * 0.3, cy - s * 0.36, px, s * 0.16);
                    break;
                case 'bolt':
                    fill(color || '#fef08a');
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.58, y);
                    ctx.lineTo(x + s * 0.22, y + s * 0.56);
                    ctx.lineTo(x + s * 0.46, y + s * 0.56);
                    ctx.lineTo(x + s * 0.36, y + s);
                    ctx.lineTo(x + s * 0.78, y + s * 0.4);
                    ctx.lineTo(x + s * 0.52, y + s * 0.4);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'rocket':
                    fill(color || '#38bdf8');
                    ctx.fillRect(x + s * 0.35, y + s * 0.15, s * 0.3, s * 0.5);
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.5, y);
                    ctx.lineTo(x + s * 0.72, y + s * 0.2);
                    ctx.lineTo(x + s * 0.28, y + s * 0.2);
                    ctx.closePath();
                    ctx.fill();
                    fill('#f97316');
                    ctx.fillRect(x + s * 0.4, y + s * 0.65, s * 0.2, s * 0.28);
                    break;
                case 'flag':
                    fill('#e2e8f0');
                    ctx.fillRect(x + s * 0.2, y, px * 1.4, s);
                    fill(color || '#ef4444');
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.24, y + s * 0.08);
                    ctx.lineTo(x + s * 0.9, y + s * 0.26);
                    ctx.lineTo(x + s * 0.24, y + s * 0.44);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'globe':
                    fill(color || '#38bdf8');
                    ctx.beginPath();
                    ctx.arc(cx, cy, s * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                    fill('#e2e8f0');
                    ctx.fillRect(cx - s * 0.45, cy - px, s * 0.9, px * 2);
                    ctx.fillRect(cx - px, cy - s * 0.45, px * 2, s * 0.9);
                    break;
                case 'star':
                    fill(color || '#facc15');
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) {
                        const ang = -Math.PI / 2 + i * Math.PI / 5;
                        const r = i % 2 === 0 ? s * 0.5 : s * 0.22;
                        const px2 = cx + Math.cos(ang) * r;
                        const py2 = cy + Math.sin(ang) * r;
                        if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'heart':
                    fill(color || '#ef4444');
                    ctx.beginPath();
                    ctx.arc(cx - s * 0.2, cy - s * 0.12, s * 0.24, 0, Math.PI * 2);
                    ctx.arc(cx + s * 0.2, cy - s * 0.12, s * 0.24, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(cx - s * 0.43, cy - s * 0.02);
                    ctx.lineTo(cx, cy + s * 0.46);
                    ctx.lineTo(cx + s * 0.43, cy - s * 0.02);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'arrow':
                default:
                    fill(color || '#facc15');
                    ctx.beginPath();
                    ctx.moveTo(x + s * 0.15, y + s * 0.2);
                    ctx.lineTo(x + s * 0.9, y + s * 0.5);
                    ctx.lineTo(x + s * 0.15, y + s * 0.8);
                    ctx.closePath();
                    ctx.fill();
                    break;
            }
        }

        const ACHIEVEMENT_BIT_ORDER = ['firstGem', 'pipeAce', 'coinHunter', 'bowserSlayer', 'mechaSlayer', 'kartChampion'];

        function packAchievementsMask(achObj = gameState.achievements) {
            let mask = 0;
            ACHIEVEMENT_BIT_ORDER.forEach((key, idx) => {
                if (achObj && achObj[key]) mask |= (1 << idx);
            });
            return mask;
        }

        function unpackAchievementsMask(mask, targetAch = gameState.achievements) {
            if (!Number.isFinite(mask)) return;
            const m = Math.floor(mask);
            ACHIEVEMENT_BIT_ORDER.forEach((key, idx) => {
                if ((m & (1 << idx)) !== 0) targetAch[key] = true;
            });
        }

        // Merges a compact cloud packet from Firebase into local state without losing higher local progress
        function mergeCompactCloudPacket(pkt) {
            if (!pkt || typeof pkt !== 'object') return;
            let updatedLocal = false;

            if (Number.isFinite(pkt.ts) && pkt.ts > gameState.topScore) {
                gameState.topScore = Math.floor(pkt.ts);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.bp) && pkt.bp > gameState.bestPipes) {
                gameState.bestPipes = Math.floor(pkt.bp);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.gf) && pkt.gf > gameState.gemsFound) {
                gameState.gemsFound = Math.floor(pkt.gf);
                updatedLocal = true;
            }
            if (Number.isFinite(pkt.ac)) {
                const beforeMask = packAchievementsMask(gameState.achievements);
                unpackAchievementsMask(pkt.ac, gameState.achievements);
                if (packAchievementsMask(gameState.achievements) !== beforeMask) {
                    updatedLocal = true;
                }
            }
            // Only adopt cloud character/display preferences if local storage had none saved yet
            let hasLocalSave = false;
            try {
                hasLocalSave = Boolean(window.localStorage && window.localStorage.getItem(SAVE_STORAGE_KEY));
            } catch (e) {}

            if (!hasLocalSave) {
                if (['mario', 'luigi', 'wario', 'toad'].includes(pkt.ch)) gameState.selectedCharacter = pkt.ch;
                if (['duo', 'mario', 'bird'].includes(pkt.cm)) gameState.collabHero = pkt.cm;
                if ([1, 2, 3, 4].includes(pkt.ps)) gameState.pixelScale = pkt.ps;
                if (pkt.ct === 0 || pkt.ct === 1) gameState.crtEnabled = Boolean(pkt.ct);
                updatedLocal = true;
            }

                savePlayerProgress(false);
                updateHUD();
            }
        }

                if (!saved || typeof saved !== 'object') return;

                if (Number.isFinite(saved.topScore) && saved.topScore > gameState.topScore) {
                    gameState.topScore = Math.floor(saved.topScore);
                }
                if (Number.isFinite(saved.bestPipes) && saved.bestPipes > gameState.bestPipes) {

                if (Number.isFinite(saved.gemsFound) && saved.gemsFound > gameState.gemsFound) {

                if (Number.isFinite(saved.kartWins) && saved.kartWins > gameState.kartWins) {
                    gameState.kartWins = Math.floor(saved.kartWins);
                }
                if (Number.isFinite(saved.ac)) {
                    unpackAchievementsMask(saved.ac, gameState.achievements);
                }
                if (saved.achievements && typeof saved.achievements === 'object') {
                    Object.keys(gameState.achievements).forEach(k => {

        // Computes continuous, gap-free 2D hill & ramp surface height at any world X coordinate
        function getKartTerrainY(worldX) {
            const lx = ((worldX % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH;
            const trackId = kartState.trackId;
            let baseY = 344;

            // Smooth cosine taper at start/finish straightaway so lap seams are 100% flat and seamless
            const edgeDist = Math.min(lx, KART_LAP_LENGTH - lx);
            const edgeFade = edgeDist < 300 ? 0.5 * (1 - Math.cos(Math.PI * (edgeDist / 300))) : 1.0;

            if (trackId === 'circuit') {
                // Rolling Hill Climb countryside hills
                const wave = Math.sin(lx * 0.0040) * 26 + Math.sin(lx * 0.0095) * 14 + Math.cos(lx * 0.0020) * 14;
                baseY = 342 + wave * edgeFade;
            } else if (trackId === 'castle') {
                // Rugged motocross dunes & volcanic camelbacks
                const wave = Math.sin(lx * 0.0048) * 28 + Math.cos(lx * 0.0115) * 16 + Math.sin(lx * 0.022) * 5;
                baseY = 344 + wave * edgeFade;
            } else {
                // Rainbow Skyway sweeping rollercoaster waves
                const wave = Math.sin(lx * 0.0036) * 34 + Math.sin(lx * 0.0080) * 18;
                baseY = 334 + wave * edgeFade;
            }

            // Smooth bell-shaped & ski-jump ramps (no abrupt vertical drops or invisible air gaps!)
            for (let i = 0; i < kartState.ramps.length; i++) {
                const r = kartState.ramps[i];
                if (lx >= r.x && lx <= r.x + r.w) {
                    const prog = (lx - r.x) / r.w;
                    let rampOffset = 0;
                    if (prog < 0.72) {
                        // Smooth sine-squared climb up the launch ramp
                        const t = prog / 0.72;
                        rampOffset = Math.sin(t * Math.PI * 0.5) * r.h;
                    } else {
                        // Smooth downslope landing apron so driving slowly over a ramp never snaps
                        const t = (prog - 0.72) / 0.28;
                        rampOffset = Math.cos(t * Math.PI * 0.5) * r.h;
                    }
                    baseY -= rampOffset;
                }
            }

            return baseY;
        }

        function getKartTerrainSlope(worldX) {
            const y1 = getKartTerrainY(worldX - 10);
            const y2 = getKartTerrainY(worldX + 10);
            return Math.atan2(y2 - y1, 20);
        }

        // Exact elevated bridge deck Y at worldX (including sloped entry/exit ramps so it's never an invisible box)
        function getBridgeDeckY(hp, lx) {
            if (lx < hp.x || lx > hp.x + hp.w) return null;
            const rampLen = 48;
            let deckY = hp.deckY;
            if (lx < hp.x + rampLen) {
                const t = (lx - hp.x) / rampLen;
                deckY = hp.deckY + (1 - t) * 18;
            } else if (lx > hp.x + hp.w - rampLen) {
                const t = (hp.x + hp.w - lx) / rampLen;
                deckY = hp.deckY + (1 - t) * 18;
            }
            return deckY;
        }

        // Unified Dual-Wheel Surface Resolver (checks both Elevated Bridges and Main Terrain)
        function resolveKartSurface(worldX, currentY, vy, wasOnBridge = false) {
            const lx = ((worldX % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH;
            const mainY = getKartTerrainY(worldX);
            const mainSlope = getKartTerrainSlope(worldX);

            for (let i = 0; i < kartState.highPlatforms.length; i++) {
                const hp = kartState.highPlatforms[i];
                const deckY = getBridgeDeckY(hp, lx);
                if (deckY !== null) {
                    const wheelBottom = currentY + 18;
                    const tolerance = wasOnBridge ? 26 : 16;
                    if (vy >= -1.5 && wheelBottom <= deckY + tolerance) {
                        const d1 = getBridgeDeckY(hp, Math.max(hp.x, lx - 8)) ?? deckY;
                        const d2 = getBridgeDeckY(hp, Math.min(hp.x + hp.w, lx + 8)) ?? deckY;
                        return {
                            groundY: deckY,
                            slope: Math.atan2(d2 - d1, 16),
                            isBridge: true
                        };
                    }
                }
            }

            return {
                groundY: mainY,
                slope: mainSlope,
                isBridge: false
            };
        }
