                        triggerInstantFlapOrAction();
                    } else if (gameState.mpCursor === 1) {
                        const dir = act.left ? 3 : 1;
                        gameState.mpRoom = rooms[(rooms.indexOf(gameState.mpRoom) + dir) % rooms.length];
                        if (window.mpSwitchRoom) window.mpSwitchRoom(gameState.mpRoom);
                        sfx.bump();
                    }
                    return;
                }
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            if (gameState.phase === 'trophies') {
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            if (gameState.phase === 'world_map') {
                const maxRows = OVERWORLD_NODES.length + 1;
                if (act.up || act.left) {
                    gameState.mapNodeIndex = (gameState.mapNodeIndex + maxRows - 1) % maxRows;
                    if (gameState.mapNodeIndex < OVERWORLD_NODES.length) {
                        const previewNode = OVERWORLD_NODES[gameState.mapNodeIndex];
                        if (previewNode.mode === 'classic' && gameState.world !== previewNode.id) {
                            loadLevel(previewNode.id, 'main');
                        }
                    }
                    sfx.bump();
                    return;
                }
                if (act.down || act.right) {
                    gameState.mapNodeIndex = (gameState.mapNodeIndex + 1) % maxRows;
                    if (gameState.mapNodeIndex < OVERWORLD_NODES.length) {
                        const previewNode = OVERWORLD_NODES[gameState.mapNodeIndex];
                        if (previewNode.mode === 'classic' && gameState.world !== previewNode.id) {
                            loadLevel(previewNode.id, 'main');
                        }
                    }
                    sfx.bump();
                    return;
                }
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            if (gameState.phase === 'course_clear') {
                if (act.up) {
                    gameState.clearCursor = (gameState.clearCursor + 2) % 3;
                    sfx.bump();
                    return;
                }
                if (act.down) {
                    gameState.clearCursor = (gameState.clearCursor + 1) % 3;
                    sfx.bump();
                    return;
                }
                if (act.confirm) {
                    triggerInstantFlapOrAction();
                    return;
                }
                return;
            }

            heldKeyCodes.add(e.code || e.key || '');
            recomputeKeyboardState();
        });

        window.addEventListener('keyup', (e) => {
            const act = getNormalizedActions(e);
            if (heldKeyCodes.delete(e.code || e.key || '')) {

            } else if (act.left || act.right || act.down || act.jump || act.dash) {
                const ids = [];
                heldKeyCodes.forEach((id) => {
                    const a = actionsForCodeId(id);
                    if ((act.left && a.left) || (act.right && a.right) || (act.down && a.down) ||
                        (act.jump && a.jump) || (act.dash && a.dash)) ids.push(id);

        // Virtual Touch & Pointer Gamepad Bindings
        const padButtons = {
            left: document.getElementById('t-left'),
            down: document.getElementById('t-down'),
            right: document.getElementById('t-right'),
            jump: document.getElementById('t-jump'),
            dash: document.getElementById('t-dash'),
            reset: document.getElementById('btn-restart')
        };

        const activePadState = {
            left: false,
            down: false,
            right: false,
            jump: false,
            dash: false,
            reset: false
        };

        function triggerPadActionDown(action) {
            sfx.init();
            if (gameState.isPortraitBlocked) return;

            if (action === 'reset') {
                triggerStageReset();
                return;
            }

            clampTitleCursor();
            const charRowIdx = 2;
            const gfxRowIdx = 5;
            const crtRowIdx = 6;

            if (action === 'left') {
                if (gameState.phase === 'title' && gameState.titleCursor === charRowIdx) {
                    const idx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                    gameState.selectedCharacter = CHARACTER_ROSTER[(idx + CHARACTER_ROSTER.length - 1) % CHARACTER_ROSTER.length].id;
                    sfx.coin();
                    savePlayerProgress();
                } else if (gameState.phase === 'title' && gameState.titleCursor === gfxRowIdx) {
                    gameState.pixelScale = ((gameState.pixelScale + 2) % 4) + 1;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (gameState.phase === 'title' && gameState.titleCursor === crtRowIdx) {
                    gameState.crtEnabled = !gameState.crtEnabled;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (gameState.phase === 'character_select') {
                    const maxRows = CHARACTER_ROSTER.length + 2;
                    gameState.charCursor = (gameState.charCursor + maxRows - 1) % maxRows;
                    sfx.bump();
                } else if (gameState.phase === 'multiplayer_menu' && gameState.mpCursor === 1) {
                    const rooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
                    gameState.mpRoom = rooms[(rooms.indexOf(gameState.mpRoom) + 3) % rooms.length];
                    if (window.mpSwitchRoom) window.mpSwitchRoom(gameState.mpRoom);
                    sfx.bump();
                } else if (gameState.phase === 'world_map') {
                    const maxRows = OVERWORLD_NODES.length + 1;
                    gameState.mapNodeIndex = (gameState.mapNodeIndex + maxRows - 1) % maxRows;
                    sfx.bump();
                } else {
                    setTouchAction('left', true);
                }
            } else if (action === 'right') {
                if (gameState.phase === 'title' && gameState.titleCursor === charRowIdx) {
                    const idx = CHARACTER_ROSTER.findIndex(c => c.id === gameState.selectedCharacter);
                    gameState.selectedCharacter = CHARACTER_ROSTER[(idx + 1) % CHARACTER_ROSTER.length].id;
                    sfx.coin();
                    savePlayerProgress();
                } else if (gameState.phase === 'title' && gameState.titleCursor === gfxRowIdx) {
                    gameState.pixelScale = (gameState.pixelScale % 4) + 1;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (gameState.phase === 'title' && gameState.titleCursor === crtRowIdx) {
                    gameState.crtEnabled = !gameState.crtEnabled;
                    sfx.bump();
                    savePlayerProgress();
                    updateHUD();
                } else if (gameState.phase === 'character_select') {
                    const maxRows = CHARACTER_ROSTER.length + 2;
                    gameState.charCursor = (gameState.charCursor + 1) % maxRows;
                    sfx.bump();
                } else if (gameState.phase === 'multiplayer_menu' && gameState.mpCursor === 1) {
                    const rooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
                    gameState.mpRoom = rooms[(rooms.indexOf(gameState.mpRoom) + 1) % rooms.length];
                    if (window.mpSwitchRoom) window.mpSwitchRoom(gameState.mpRoom);
                    sfx.bump();
                } else if (gameState.phase === 'world_map') {
                    const maxRows = OVERWORLD_NODES.length + 1;
                    gameState.mapNodeIndex = (gameState.mapNodeIndex + 1) % maxRows;
                    sfx.bump();
                } else {
                    setTouchAction('right', true);
                }
            } else if (action === 'down') {
                if (gameState.phase === 'title') {
                    clampTitleCursor();
                    const maxRows = gameState.previousPhase ? 8 : 7;
                    gameState.titleCursor = (gameState.titleCursor + 1) % maxRows;
                    sfx.bump();
                } else if (gameState.phase === 'character_select') {
                    const maxRows = CHARACTER_ROSTER.length + 2;
                    gameState.charCursor = (gameState.charCursor + 1) % maxRows;
                    sfx.bump();
                } else if (gameState.phase === 'multiplayer_menu') {
                    gameState.mpCursor = (gameState.mpCursor + 1) % 5;
                    sfx.bump();
                } else if (gameState.phase === 'world_map') {
                    const maxRows = OVERWORLD_NODES.length + 1;
                    gameState.mapNodeIndex = (gameState.mapNodeIndex + 1) % maxRows;
                    sfx.bump();
                } else if (gameState.phase === 'course_clear') {
                    gameState.clearCursor = (gameState.clearCursor + 1) % 3;
                    sfx.bump();
                } else {
                    setTouchAction('down', true);
                }
            } else if (action === 'jump') {
                setTouchAction('jump', true);
                triggerInstantFlapOrAction();
            } else if (action === 'dash') {
                setTouchAction('dash', true);
            }
        }

        function triggerPadActionUp(action) {
            setTouchAction(action, false);
        }

        function applyMultiTouchPadState(nextPressed) {
            Object.keys(activePadState).forEach((action) => {
                const wasDown = activePadState[action];
                const isDown = Boolean(nextPressed[action]);
                const btnEl = padButtons[action];
                if (btnEl) {
                    btnEl.classList.toggle('pixel-btn-pressed', isDown);
                }
                if (isDown && !wasDown) {
                    activePadState[action] = true;
                    triggerPadActionDown(action);
                } else if (!isDown && wasDown) {
                    activePadState[action] = false;
                    triggerPadActionUp(action);
                }
            });
        }

        function syncGamepadTouches(e) {
            const vPad = document.getElementById('virtual-gamepad');
            if (vPad) vPad.classList.add('touch-active');

            const nextPressed = {};
            const touches = e.touches || [];
            for (let i = 0; i < touches.length; i++) {
                const t = touches[i];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el) {
                    const btn = el.closest('[data-pad-action]');
                    if (btn) {
                        const act = btn.getAttribute('data-pad-action');
                        if (act) nextPressed[act] = true;
                    }
                }
            }
            applyMultiTouchPadState(nextPressed);
        }

        const vGamepadEl = document.getElementById('virtual-gamepad');
        if (vGamepadEl) {
            vGamepadEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                syncGamepadTouches(e);
            }, { passive: false });
            vGamepadEl.addEventListener('touchmove', (e) => {
                e.preventDefault();
                e.stopPropagation();
                syncGamepadTouches(e);
            }, { passive: false });
            vGamepadEl.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                syncGamepadTouches(e);
            }, { passive: false });
            vGamepadEl.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                applyMultiTouchPadState({});
            }, { passive: false });
        }

        // Mouse fallback for desktop clicks on virtual gamepad buttons
        function bindTouchButton(id, onDown, onUp) {
            const el = document.getElementById(id);
            if (!el) return;
            const action = el.getAttribute('data-pad-action');
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (action) applyMultiTouchPadState({ ...activePadState, [action]: true });
                else onDown();
            });
            el.addEventListener('mouseup', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (action) applyMultiTouchPadState({ ...activePadState, [action]: false });
                else onUp();
            });
            el.addEventListener('mouseleave', () => {
                if (action && activePadState[action]) {
                    applyMultiTouchPadState({ ...activePadState, [action]: false });
                } else {
                    onUp();
                }
            });
        }

        bindTouchButton('t-left', () => triggerPadActionDown('left'), () => triggerPadActionUp('left'));
        bindTouchButton('t-right', () => triggerPadActionDown('right'), () => triggerPadActionUp('right'));
        bindTouchButton('t-down', () => triggerPadActionDown('down'), () => triggerPadActionUp('down'));
        bindTouchButton('t-jump', () => triggerPadActionDown('jump'), () => triggerPadActionUp('jump'));
        bindTouchButton('t-dash', () => triggerPadActionDown('dash'), () => triggerPadActionUp('dash'));

        // Menu button (M) above A: same action as ESC
        (function bindMenuButton() {
            const btnMenu = document.getElementById('t-menu');
            if (!btnMenu) return;
            btnMenu.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                sfx.init();
                sfx.bump();
                toggleStartingUI();
            });
        })();

        // =====================================================================
        // KEEP THE SCREEN AWAKE WHILE PLAYING (Screen Wake Lock API)
        // Released automatically when the tab is hidden; re-requested on return.
        // =====================================================================
        let screenWakeLock = null;

        function requestWakeLock() {
            try {
                if (!navigator.wakeLock || document.visibilityState !== 'visible') return;
                if (screenWakeLock) return;
                navigator.wakeLock.request('screen').then((lock) => {
                    screenWakeLock = lock;
                    lock.addEventListener('release', () => { screenWakeLock = null; });
                }).catch(() => {});
            } catch (e) {}
        }

        // =====================================================================
        // IDLE FADE FOR THE TOUCH CONTROLS
        // =====================================================================
        let padIdleTimer = null;

        function wakePad() {
            document.documentElement.classList.remove('pad-idle');
            if (padIdleTimer) clearTimeout(padIdleTimer);
            padIdleTimer = setTimeout(() => {
                document.documentElement.classList.add('pad-idle');
            }, 3000);
        }

        window.addEventListener('pointerdown', () => { wakePad(); requestWakeLock(); }, { capture: true, passive: true });
        window.addEventListener('pointermove', () => {
            if (document.documentElement.classList.contains('pad-idle')) wakePad();
        }, { passive: true });
        wakePad();

        // =====================================================================
        // TOUCH LAYOUT FLAG
        // Finger-primary devices get the phone control layout; a mouse device
        // keeps the desktop row even inside a narrow Google Sites iframe.
        // =====================================================================
        // Preference: 'auto' | 'mobile' | 'desktop'  (YouTube-style site mode)
        const SITE_MODE_KEY = 'super_mario_site_mode';
        // var, not let: checkPortraitOrientation() can call resolvedSiteMode()
        // during the very first resizeCanvas(), before this block executes.
        var siteModePreference = 'auto';

        function detectFingerPrimary() {
            try {
                return Boolean(window.matchMedia &&
                    window.matchMedia('(hover: none) and (pointer: coarse)').matches);
            } catch (e) {
                return false;
            }
        }

        function readSiteModePreference() {
            try {
                const fromUrl = new URLSearchParams(window.location.search).get('mode');
                if (fromUrl === 'mobile' || fromUrl === 'desktop') {
                    try { localStorage.setItem(SITE_MODE_KEY, fromUrl); } catch (e) {}
                    return fromUrl;
                }
                if (fromUrl === 'auto') {
                    try { localStorage.removeItem(SITE_MODE_KEY); } catch (e) {}
                    return 'auto';
                }
            } catch (e) {}
            try {
                const stored = localStorage.getItem(SITE_MODE_KEY);
                if (stored === 'mobile' || stored === 'desktop') return stored;
            } catch (e) {}
            return 'auto';
        }

        // The mode in force: an explicit choice always wins, otherwise fall back
        // to what the device looks like.
        function resolvedSiteMode() {
            if (siteModePreference === 'mobile' || siteModePreference === 'desktop') {
                return siteModePreference;
            }
            return detectFingerPrimary() ? 'mobile' : 'desktop';
        }

        function applySiteMode() {
            const mode = resolvedSiteMode();
            const root = document.documentElement;
            root.classList.toggle('touch-ui', mode === 'mobile');
            root.classList.toggle('desktop-ui', mode === 'desktop');
            gameState.siteMode = mode;
            gameState.siteModePreference = siteModePreference;

            // The rotate-to-landscape prompt only makes sense in mobile mode
            if (typeof checkPortraitOrientation === 'function') checkPortraitOrientation();
        }

        function setSiteMode(next) {
            siteModePreference = (next === 'mobile' || next === 'desktop') ? next : 'auto';
            try {
                if (siteModePreference === 'auto') localStorage.removeItem(SITE_MODE_KEY);
                else localStorage.setItem(SITE_MODE_KEY, siteModePreference);
            } catch (e) {}
            applySiteMode();
        }

        function toggleSiteMode() {
            setSiteMode(resolvedSiteMode() === 'mobile' ? 'desktop' : 'mobile');
        }

        siteModePreference = readSiteModePreference();

        // =====================================================================
        // GAMEPAD SUPPORT (Gamepad API, "standard" mapping)
        // A controller is translated into the same synthetic key events the
        // keyboard uses, so menus, pause, reset and every movement mechanic work
        // with no duplicated logic.
        //   A / Y ......... jump (also flap)
        //   B / X ......... dash / fire
        //   D-pad ......... move  (left stick works too, dead-zone 0.4)
        //   START ......... pause / resume  (same as ESC)
        //   BACK .......... reset stage     (same as R)
        // =====================================================================
        const PAD_BUTTON_MAP = {
            0: 'Space',    // A
            1: 'KeyX',     // B
            2: 'KeyX',     // X
            3: 'Space',    // Y
            12: 'ArrowUp',
            13: 'ArrowDown',
            14: 'ArrowLeft',
            15: 'ArrowRight',
            9: 'Escape',   // Start  -> menu
            8: 'KeyR',     // Back / Select -> reset
            4: 'KeyE'      // LB -> menu (same as the E key)
        };

        const PAD_KEY_VALUES = {
            Space: ' ', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown',
            ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
            KeyX: 'x', KeyR: 'r', KeyE: 'e', Escape: 'Escape'
        };

        let padHeldCodes = new Set();
        let padConnectedSeen = false;

        function dispatchSyntheticKey(type, code) {
            try {
                const ev = new KeyboardEvent(type, {
                    code: code,
                    key: PAD_KEY_VALUES[code] || code,
                    bubbles: true,
                    cancelable: true
                });
                window.dispatchEvent(ev);
            } catch (e) {}
        }

        function pollGamepad() {
            if (!navigator.getGamepads) return;

            let pad = null;
            try {
                const pads = navigator.getGamepads();
                for (let i = 0; i < pads.length; i++) {
                    if (pads[i] && pads[i].connected) { pad = pads[i]; break; }
                }
            } catch (e) { pad = null; }

            const next = new Set();

            if (pad) {
                if (!padConnectedSeen) {
                    padConnectedSeen = true;
                    console.info('[gamepad] connected:', pad.id || 'controller');
                }
                for (const index in PAD_BUTTON_MAP) {
                    const btn = pad.buttons && pad.buttons[index];
                    if (btn && btn.pressed) next.add(PAD_BUTTON_MAP[index]);
                }
                const ax = (pad.axes && pad.axes[0]) || 0;
                const ay = (pad.axes && pad.axes[1]) || 0;
                const DEAD_ZONE = 0.4;
                if (ax < -DEAD_ZONE) next.add('ArrowLeft');
                if (ax > DEAD_ZONE) next.add('ArrowRight');
                if (ay < -DEAD_ZONE) next.add('ArrowUp');
                if (ay > DEAD_ZONE) next.add('ArrowDown');
            } else if (padConnectedSeen) {
                padConnectedSeen = false;
            }

            // press edges
            next.forEach((code) => {
                if (!padHeldCodes.has(code)) dispatchSyntheticKey('keydown', code);
            });
            // release edges (also fires when the controller is unplugged mid-hold)
            padHeldCodes.forEach((code) => {
                if (!next.has(code)) dispatchSyntheticKey('keyup', code);
            });
            padHeldCodes = next;
        }

        window.addEventListener('gamepadconnected', (e) => {
            padConnectedSeen = true;
            console.info('[gamepad] connected:', (e.gamepad && e.gamepad.id) || 'controller');
        });
        window.addEventListener('gamepaddisconnected', () => {
            padHeldCodes.forEach((code) => dispatchSyntheticKey('keyup', code));
            padHeldCodes = new Set();
        });

        // =====================================================================
        // FULLSCREEN (mobile): fills the phone screen in landscape. Inside an
        // embedded iframe this only works if the host allows it, so every call
        // is wrapped and silently ignored when the browser refuses.
        // =====================================================================
        function isTouchDevice() {
            return Boolean(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        }

        // Inside a Google Sites (or any sandboxed) iframe without the
        // allowfullscreen attribute, fullscreenEnabled is false and every
        // request is rejected. Hide the control instead of leaving it dead.
        function fullscreenSupported() {
            try {
                return Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled);
            } catch (e) {
                return false;
            }
        }

        function markFullscreenSupport() {
            const supported = fullscreenSupported();
            document.documentElement.classList.toggle('no-fullscreen', !supported);
            return supported;
        }

        function enterGameFullscreen() {
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) return;
                const el = document.documentElement;
                const request = el.requestFullscreen || el.webkitRequestFullscreen;
                if (!request) return;
                const result = request.call(el, { navigationUI: 'hide' });
                if (result && typeof result.then === 'function') {
                    result.then(() => {
                        setTimeout(resizeCanvas, 150);
                        try {
                            if (screen.orientation && screen.orientation.lock) {
                                const lock = screen.orientation.lock('landscape');
                                if (lock && lock.catch) lock.catch(() => {});
                            }
                        } catch (e) {}
                    }).catch(() => {});
                }
            } catch (e) {}
        }

        function toggleGameFullscreen() {
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) {
                        const result = exit.call(document);
                        if (result && result.catch) result.catch(() => {});
                    }
                } else {
                    enterGameFullscreen();
                }
            } catch (e) {}
        }

        const btnFullscreen = document.getElementById('btn-fullscreen');
        if (btnFullscreen) {
            btnFullscreen.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleGameFullscreen();
            });
        }

        // First touch anywhere tries fullscreen once (browsers require a gesture)
        let autoFullscreenTried = false;
        window.addEventListener('pointerdown', (ev) => {
            if (autoFullscreenTried || !isTouchDevice()) return;
            // Tapping the FULL button itself must not auto-enter first, or the
            // button's own toggle would immediately undo it.
            if (ev && ev.target && ev.target.closest && ev.target.closest('#btn-fullscreen')) return;
            autoFullscreenTried = true;
            if (!markFullscreenSupport()) return;   // iframe forbids it: don't bother
            enterGameFullscreen();
        }, { capture: true });

        function syncFullscreenState() {
            const inFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            document.documentElement.classList.toggle('is-fullscreen', inFullscreen);
            setTimeout(resizeCanvas, 150);
        }

        document.addEventListener('fullscreenchange', syncFullscreenState);
        document.addEventListener('webkitfullscreenchange', syncFullscreenState);

        // Apply the detected mode now that everything is defined.
        // (Detection stays automatic; there is no on-screen mode button.)
        applySiteMode();
        markFullscreenSupport();

        // Initialize & Start 60 FPS Fixed-Timestep Game Loop on Load (120Hz/144Hz/240Hz safe)
        let gameBooted = false;
        function bootSuperMario() {
            if (gameBooted) return;
            gameBooted = true;
            resizeCanvas();
            loadLevel('1-1', 'main');
            gameState.phase = 'title';
            updateHUD();

            const FIXED_STEP = 1000 / 60;
            let lastFrameTime = performance.now();
            let accumulator = 0;

            function gameLoop(now) {
                pollGamepad();
                const delta = Math.min(100, Math.max(0, now - lastFrameTime));
                lastFrameTime = now;
                accumulator += delta;

                let steps = 0;
                while (accumulator >= FIXED_STEP && steps < 4) {
                    update();
                    accumulator -= FIXED_STEP;
                    steps++;
                }

                draw();
                requestAnimationFrame(gameLoop);
            }
            requestAnimationFrame(gameLoop);
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(bootSuperMario, 0);
        } else {
            window.addEventListener('DOMContentLoaded', bootSuperMario);
            window.addEventListener('load', bootSuperMario);
        }
    </script>

        function getOrCreatePlayerId() {
            const storageKey = 'super_mario_mp_uid';
            try {
                // Prefer localStorage so the player keeps the same Cloud Save ID across browser restarts
                const existingLocal = window.localStorage ? window.localStorage.getItem(storageKey) : null;
                if (existingLocal && /^[a-zA-Z0-9_\-]+$/.test(existingLocal)) return existingLocal;

                const existingSession = window.sessionStorage ? window.sessionStorage.getItem(storageKey) : null;
                if (existingSession && /^[a-zA-Z0-9_\-]+$/.test(existingSession)) {
                    if (window.localStorage) window.localStorage.setItem(storageKey, existingSession);
                    return existingSession;
                }

                const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase().replace(/[^A-Z0-9]/g, 'X');
                const created = `MARIO-${randomPart}`;
                if (window.localStorage) window.localStorage.setItem(storageKey, created);

        // The friendly MARIO-XXXXXX id is for DISPLAY ONLY (lobby footer). It is not the
        // write identity: Firestore rules authorise by request.auth.uid, which the server
        // assigns and the client cannot forge.
        function ensureFirebaseInitialized() {
            if (db && activePlayerId) return true;

                activePlayerId = getOrCreatePlayerId();
                gameState.mpUserId = activePlayerId;

                // Isolated try/catch so Google Sites iframe storage restrictions or disabled anonymous auth never block Firestore
                try {
                    auth = getAuth(app);
                    onAuthStateChanged(auth, (user) => {
                        if (user && user.uid && /^[a-zA-Z0-9_\-]+$/.test(user.uid)) {

                gameState.mpError = (err && err.code) || 'init failed';
                return false;
            }

        // Ensures we have a valid player identity for Firestore reads/writes.
        // Attempts optional anonymous sign-in if enabled, and seamlessly falls back to the
        // validated persistent MARIO-XXXXXX ID so multiplayer & cloud saves never fail with AUTH FAIL.
        function ensureSignedIn() {
            if (!ensureFirebaseInitialized()) return Promise.resolve(false);
            if (!activePlayerId) {
                activePlayerId = getOrCreatePlayerId();
                gameState.mpUserId = activePlayerId;
            }
            return Promise.resolve(true);

        // 1. Load the tiny Cloud Save summary once on boot (1 read) and merge with localStorage
        async function loadCompactCloudSaveFromFirebase() {
            if (!ensureFirebaseInitialized()) return;
            if (!(await ensureSignedIn())) {
                gameState.cloudSyncStatus = 'LOCAL';
                return;
            }
            try {
                const saveRef = doc(db, 'mario_cloud_saves', activePlayerId);
                const snap = await getDoc(saveRef);
                if (snap.exists()) {
                    const cloudData = snap.data();
                    mergeCompactCloudPacket(cloudData);
                    const pkt = getCompactPlayerPacket();
                    lastCloudSaveSignature = `${pkt.ts}|${pkt.bp}|${pkt.gf}|${pkt.ac}|${pkt.ch}|${pkt.cm}`;
                    gameState.cloudSyncStatus = 'SYNCED';
                } else {

                    await pushCompactCloudSaveToFirebase(true);
                }
            } catch (e) {
                gameState.cloudSyncStatus = 'LOCAL';
            }
        }

        // 2. Upload the tiny (~110 byte) player summary to Firestore ONLY when values change
        async function pushCompactCloudSaveToFirebase(force = false) {
            if (!ensureFirebaseInitialized()) return;
            if (!(await ensureSignedIn())) {
                gameState.cloudSyncStatus = 'LOCAL';
                return;
            }
            const pkt = getCompactPlayerPacket();
            const signature = `${pkt.ts}|${pkt.bp}|${pkt.gf}|${pkt.ac}|${pkt.ch}|${pkt.cm}`;

            // Never waste a Firestore write if the player's core progress hasn't changed
            if (!force && signature === lastCloudSaveSignature) return;

            const now = Date.now();
            if (!force && (now - lastCloudSaveTime) < 12000) {
                // Schedule a single trailing sync so rapid score updates batch into 1 write
                if (!pendingCloudSaveTimer) {
                    pendingCloudSaveTimer = setTimeout(() => {
                        pendingCloudSaveTimer = null;
                        pushCompactCloudSaveToFirebase(false);
                    }, 12000 - (now - lastCloudSaveTime));
                }
                return;
            }

            lastCloudSaveSignature = signature;
            lastCloudSaveTime = now;
            gameState.cloudSyncStatus = 'SYNCING';

            try {
                const saveRef = doc(db, 'mario_cloud_saves', activePlayerId);
                await setDoc(saveRef, {
                    uid: activePlayerId,
                    ts: pkt.ts, // Top Score
                    bp: pkt.bp, // Best Flappy Pipes
                    gf: pkt.gf, // Dimensional Gems Found
                    ac: pkt.ac, // 5-Bit Achievement Bitmask (0-31)
                    ch: pkt.ch, // Selected Character ID
                    cm: pkt.cm, // Collab Wingman Mode
                    ps: pkt.ps, // Pixel Scale (1-4)
                    ct: pkt.ct, // CRT Scanlines (0/1)
                    up: now     // Updated Timestamp
                });
                gameState.cloudSyncStatus = 'SYNCED';
                gameState.cloudError = null;
            } catch (e) {
                gameState.cloudSyncStatus = 'SAVE ERR';
                gameState.cloudError = (e && e.code) || 'write failed';
            }
        }

        window.queueCompactCloudSync = (immediate = false) => {
            pushCompactCloudSaveToFirebase(Boolean(immediate));
        };

        async function connectToMultiplayerRoom(roomName) {
            if (!ensureFirebaseInitialized()) return;
            gameState.mpStatus = 'CONNECTING';
            if (!(await ensureSignedIn())) return;
            if (unsubscribeRoom) {
                unsubscribeRoom();
                unsubscribeRoom = null;
            }
            const allowedRooms = ['ROOM-1', 'ROOM-2', 'ROOM-3', 'ROOM-4'];
            const safeRoom = allowedRooms.includes(roomName) ? roomName : 'ROOM-1';
            gameState.mpRoom = safeRoom;
            gameState.multiplayerEnabled = true;
            // LIVE is only claimed once a write actually lands (see broadcastLocalPlayer)
            gameState.mpStatus = 'CONNECTING';

            const playersQuery = query(
                collection(db, 'mario_mp_players'),
                where('room', '==', safeRoom)
            );

            unsubscribeRoom = onSnapshot(
                playersQuery,
                (snapshot) => {
                    const now = Date.now();
                    const nextPeers = {};
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (!data || docSnap.id === activePlayerId) return;
                        if (data.room === gameState.mpRoom && (now - (data.updatedAt || 0)) < 20000) {

                (err) => {
                    gameState.mpStatus = 'SYNC ERR';
                    gameState.mpError = (err && err.code) || 'listener denied';
                }

            await broadcastLocalPlayer(true);

            const clamp = (val, min, max, fallback = 0) => {

            // Skip redundant Firestore writes if player is idle and heartbeat (< 8s) hasn't elapsed
            if (!force && snapshotKey === lastSentSnapshotKey && (now - lastBroadcastTime) < 8000) {

                    character: ['mario', 'luigi', 'wario', 'toad'].includes(gameState.selectedCharacter) ? gameState.selectedCharacter : 'mario',
                    x: rx,
