                    type: (kartState.trackThwompEvery && idx % kartState.trackThwompEvery === 0) ? 'thwomp' : 'banana',
                    x: hx,
                    yOff: -16,
                    absY: null,
                    cooldown: 0
                });
            });

            // Build AI Rival Karts
            const allDrivers = [
                { id: 'mario',  name: 'MARIO',  speedFactor: 0.90 },
                { id: 'luigi',  name: 'LUIGI',  speedFactor: 0.89 },
                { id: 'wario',  name: 'WARIO',  speedFactor: 0.91 },
                { id: 'toad',   name: 'TOAD',   speedFactor: 0.88 },
                { id: 'bowser', name: 'BOWSER', speedFactor: 0.92 },
                { id: 'peach',  name: 'PEACH',  speedFactor: 0.87 },
                { id: 'yoshi',  name: 'YOSHI',  speedFactor: 0.88 },
                { id: 'dk',     name: 'D.K.',   speedFactor: 0.86 }
            ];
            const rivalCount = kartState.raceMode === '2p_vs' ? 6 : 7;
            const rivalsPool = allDrivers.filter(d => d.id !== gameState.selectedCharacter).slice(0, rivalCount);

            kartState.rivals = rivalsPool.map((rv, idx) => {
                const startX = 136 + (idx + 1) * 30;
                return {
                    id: rv.id,
                    name: rv.name,
                    x: startX,
                    y: getKartTerrainY(startX) - 18,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    onGround: true,
                    baseFactor: rv.speedFactor,
                    spinTimer: 0,
                    shrinkTimer: 0,
                    laneOffset: (idx % 3 - 1) * 3
                };
            });

            // Initialize Local Player 2 if in 2P Versus mode
            if (kartState.raceMode === '2p_vs') {
                const p2Char = gameState.selectedCharacter === 'luigi' ? 'mario' : 'luigi';
                kartState.p2 = {
                    id: p2Char,
                    name: `P2 ${p2Char.toUpperCase()}`,
                    x: 120,
                    y: getKartTerrainY(120) - 18,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    angularVel: 0,
                    chassisPitch: 0,
                    airRotationAccum: 0,
                    onGround: true,
                    onBridge: false,
                    wheelPhase: 0,
                    frontCompression: 0,
                    rearCompression: 0,
                    boostTimer: 0,
                    spinTimer: 0,
                    drifting: false,
                    driftCharge: 0,
                    heldItem: null,
                    rouletteTimer: 0,
                    lap: 1,
                    rank: 2
                };
            } else {
                kartState.p2 = null;
            }
        }

        function initMarioKartRace(trackId = kartState.trackId) {
            clearInputState();
            const charSpec = getActiveCharacterSpec();
            const ccMul = gameState.kartCC === 150 ? 1.12 : 1.0;

            gameState.mode = 'mario_kart';
            gameState.phase = 'playing';
            gameState.time = 300;
            gameState.timeCounter = 0;

            if (kartState.raceMode === 'online_gp' && window.mpConnect && !gameState.multiplayerEnabled) {
                window.mpConnect();
            }

            buildKartTrack(trackId);

            kartState.x = 120;
            kartState.y = getKartTerrainY(120) - 18;
            kartState.vx = 0;
            kartState.vy = 0;
            kartState.maxSpeed = 5.4 * charSpec.kartTopSpeed * ccMul;
            kartState.angle = 0;
            kartState.angularVel = 0;
            kartState.chassisPitch = 0;
            kartState.chassisPitchVel = 0;
            kartState.airRotationAccum = 0;
            kartState.onGround = true;
            kartState.onBridge = false;
            kartState.wheelPhase = 0;
            kartState.suspensionOffset = 0;
            kartState.suspensionVel = 0;
            kartState.frontCompression = 0;
            kartState.rearCompression = 0;
            kartState.throttlePedal = 0;
            kartState.brakePedal = 0;
            kartState.camLeadOffset = 0;
            kartState.drifting = false;
            kartState.driftCharge = 0;
            kartState.engineHeat = 0;
            kartState.overheatedTimer = 0;
            kartState.boostTimer = 0;
            kartState.starTimer = 0;
            kartState.bulletTimer = 0;
            kartState.spinTimer = 0;
            kartState.lightningFlash = 0;
            kartState.heldItem = null;
            kartState.rouletteTimer = 0;
            kartState.countdownTimer = 180;
            kartState.stuckFrames = 0;
            kartState.stuckCooldown = 0;
            kartState.crestCooldown = 0;
            kartState.jumpBuffer = 0;
            kartState.coyoteTimer = 0;
            kartState.rocketCharge = 0;
            kartState.lap = 1;
            kartState.rank = 8;
            kartState.raceTimerFrames = 0;
            kartState.finished = false;
            kartState.finishTimer = 0;
            particles = [];
            floatingTexts = [];
            updateHUD();
        }

        function useKartItem() {
            if (kartState.countdownTimer > 0 || kartState.finished) return;

            if (kartState.rouletteTimer > 0) {
                kartState.rouletteTimer = 1;
                return;
            }

            if (!kartState.heldItem) {
                // When no item is held, B / X / Shift acts as Excitebike Overdrive Nitro!
                return;
            }

            const item = kartState.heldItem;
            kartState.heldItem = null;

            if (item.id === 'mushroom') {
                sfx.kartBoost();
                kartState.boostTimer = 85;
                kartState.engineHeat = Math.max(0, kartState.engineHeat - 45);
                kartState.overheatedTimer = 0;
                kartState.vx = Math.max(kartState.vx, kartState.maxSpeed * 1.28);
                gameState.shakeTimer = 6;
                spawnFloatingText(kartState.x, kartState.y - 28, '🍄 TURBO MUSHROOM + COOL!', '#4ade80');
            } else if (item.id === 'star') {
                sfx.powerupCollect();
                kartState.starTimer = 340;
                kartState.boostTimer = 340;
                kartState.engineHeat = 0;
                player.starTimer = 340;
                spawnFloatingText(kartState.x, kartState.y - 28, '⭐ SUPER STAR POWER!', '#facc15');
            } else if (item.id === 'bullet') {
                sfx.cannon();
                kartState.bulletTimer = 180;
                kartState.boostTimer = 180;
                kartState.engineHeat = 0;
                gameState.shakeTimer = 10;
                spawnFloatingText(kartState.x, kartState.y - 28, '🚀 BULLET BILL JET!', '#38bdf8');
            } else if (item.id === 'lightning') {
                sfx.gemWarp();
                kartState.lightningFlash = 28;
                gameState.shakeTimer = 14;
                kartState.boostTimer = 55;
                kartState.rivals.forEach(rv => {
                    rv.spinTimer = 75;
                    rv.shrinkTimer = 360;
                    rv.vx *= 0.25;
                    rv.vy = -5.5;
                    rv.onGround = false;
                });
                if (kartState.p2) {
                    kartState.p2.spinTimer = 60;
                    kartState.p2.vx *= 0.3;
                }
                gameState.score += 800;
                spawnFloatingText(kartState.x, kartState.y - 28, '⚡ THUNDERBOLT STRIKE +800!', '#fef08a');
            } else if (item.id === 'red_shell' || item.id === 'green_shell') {
                sfx.fireball();
                kartState.trackObjects.push({
                    type: item.id,
                    x: kartState.x + 36,
                    y: kartState.y,
                    vx: Math.max(kartState.vx + 3.8, kartState.maxSpeed * 1.48),
                    life: 180,
                    cooldown: 0
                });
                spawnFloatingText(kartState.x, kartState.y - 28, item.id === 'red_shell' ? '🔴 HOMING SHELL!' : '🟢 RICOCHET SHELL!', '#4ade80');
            } else if (item.id === 'banana') {
                sfx.bump();
                const lx = ((kartState.x - 42) % KART_LAP_LENGTH + KART_LAP_LENGTH) % KART_LAP_LENGTH;
                kartState.trackObjects.push({
                    type: 'banana',
                    x: lx,
                    yOff: -16,
                    cooldown: 15
                });
                spawnFloatingText(kartState.x, kartState.y - 28, '🍌 BANANA TRAP SET!', '#facc15');
            }
        }

        function updateLocalPlayer2Kart(trackTheme) {
            const p2 = kartState.p2;
            if (!p2) return;

            if (p2.boostTimer > 0) p2.boostTimer--;
            if (p2.spinTimer > 0) p2.spinTimer--;

            const lx2 = ((p2.x % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH;

            for (let i = 0; i < kartState.boostPads.length; i++) {
                const bp = kartState.boostPads[i];
                if (lx2 >= bp.x && lx2 <= bp.x + bp.w && p2.onGround && p2.boostTimer < 20) {
                    p2.boostTimer = 45;
                    p2.vx = Math.max(p2.vx, kartState.maxSpeed * 1.25);
                    sfx.kartBoost();
                }
            }

            // P2 Racing Controls: Right = Accelerate, Left = Brake/Reverse, Down = Nitro Boost, Up = Hop/Drift
            const p2Nitro = p2Keys.down || p2Keys.item;
            const p2Throttle = p2Keys.right || p2Nitro;
            const p2Brake = p2Keys.left && !p2Throttle;
            const p2Drift = p2Keys.up;

            // Tap Up to Bunny-Hop, Hold Up to Power-Slide Drift
            if (p2Keys.upJustPressed && p2.onGround && p2.spinTimer === 0) {
                const onRamp = kartState.ramps.some(r => lx2 >= r.x && lx2 <= r.x + r.w);
                p2.vy = onRamp ? -7.8 : -5.6;
                p2.onGround = false;
                p2.airRotationAccum = 0;
                sfx.jump(onRamp);
            }

            if (p2Drift && p2.onGround && p2.vx > 2.0 && p2.spinTimer === 0) {
                p2.drifting = true;
                p2.driftCharge++;
            } else if (p2.drifting && p2.onGround) {
                if (p2.driftCharge >= 24) {
                    p2.boostTimer = 50;
                    p2.vx = Math.max(p2.vx, kartState.maxSpeed * 1.26);
                    sfx.kartBoost();
                }
                p2.drifting = false;
                p2.driftCharge = 0;
            }

            const surfBefore2 = resolveKartSurface(p2.x, p2.y, p2.vy, p2.onBridge);
            const groundSlope2 = surfBefore2.slope;
            const slopeForce2 = p2.onGround ? Math.sin(groundSlope2) * 0.14 : 0;

            if (p2.spinTimer > 0) {
                p2.vx *= 0.90;
            } else if (p2.boostTimer > 0) {
                const boostCap = kartState.maxSpeed * 1.28;
                p2.vx = Math.min(boostCap, p2.vx + 0.22);
                p2.chassisPitch += (-0.14 - p2.chassisPitch) * 0.25;
            } else if (p2Throttle) {
                const topSpd = kartState.maxSpeed * (p2Nitro ? 1.16 : (p2Drift ? 1.06 : 1.0));
                p2.vx = Math.min(topSpd, p2.vx + (p2Nitro ? 0.15 : 0.115) + slopeForce2);
                const squatPitch = p2Nitro ? -0.14 : -0.07;
                p2.chassisPitch += (squatPitch - p2.chassisPitch) * 0.22;
            } else if (p2Brake && p2.onGround) {
                if (p2.vx > 0.2) {
                    p2.vx = Math.max(0, p2.vx - 0.22);
                    p2.chassisPitch += (0.14 - p2.chassisPitch) * 0.25;
                } else {
                    p2.vx = Math.max(-1.8, p2.vx - 0.08);
                    p2.chassisPitch *= 0.8;
                }
            } else {
                p2.vx *= 0.965;
                p2.chassisPitch *= 0.85;
                if (Math.abs(p2.vx) < 0.06) p2.vx = 0;
            }

            p2.x = Math.max(60, p2.x + p2.vx);
            p2.wheelPhase += p2.vx * 0.22;

            const surfAfter2 = resolveKartSurface(p2.x, p2.y, p2.vy, p2.onBridge);
            const curY2 = surfAfter2.groundY;
            if (p2.onGround && (curY2 - surfBefore2.groundY) > 2.7 && p2.vx > 3.9) {
                p2.vy = -Math.min(8.2, p2.vx * 1.22);
                p2.onGround = false;
                p2.onBridge = false;
            }

            if (!p2.onGround) {
                p2.vy = Math.min(10, p2.vy + trackTheme.gravity);
                p2.y += p2.vy;
                p2.angle += (surfAfter2.slope - p2.angle) * 0.12;

                if (p2.y >= curY2 - 18) {
                    p2.y = curY2 - 18;
                    p2.vy = 0;
                    p2.onGround = true;
                    p2.onBridge = surfAfter2.isBridge;
                    p2.angle = surfAfter2.slope;
                    p2.angularVel = 0;
                    p2.airRotationAccum = 0;
                }
            } else {
                const targetY2 = curY2 - 18;
                if (targetY2 - p2.y > 20) {
                    p2.onGround = false;
                    p2.onBridge = false;
                } else {
                    p2.y = targetY2;
                    p2.onBridge = surfAfter2.isBridge;
                    p2.angle += (surfAfter2.slope + (p2.chassisPitch || 0) - p2.angle) * 0.34;
                }
            }

            p2.lap = Math.min(KART_TOTAL_LAPS, Math.floor(p2.x / KART_LAP_LENGTH) + 1);
            p2Keys.upJustPressed = false;
            p2Keys.downJustPressed = false;
            p2Keys.itemJustPressed = false;
        }

        function updateMarioKart() {
            const charSpec = getActiveCharacterSpec();
            const trackTheme = KART_TRACK_LIST.find(t => t.id === kartState.trackId) || KART_TRACK_LIST[0];
            const ccMul = gameState.kartCC === 150 ? 1.12 : 1.0;
            kartState.maxSpeed = 5.4 * charSpec.kartTopSpeed * ccMul;

            if (kartState.lightningFlash > 0) kartState.lightningFlash--;

            // 1. Lakitu 3-2-1-GO Countdown with Engine Revving & Squat!
            if (kartState.countdownTimer > 0) {
                if (kartState.countdownTimer === 179 || kartState.countdownTimer === 120 || kartState.countdownTimer === 60) {
                    sfx.lakituBeep(false);
                }
                const revHeld = keys.right || keys.down;
                kartState.throttlePedal += ((revHeld ? 1 : 0) - kartState.throttlePedal) * 0.25;
                if (revHeld) {
                    // Squat rear suspension and vibrate chassis while revving on the starting grid!
                    kartState.rearCompression = Math.min(0.85, kartState.rearCompression + 0.12);
                    kartState.chassisPitch = -0.10 + Math.sin(kartState.countdownTimer * 0.8) * 0.02;
                    if (kartState.countdownTimer % 5 === 0) {
                        sfx.enginePulse(0.65, false, false);
                        spawnParticles(kartState.x - 18, kartState.y + 12, '#e2e8f0', 2, 1.8);
                    }
                    if (kartState.countdownTimer < 85) {
                        kartState.rocketCharge++;
                    }
                } else {
                    kartState.rearCompression *= 0.8;
                    kartState.chassisPitch *= 0.8;
                }
                kartState.angle = getKartTerrainSlope(kartState.x) + kartState.chassisPitch;
                kartState.countdownTimer--;
                if (kartState.countdownTimer === 0) {
                    sfx.lakituBeep(true);
                    if (kartState.rocketCharge >= 12 && kartState.rocketCharge <= 78) {
                        sfx.kartBoost();
                        kartState.boostTimer = 65;
                        kartState.vx = kartState.maxSpeed * 1.26;
                        kartState.chassisPitch = -0.22; // Pop a launch wheelie!
                        kartState.rearCompression = 1.0;
                        gameState.shakeTimer = 8;
                        gameState.score += 300;
                        spawnFloatingText(kartState.x, kartState.y - 30, '🔥 ROCKET WHEELIE START +300!', '#facc15');
                    } else if (kartState.rocketCharge > 78) {
                        // Over-rev burnout sputter if held from the very beginning of 3-2-1
                        sfx.spinOut();
                        kartState.vx = 1.2;
                        spawnParticles(kartState.x - 16, kartState.y + 12, '#475569', 10, 3);
                        spawnFloatingText(kartState.x, kartState.y - 28, '💨 WHEELSPIN BURNOUT!', '#f87171');
                    }
                }
                keys.jumpJustPressed = false;
                keys.dashJustPressed = false;
                keys.downJustPressed = false;
                p2Keys.upJustPressed = false;
                p2Keys.itemJustPressed = false;
                return;
            }

            // 2. Post-Race Finish Sequence
            if (kartState.finished) {
                kartState.finishTimer++;
                kartState.vx *= 0.95;
                kartState.x += kartState.vx;
                const finSurf = resolveKartSurface(kartState.x, kartState.y, 0, kartState.onBridge);
                kartState.y = finSurf.groundY - 18;
                kartState.angle += (finSurf.slope - kartState.angle) * 0.25;
                if (kartState.finishTimer > 90) {
                    const ordinal = ['1ST', '2ND', '3RD', '4TH', '5TH', '6TH', '7TH', '8TH'][kartState.rank - 1] || `${kartState.rank}TH`;
                    gameState.clearHeadline = `MARIO KART: ${ordinal} PLACE!`;
                    gameState.clearCursor = 0;
                    savePlayerProgress();
                    if (window.queueCompactCloudSync) window.queueCompactCloudSync(true);
                    gameState.phase = 'course_clear';
                }
                return;
            }

            kartState.raceTimerFrames++;
            if (kartState.raceTimerFrames % 60 === 0 && gameState.time > 0) {
                gameState.time--;
            }

            // Item Roulette Spin
            if (kartState.rouletteTimer > 0) {
                kartState.rouletteTimer--;
                if (kartState.rouletteTimer % 5 === 0) {
                    sfx.playTone(520 + (kartState.rouletteTimer * 18) % 400, 'square', 0.04, 0, null, 0.06);
                }
                if (kartState.rouletteTimer === 0) {
                    let pool = KART_ITEMS;
                    if (kartState.rank === 1) {
                        pool = KART_ITEMS.filter(it => it.id !== 'bullet' && it.id !== 'lightning');
                    } else if (kartState.rank >= 4) {
                        pool = KART_ITEMS.filter(it => it.id !== 'banana');
                    }
                    kartState.heldItem = pool[Math.floor(Math.random() * pool.length)];
                    sfx.coin();
                }
            }

            // Use Item on B / Dash press
            if (keys.dashJustPressed) {
                useKartItem();
            }

            // Timers
            if (kartState.boostTimer > 0) kartState.boostTimer--;
            if (kartState.starTimer > 0) {
                kartState.starTimer--;
                player.starTimer = kartState.starTimer;
            }
            if (kartState.bulletTimer > 0) kartState.bulletTimer--;
            if (kartState.spinTimer > 0) kartState.spinTimer--;
            if (kartState.overheatedTimer > 0) kartState.overheatedTimer--;

            const lx = ((kartState.x % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH;

            // Check Mud Patches & Zipper Boost Pads on Main Terrain
            let inMud = false;
            if (kartState.onGround && !kartState.onBridge) {
                for (let i = 0; i < kartState.mudPatches.length; i++) {
                    const mp = kartState.mudPatches[i];
                    if (lx >= mp.x && lx <= mp.x + mp.w) {
                        inMud = true;
                        if (Math.abs(kartState.vx) > 1.2 && kartState.raceTimerFrames % 4 === 0) {
                            spawnParticles(kartState.x - 10, kartState.y + 14, '#78350f', 2, 2.0);
                        }
                        break;
                    }
                }

                for (let i = 0; i < kartState.boostPads.length; i++) {
                    const bp = kartState.boostPads[i];
                    if (lx >= bp.x && lx <= bp.x + bp.w) {
                        if (kartState.boostTimer < 20) {
                            sfx.kartBoost();
                            gameState.shakeTimer = 5;
                            spawnParticles(kartState.x - 16, kartState.y + 12, '#22d3ee', 8, 3.5);
                            spawnFloatingText(kartState.x, kartState.y - 26, '⚡ COOLING ZIPPER BOOST!', '#22d3ee');
                        }
                        kartState.boostTimer = Math.max(kartState.boostTimer, 42);
                        kartState.engineHeat = Math.max(0, kartState.engineHeat - 3.5);
                        kartState.overheatedTimer = 0;
                        break;
                    }
                }
            }

            // 3. Hill Climb Racing + Excitebike Physics:
            // ▶ (right) = Accelerate, ◀ (left) = Brake/Reverse, ▼ (down / Nitro SVG) = Nitro Boost, A (jump) = Hop & Drift, B (dash) = Item
            if (kartState.bulletTimer > 0) {
                kartState.vx = kartState.maxSpeed * 1.38;
                const targetHoverY = getKartTerrainY(kartState.x) - 54;
                kartState.y += (targetHoverY - kartState.y) * 0.25;
                kartState.vy = 0;
                kartState.angle = getKartTerrainSlope(kartState.x) * 0.5;
                kartState.onGround = false;
                kartState.onBridge = false;
            } else {
                const coinBonus = 1 + Math.min(10, gameState.coins) * 0.01;
                const baseTopSpeed = kartState.maxSpeed * coinBonus;

                // Nitro Button (▼ / S / Down button with Nitro SVG icon) engages Overdrive Turbo!
                const nitroHeld = keys.down && kartState.overheatedTimer === 0 &&
                    kartState.spinTimer === 0 && !kartState.finished;
                // A Button (Space / W / A button) hops on tap and Power-Slide Drifts when held!
                const driftHeld = keys.jump && kartState.spinTimer === 0;

                if (nitroHeld) {
                    // Rising edge: ignition feedback fires once, not every frame.
                    if (!kartState.nitroActive) {
                        kartState.nitroActive = true;
                        sfx.nitroWhoosh();
                        gameState.shakeTimer = Math.max(gameState.shakeTimer || 0, 7);
                        spawnParticles(kartState.x - 22, kartState.y + 10, '#fef08a', 9, 3.4);
                        spawnParticles(kartState.x - 18, kartState.y + 6, '#22d3ee', 7, 3.0);
                    }
                    kartState.engineHeat = Math.min(100, kartState.engineHeat + 0.42);
                    if (kartState.raceTimerFrames % 3 === 0) {
                        spawnParticles(kartState.x - 20, kartState.y + 8, '#22d3ee', 2, 2.6);
                    }
                    // Exhaust flame trail behind the kart.
                    if (kartState.raceTimerFrames % 2 === 0) {
                        spawnParticles(kartState.x - 16, kartState.y + 12, '#f97316', 1, 1.8);
                    }
                    if (kartState.engineHeat >= 100) {
                        kartState.overheatedTimer = 80;
                        kartState.nitroActive = false;
                        sfx.overheatAlarm();
                        spawnParticles(kartState.x - 14, kartState.y, '#ef4444', 12, 3.5);
                        spawnParticles(kartState.x - 10, kartState.y - 8, '#94a3b8', 8, 1.6);
                        spawnFloatingText(kartState.x, kartState.y - 30, '♨️ ENGINE OVERHEAT!', '#f87171');
                    }
                } else {
                    kartState.nitroActive = false;
                    kartState.engineHeat = Math.max(0, kartState.engineHeat - (kartState.onGround ? 0.50 : 0.72));
                }

                // Mirror the overheat state on the on-screen nitro button. This has
                // to run per frame: the HUD only refreshes on events, so a button
                // driven from there would stay stale while you are driving.
                const over = kartState.overheatedTimer > 0;
                if (padOverheatState !== over) {
                    padOverheatState = over;
                    const vPadEl = document.getElementById('virtual-gamepad');
                    if (vPadEl) vPadEl.classList.toggle('kart-overheat', over);
                }

                // Bunny-Hop on Tap A, with input buffering and coyote time.
                // A tap pressed slightly before landing, or slightly after
                // leaving the ground, used to be swallowed entirely; both are
                // now honoured, which is what makes a hop feel responsive.
                if (keys.jumpJustPressed) kartState.jumpBuffer = 8;
                if (kartState.onGround) kartState.coyoteTimer = 6;
                else if (kartState.coyoteTimer > 0) kartState.coyoteTimer--;
                if (kartState.jumpBuffer > 0) kartState.jumpBuffer--;

                if (kartState.jumpBuffer > 0 && kartState.spinTimer === 0 &&
                    (kartState.onGround || kartState.coyoteTimer > 0)) {
                    const onRamp = kartState.ramps.some(r => lx >= r.x && lx <= r.x + r.w);
                    kartState.vy = onRamp ? -8.2 : -5.8;
                    kartState.onGround = false;
                    kartState.onBridge = false;
                    kartState.airRotationAccum = 0;
                    kartState.suspensionOffset = -3.5;
                    kartState.frontCompression = 0;
                    kartState.rearCompression = 0;
                    kartState.jumpBuffer = 0;
                    kartState.coyoteTimer = 0;
                    sfx.jump(onRamp);
                    spawnParticles(kartState.x - 12, kartState.y + 14, '#fef08a', 6, 2.4);
                }

                // Power-Slide Drift Charging while holding A (keys.jump) at speed
                if (driftHeld && kartState.onGround && kartState.vx > 1.8) {
                    kartState.drifting = true;
                    kartState.driftCharge++;
                    if (kartState.raceTimerFrames % 2 === 0) {
                        kartState.skidMarks.push({ x: kartState.x - 12, y: kartState.y + 15, color: '#1e293b', life: 95 });
                    }
                    // Screech on a throttle, so it reads as a slide and not a buzz.
                    if (kartState.raceTimerFrames % 9 === 0) {
                        sfx.kartSkid(0.6 + Math.min(1, kartState.driftCharge / 90));
                    }
                    // Sparks get brighter the longer the charge is held.
                    if (kartState.raceTimerFrames % 4 === 0 && kartState.driftCharge > 20) {
                        const sparkColor = kartState.driftCharge > 70 ? '#f472b6'
                            : (kartState.driftCharge > 40 ? '#facc15' : '#38bdf8');
                        spawnParticles(kartState.x - 14, kartState.y + 16, sparkColor, 2, 2.2);
                    }
                } else if (kartState.drifting && kartState.onGround) {
                    if (kartState.driftCharge >= 20) {
                        const isUltra = kartState.driftCharge >= 45;
                        sfx.kartBoost();
                        kartState.boostTimer = isUltra ? 68 : 44;
                        kartState.vx = Math.max(kartState.vx, baseTopSpeed * (isUltra ? 1.28 : 1.18));
                        kartState.chassisPitch = -0.20; // Pop wheelie on mini-turbo release!
                        kartState.rearCompression = 0.9;
                        gameState.score += isUltra ? 400 : 200;
                        spawnFloatingText(kartState.x, kartState.y - 28, isUltra ? '🟣 ULTRA MINI-TURBO +400!' : '🟠 MINI-TURBO +200!', isUltra ? '#e879f9' : '#f97316');
                        sfx.driftRelease(isUltra ? 3 : 2);
                    }
                    kartState.drifting = false;
                    kartState.driftCharge = 0;
                }

                // Dual-Axle Ground Sampling (Rear wheel at x-13, Front wheel at x+13)
                const rearSurf = resolveKartSurface(kartState.x - 13, kartState.y, kartState.vy, kartState.onBridge);
                const frontSurf = resolveKartSurface(kartState.x + 13, kartState.y, kartState.vy, kartState.onBridge);
                const centerSurf = resolveKartSurface(kartState.x, kartState.y, kartState.vy, kartState.onBridge);
                const wheelBaseAngle = Math.atan2(frontSurf.groundY - rearSurf.groundY, 26);

                // Side Button ▶ (keys.right) or Nitro (keys.down) = Accelerate; Side Button ◀ (keys.left) = Brake / Reverse
                // Slipstream: tucking in behind another kart cuts drag. Real
                // racing, and it rewards holding a line instead of trading paint.
                let drafting = false;
                for (let i = 0; i < kartState.rivals.length; i++) {
                    const rv = kartState.rivals[i];
                    const gapX = (rv.x || 0) - kartState.x;
                    const gapY = Math.abs((rv.y || 0) - kartState.y);
                    if (gapX > 24 && gapX < 165 && gapY < 42 && kartState.vx > 2.5) {
                        drafting = true;
                        break;
                    }
                }
                kartState.drafting = drafting;

                const gasPedalHeld = keys.right || nitroHeld;
                const brakePedalHeld = keys.left && !gasPedalHeld;

                kartState.throttlePedal += ((gasPedalHeld ? 1 : 0) - kartState.throttlePedal) * 0.3;
                kartState.brakePedal += ((brakePedalHeld ? 1 : 0) - kartState.brakePedal) * 0.3;

                // Gravity component along hill slope (climbing steep hills slows you slightly; downhill speeds you up!)
                const slopeGravity = kartState.onGround ? Math.sin(wheelBaseAngle) * 0.13 : 0;

                if (kartState.vx < -2.2) kartState.vx = -2.2;   // cap reverse speed
                if (kartState.spinTimer > 0) {
                    kartState.vx *= 0.90;
                    kartState.chassisPitch *= 0.85;
                } else if (kartState.boostTimer > 0 || kartState.starTimer > 0) {
                    const boostCap = baseTopSpeed * 1.28;
                    kartState.vx = Math.min(boostCap, kartState.vx + 0.21 * charSpec.kartAccel);
                    kartState.chassisPitch += (-0.16 - kartState.chassisPitch) * 0.22;
                    kartState.rearCompression += (0.65 - kartState.rearCompression) * 0.25;
                    kartState.frontCompression *= 0.8;
                } else if (gasPedalHeld) {
                    let maxAllowed = baseTopSpeed;
                    if (kartState.overheatedTimer > 0) maxAllowed *= 0.55;
                    else if (nitroHeld) maxAllowed *= 1.22;
                    else if (inMud) maxAllowed *= (charSpec.id === 'toad' ? 0.76 : 0.60);
                    if (drafting && kartState.overheatedTimer === 0) maxAllowed *= 1.09;

                    // Slipstream tell: a small air-streak burst behind the kart.
                    if (drafting && kartState.raceTimerFrames % 12 === 0) {
                        spawnParticles(kartState.x - 18, kartState.y + 6, '#93c5fd', 2, 1.5);
                    }

                    // Grip ramp: from a standstill the tyres scrabble for a
                    // moment before they hook up, so the launch builds instead
                    // of snapping to full acceleration.
                    const gripFactor = kartState.vx < 1.2 ? 0.72 : (kartState.vx < 2.4 ? 0.88 : 1.0);
                    const accelRate = (nitroHeld ? 0.165 : 0.115) * charSpec.kartAccel * gripFactor;
                    const prevVx = kartState.vx;
                    // Climb assist: on a steep uphill the slope force can cancel the
                    // throttle and leave the kart stalled on the face of a hill.
                    const climbAssist = (slopeGravity < -0.045 && kartState.vx < 2.2) ? 0.055 : 0;
                    if (kartState.vx < maxAllowed) {
                        kartState.vx = Math.min(maxAllowed, kartState.vx + accelRate + slopeGravity + climbAssist);
                    } else {
                        kartState.vx = Math.max(maxAllowed, kartState.vx - 0.07 + slopeGravity);
                    }

                    // Cornering scrub: leaning on the steering at speed costs a
                    // little momentum, the way real tyres give up grip.
                    if ((keys.left || keys.right) && kartState.vx > baseTopSpeed * 0.75 && kartState.onGround) {
                        kartState.vx -= 0.02;
                    }

                    // Automatic Hill-Climb Torque Squat & Wheelie on hard acceleration / Nitro
                    const torqueRatio = Math.max(0, (kartState.vx - prevVx) * 6.5);
                    const targetSquatPitch = nitroHeld ? -0.18 : -Math.min(0.12, torqueRatio * 0.09 + 0.03);
                    kartState.chassisPitch += (targetSquatPitch - kartState.chassisPitch) * 0.22;
                    kartState.rearCompression += (Math.min(0.80, torqueRatio * 0.5 + (nitroHeld ? 0.45 : 0.2)) - kartState.rearCompression) * 0.25;
                    kartState.frontCompression *= 0.85;

                    // Kick up dirt / tire burnout particles when launching from standstill
                    if (kartState.onGround && kartState.vx < 2.6 && kartState.raceTimerFrames % 3 === 0) {
                        spawnParticles(kartState.x - 15, kartState.y + 14, inMud ? '#78350f' : '#fef08a', 2, 2.2);
                        kartState.skidMarks.push({ x: kartState.x - 14, y: kartState.y + 15, color: '#334155', life: 80 });
                    }
                } else if (brakePedalHeld) {
                    if (kartState.vx > 0.22) {
                        // Active Braking: Nose-Dive front suspension, lift rear, leave skid marks & smoke!
                        // Brakes bite harder the faster you are travelling, so
                        // stopping from top speed takes a realistic distance
                        // rather than the same fixed bite at any speed.
                        const speedRatio = Math.min(1.4, kartState.vx / Math.max(1, baseTopSpeed));
                        const brakeForce = (kartState.onGround ? 0.20 + 0.10 * speedRatio : 0.10) * charSpec.kartHandling;
                        kartState.vx = Math.max(0, kartState.vx - brakeForce);
                        kartState.chassisPitch += (0.16 - kartState.chassisPitch) * 0.28; // Nose dive!
                        kartState.frontCompression += (0.80 - kartState.frontCompression) * 0.30;
                        kartState.rearCompression *= 0.75;

                        if (kartState.onGround && kartState.raceTimerFrames % 3 === 0) {
                            spawnParticles(kartState.x + 10, kartState.y + 14, '#e2e8f0', 2, 1.6);
                            kartState.skidMarks.push({ x: kartState.x - 10, y: kartState.y + 15, color: '#0f172a', life: 110 });
                            sfx.enginePulse(kartState.vx / baseTopSpeed, false, true);
                        }
                    } else if (kartState.onGround) {
                        // Smooth Reverse Gear
                        kartState.vx = Math.max(-1.85, kartState.vx - 0.085);
                        kartState.chassisPitch += (0.06 - kartState.chassisPitch) * 0.2;
                        kartState.frontCompression += (0.3 - kartState.frontCompression) * 0.2;
                    }
                } else {
                    // Natural rolling coast & suspension leveling
                    kartState.vx = kartState.vx * 0.968 + (kartState.onGround ? slopeGravity * 0.55 : 0);
                    if (Math.abs(kartState.vx) < 0.05) kartState.vx = 0;
                    kartState.chassisPitch *= 0.84;
                    kartState.frontCompression *= 0.82;
                    kartState.rearCompression *= 0.82;
                }

                // Synthesized Engine Purr proportional to speed
                if (kartState.raceTimerFrames % 6 === 0 && (Math.abs(kartState.vx) > 0.3 || gasPedalHeld)) {
                    sfx.enginePulse(kartState.vx / baseTopSpeed, kartState.boostTimer > 0 || nitroHeld, false);
                }

                // Advance X & Wheel Rotation
                kartState.x = Math.max(60, kartState.x + kartState.vx);
                kartState.wheelPhase += kartState.vx * 0.22;

                // Re-sample dual-axle surface at new X
                const nextRear = resolveKartSurface(kartState.x - 13, kartState.y, kartState.vy, kartState.onBridge);
                const nextFront = resolveKartSurface(kartState.x + 13, kartState.y, kartState.vy, kartState.onBridge);
                const nextCenter = resolveKartSurface(kartState.x, kartState.y, kartState.vy, kartState.onBridge);
                const nextWheelAngle = Math.atan2(nextFront.groundY - nextRear.groundY, 26);
                const avgGroundY = (nextRear.groundY + nextFront.groundY) * 0.5;
                const prevAvgGroundY = (rearSurf.groundY + frontSurf.groundY) * 0.5;
                const terrainDropRate = avgGroundY - prevAvgGroundY;

                // Natural Crest Launch: only a real lip should throw the kart, and
                // only at speed. This used to fire on ordinary rolling hills
                // (drop rate 2.65 at 3.7 speed), which launched the kart 12-18
                // times a minute with no jump input and left it airborne a
                // quarter of the race. Now it takes a genuine crest, a cooldown
                // stops it chaining, and the impulse is gentler. No jump sound:
                // the player did not jump.
                if (kartState.crestCooldown > 0) kartState.crestCooldown--;
                // Ramps already throw the kart by their own geometry, and bridge
                // decks end in their own drop — firing the crest rule there
                // doubled the impulse and kept the kart airborne for ~90 frames
                // per ramp. Only plain terrain crests may trigger it now.
                const atRampLip = kartState.ramps.some(r => lx >= r.x + r.w - 40 && lx <= r.x + r.w + 30);
                const nearBridge = kartState.highPlatforms.some(hp => lx >= hp.x - 48 && lx <= hp.x + hp.w + 48);
                if (kartState.onGround && kartState.crestCooldown === 0) {
                    if (atRampLip && kartState.vx > 3.0) {
                        // A ramp lip is meant to throw you: this is the jump the
                        // track was designed around, so it keeps its full impulse.
                        kartState.vy = -Math.min(5.2, kartState.vx * 0.78);
                        kartState.onGround = false;
                        kartState.onBridge = false;
                        kartState.airRotationAccum = 0;
                        kartState.crestCooldown = 30;
                        sfx.jump(true);
                    } else if (!nearBridge && terrainDropRate > 5.2 && kartState.vx > 5.0) {
                        // A natural crest on plain ground: a small skip, not a jump.
                        kartState.vy = -Math.min(5.4, kartState.vx * 0.85);
                        kartState.onGround = false;
                        kartState.onBridge = false;
                        kartState.airRotationAccum = 0;
                        kartState.crestCooldown = 45;
                    }
                }

                // Update Under-Chassis Spring-Damper Shock Absorber (Hooke's Law + Damping)
                const springK = 0.28;
                const springDamp = 0.72;
                kartState.suspensionVel = (kartState.suspensionVel - kartState.suspensionOffset * springK) * springDamp;
                kartState.suspensionOffset += kartState.suspensionVel;
                if (Math.abs(kartState.suspensionOffset) < 0.08 && Math.abs(kartState.suspensionVel) < 0.08) {
                    kartState.suspensionOffset = 0;
                    kartState.suspensionVel = 0;
                }

                if (!kartState.onGround) {
                    kartState.vy = Math.min(10.5, kartState.vy + trackTheme.gravity);
                    kartState.y += kartState.vy;

                    // Air control: a small nudge so a jump can be steered rather
                    // than being a ride you cannot influence.
                    if (kartState.bulletTimer === 0) {
                        if (keys.left) kartState.vx = Math.max(-1.0, kartState.vx - 0.045);
                        else if (keys.right) kartState.vx = Math.min(kartState.maxSpeed * 1.25, kartState.vx + 0.045);
                    }
                    kartState.frontCompression *= 0.85;
                    kartState.rearCompression *= 0.85;

                    // Smooth automatic mid-air suspension arc that aligns with the landing slope
                    const airTargetAngle = nextWheelAngle + Math.max(-0.22, Math.min(0.22, kartState.vy * 0.025));
                    kartState.angle += (airTargetAngle - kartState.angle) * 0.14;

                    // Check Landing on Resolved Surface (Bridge or Main Hill)
                    const groundHitY = avgGroundY - 18;
                    if (kartState.y >= groundHitY) {
                        const impactVy = kartState.vy;
                        kartState.y = groundHitY;
                        kartState.vy = 0;
                        kartState.onGround = true;
                        kartState.onBridge = nextCenter.isBridge;

                        // Compress spring-damper shocks on landing!
                        kartState.suspensionOffset = Math.min(9, impactVy * 0.85);
                        kartState.suspensionVel = impactVy * 0.25;
                        kartState.frontCompression = Math.min(1, impactVy * 0.11);
                        kartState.rearCompression = Math.min(1, impactVy * 0.11);
                        sfx.suspensionLand(impactVy / 5);

                        if (impactVy > 5.0 && kartState.vx > 3.0) {
                            // Smooth Shock Absorption Landing Boost after big ramp jumps!
                            sfx.kartBoost();
                            kartState.boostTimer = Math.max(kartState.boostTimer, 36);
                            kartState.vx = Math.min(kartState.maxSpeed * 1.24, kartState.vx + 1.1);
                            kartState.chassisPitch = -0.14;
                            gameState.score += 150;
                            spawnParticles(kartState.x - 14, kartState.y + 12, '#4ade80', 8, 3);
                            spawnFloatingText(kartState.x, kartState.y - 26, '✨ SHOCK BOOST +150!', '#4ade80');
                        }
                        kartState.angle = nextWheelAngle;
                        kartState.angularVel = 0;
                        kartState.airRotationAccum = 0;
                    }
                } else {
                    // On Ground: Follow dual-wheel contour or drop off bridge edge smoothly
                    const targetGroundY = avgGroundY - 18;
                    if (targetGroundY - kartState.y > 20) {
                        // Drove off the end of an elevated overpass bridge -> become airborne!
                        kartState.onGround = false;
                        kartState.onBridge = false;
                    } else {
                        // Subtle suspension compression when hitting the bottom of a dip/valley
                        const slopeChange = nextWheelAngle - wheelBaseAngle;
                        if (slopeChange < -0.02 && kartState.vx > 2.5) {
                            kartState.frontCompression = Math.min(0.9, kartState.frontCompression + Math.abs(slopeChange) * 6);
                            kartState.rearCompression = Math.min(0.9, kartState.rearCompression + Math.abs(slopeChange) * 5);
                            kartState.suspensionVel += Math.abs(slopeChange) * 3.5;
                        }
                        kartState.y = targetGroundY;
                        kartState.onBridge = nextCenter.isBridge;
                        const targetAngle = nextWheelAngle + kartState.chassisPitch;
                        kartState.angle += (targetAngle - kartState.angle) * 0.35;
                    }
                }
            }

            // ---------------------------------------------------------------
            // Fall recovery. Nothing in the track geometry should ever drop the
            // kart through the floor, but a bad landing on a bridge seam or a
            // physics glitch would otherwise leave it falling for ever.
            // ---------------------------------------------------------------
            if (!kartState.finished) {
                const surfaceY = getKartTerrainY(kartState.x);
                if (kartState.y > surfaceY + 140) {
                    kartState.y = surfaceY - 18;
                    kartState.vy = 0;
                    kartState.vx = Math.min(kartState.vx, 2.5);
                    kartState.onGround = true;
                    kartState.onBridge = false;
                    kartState.spinTimer = 0;
                    kartState.angle = getKartTerrainSlope(kartState.x);
                    spawnParticles(kartState.x, kartState.y + 10, '#38bdf8', 8, 2.4);
                }
            }

            // ---------------------------------------------------------------
            // Anti-stuck assist.
            // Whatever the cause (a crest, a bridge seam, a collision, a bad
            // landing), a kart sitting still with the throttle down is never
            // intended. Nudge it free once it has clearly stopped trying.
            // ---------------------------------------------------------------
            const wantsToMove = keys.right || keys.down;
            if (kartState.stuckCooldown > 0) kartState.stuckCooldown--;
            if (!kartState.finished && wantsToMove && kartState.onGround &&
                Math.abs(kartState.vx) < 0.5 && kartState.spinTimer === 0) {
                kartState.stuckFrames++;
                if (kartState.stuckFrames > 40 && kartState.stuckCooldown === 0) {
                    kartState.vx = Math.max(kartState.vx, 1.4);
                    kartState.vy = Math.min(kartState.vy, -1.5);
                    kartState.stuckFrames = 0;
                    kartState.stuckCooldown = 90;
                    spawnParticles(kartState.x - 12, kartState.y + 14, '#fde68a', 6, 2.2);
                }
            } else {
                kartState.stuckFrames = 0;
            }

            // Dynamic Camera G-Force Lag & Speed Lines when Boosting!
            const targetCamLead = (kartState.boostTimer > 0 || kartState.bulletTimer > 0)
                ? -28
                : (kartState.brakePedal > 0.4 && kartState.vx > 1.0 ? 18 : 0);
            kartState.camLeadOffset += (targetCamLead - kartState.camLeadOffset) * 0.14;

            if (kartState.boostTimer > 0 || kartState.bulletTimer > 0 || kartState.vx > kartState.maxSpeed * 1.05) {
                if (kartState.raceTimerFrames % 2 === 0 && kartState.speedLines.length < 18) {
                    kartState.speedLines.push({
                        x: canvas.width + 20,
                        y: 55 + Math.random() * (canvas.height - 95),
                        len: 35 + Math.random() * 45,
                        speed: 18 + Math.random() * 10
                    });
                }
            }
            for (let i = kartState.speedLines.length - 1; i >= 0; i--) {
                const sl = kartState.speedLines[i];
                sl.x -= sl.speed;
                if (sl.x + sl.len < 0) kartState.speedLines.splice(i, 1);
            }
            for (let i = kartState.skidMarks.length - 1; i >= 0; i--) {
                kartState.skidMarks[i].life--;
                if (kartState.skidMarks[i].life <= 0) kartState.skidMarks.splice(i, 1);
            }

            // Update Local Player 2 if in 2P Versus mode
            if (kartState.raceMode === '2p_vs' && kartState.p2) {
                updateLocalPlayer2Kart(trackTheme);
            }

            // 4. Update Track Objects (Item Boxes, Coins, 2D Shells & Hazards)
            for (let i = kartState.trackObjects.length - 1; i >= 0; i--) {
                const obj = kartState.trackObjects[i];
                if (obj.cooldown > 0) obj.cooldown--;

                if (obj.type === 'red_shell' || obj.type === 'green_shell') {
                    obj.x += obj.vx;
                    obj.y = getKartTerrainY(obj.x) - 14;
                    obj.life--;

                    let hitRival = false;
                    kartState.rivals.forEach(rv => {
                        const dist = Math.abs((rv.x % KART_LAP_LENGTH) - (obj.x % KART_LAP_LENGTH));
                        if (dist < 34 && rv.spinTimer === 0) {
                            rv.spinTimer = 65;
                            rv.vx *= 0.2;
                            rv.vy = -6.0;
                            rv.onGround = false;
                            hitRival = true;
                            sfx.stomp();
                            gameState.score += 500;
                            spawnParticles(rv.x, rv.y, '#4ade80', 10, 4);
                            spawnFloatingText(kartState.x, kartState.y - 32, `🎯 SHELL HIT ${rv.name} +500!`, '#4ade80');
                        }
                    });

                    if (hitRival || obj.life <= 0) {
                        kartState.trackObjects.splice(i, 1);
                    }
                    continue;
                }

                if (obj.cooldown > 0) continue;

                const objY = obj.absY !== null && obj.absY !== undefined
                    ? obj.absY
                    : (getKartTerrainY(obj.x) + (obj.yOff || -20));
                const dx = Math.abs(lx - obj.x);
                const dy = Math.abs(kartState.y - objY);

                if (dx < 32 && dy < 32) {
                    if (obj.type === 'item_box') {
                        obj.cooldown = 160;
                        sfx.powerupAppear();
                        spawnParticles(kartState.x, objY, '#22d3ee', 10, 3.5);
                        if (!kartState.heldItem && kartState.rouletteTimer === 0) {
                            kartState.rouletteTimer = 32;
                        }
                        gameState.score += 100;
                    } else if (obj.type === 'coin') {
                        obj.cooldown = 220;
                        sfx.coin();
                        addCoin();
                        gameState.score += 200;
                        spawnParticles(kartState.x, objY, '#facc15', 5, 2.5);
                    } else if (obj.type === 'banana' || obj.type === 'thwomp') {
                        obj.cooldown = 110;
                        if (kartState.starTimer > 0 || kartState.bulletTimer > 0) {
                            sfx.stomp();
                            gameState.score += 200;
                            spawnParticles(kartState.x, objY, '#facc15', 8, 4);
                        } else if (kartState.spinTimer === 0) {
                            sfx.spinOut();
                            kartState.spinTimer = 36;
                            kartState.vx *= 0.38;
                            kartState.vy = -5.0;
                            kartState.onGround = false;
                            gameState.shakeTimer = 10;
                            spawnFloatingText(kartState.x, kartState.y - 28, obj.type === 'thwomp' ? '💥 THWOMP SLAM!' : '🍌 BANANA SPIN-OUT!', '#f87171');
                        }
                    }
                }
            }

            // 5. Update AI Rival Karts along the hills & ramps
            let aheadCount = 0;
            kartState.rivals.forEach((rv) => {
                if (rv.shrinkTimer > 0) rv.shrinkTimer--;
                if (rv.spinTimer > 0) {
                    rv.spinTimer--;
                    rv.vx *= 0.92;
                } else {
                    const distDiff = kartState.x - rv.x;
                    let rubberBand = 1.0;
                    if (distDiff > 320) rubberBand = 1.06;
                    else if (distDiff < -280) rubberBand = 0.86;

                    const shrinkMul = rv.shrinkTimer > 0 ? 0.72 : 1.0;
                    const targetSpd = kartState.maxSpeed * rv.baseFactor * rubberBand * shrinkMul;
                    rv.vx += (targetSpd - rv.vx) * 0.06;
                }

                const prevRvY = getKartTerrainY(rv.x);
                rv.x += rv.vx;
                const curRvY = getKartTerrainY(rv.x);

                if (rv.onGround && (curRvY - prevRvY) > 2.6 && rv.vx > 3.8) {
                    rv.vy = -6.8;
                    rv.onGround = false;
                }

                if (!rv.onGround) {
                    rv.vy += trackTheme.gravity;
                    rv.y += rv.vy;
                    rv.angle += 0.05;
                    if (rv.y >= curRvY - 18) {
                        rv.y = curRvY - 18;
                        rv.vy = 0;
                        rv.onGround = true;
                    }
                } else {
                    rv.y = curRvY - 18;
                    rv.angle = getKartTerrainSlope(rv.x);
                }

                // Player vs Rival 2D Kart Bump / Stomp
                if (Math.abs(rv.x - kartState.x) < 34 && Math.abs(rv.y - kartState.y) < 26) {
                    if (kartState.starTimer > 0 || kartState.bulletTimer > 0) {
                        if (rv.spinTimer === 0) {
                            rv.spinTimer = 55;
                            rv.vx *= 0.2;
                            rv.vy = -6.0;
                            rv.onGround = false;
                            sfx.stomp();
                            gameState.score += 300;
                        }
                    } else if (!kartState.onGround && kartState.vy > 0 && kartState.y < rv.y - 6) {
                        kartState.vy = -7.2;
                        rv.spinTimer = 40;
                        rv.vx *= 0.4;
                        sfx.stomp();
                        gameState.score += 300;
                        spawnFloatingText(kartState.x, kartState.y - 28, `🏎️ KART STOMP ${rv.name} +300!`, '#4ade80');
                    }
                }

                if (rv.x > kartState.x) {
                    aheadCount++;
                }
            });

            if (kartState.p2 && kartState.p2.x > kartState.x) {
                aheadCount++;
            }

            // 6. Interpolate & Rank Online Multiplayer Kart Racers!
            if (gameState.multiplayerEnabled) {
                const nowMs = Date.now();
                Object.keys(remotePlayers).forEach(uid => {
                    const rp = remotePlayers[uid];
                    if (nowMs - (rp.updatedAt || 0) > 20000) {
                        delete remotePlayers[uid];
                        return;
                    }
                    rp.renderX = rp.renderX !== undefined ? rp.renderX + (rp.x - rp.renderX) * 0.35 : rp.x;
                    rp.renderY = rp.renderY !== undefined ? rp.renderY + (rp.y - rp.renderY) * 0.35 : rp.y;
                    rp.animTimer = (rp.animTimer || 0) + 1;

                    if (rp.mode === 'mario_kart') {
                        if ((rp.renderX || rp.x) > kartState.x) {
                            aheadCount++;
                        }
                        // Stomp/Bump interaction with online kart peers
                        if (Math.abs((rp.renderX || rp.x) - kartState.x) < 34 && Math.abs((rp.renderY || rp.y) - kartState.y) < 26) {
                            if (!kartState.onGround && kartState.vy > 0 && kartState.y < (rp.renderY || rp.y) - 6) {
                                kartState.vy = -7.5;
                                kartState.boostTimer = Math.max(kartState.boostTimer, 35);
                                sfx.stomp();
                                gameState.score += 250;
                                spawnFloatingText(kartState.x, kartState.y - 28, '🌐 ONLINE DRAFT BOOST +250!', '#38bdf8');
                            }
                        }
                    }
                });
            }

            kartState.rank = aheadCount + 1;
            if (kartState.p2) {
                let p2Ahead = kartState.x > kartState.p2.x ? 1 : 0;
                kartState.rivals.forEach(rv => { if (rv.x > kartState.p2.x) p2Ahead++; });
                kartState.p2.rank = p2Ahead + 1;
            }

            // Update Lap Counter
            const newLap = Math.floor(kartState.x / KART_LAP_LENGTH) + 1;
            if (newLap > kartState.lap && newLap <= KART_TOTAL_LAPS) {
                kartState.lap = newLap;
                sfx.checkpoint();
                gameState.score += 1000;
                spawnFloatingText(
                    kartState.x,
                    kartState.y - 36,
                    kartState.lap === KART_TOTAL_LAPS ? '🔔 FINAL LAP! +1000' : `🏁 LAP ${kartState.lap}/${KART_TOTAL_LAPS} +1000`,
                    '#facc15'
                );
            } else if (newLap > KART_TOTAL_LAPS && !kartState.finished) {
                kartState.finished = true;
                kartState.finishTimer = 0;
                const rankBonus = Math.max(500, (9 - kartState.rank) * 750);
                gameState.score += rankBonus;
                if (kartState.rank === 1) {
                    gameState.kartWins++;
                    unlockAchievement('kartChampion');
                    sfx.stageClear();
                } else {
                    sfx.checkpoint();
                }
                savePlayerProgress();
            }

            // Update Particles & Floating Score Popups
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].y -= 1.0;
                floatingTexts[i].life--;
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            if (gameState.multiplayerEnabled && window.mpBroadcastState) {
                player.x = Math.round(kartState.x);
                player.y = Math.round(kartState.y);
                player.vx = kartState.vx;
                player.vy = kartState.vy;
                player.leanAngle = kartState.angle;
                player.onGround = kartState.onGround;
                window.mpBroadcastState();
            }

            keys.jumpJustPressed = false;
            keys.dashJustPressed = false;
            keys.downJustPressed = false;
        }

        // Draws a 2D Kart with Independent Front & Rear Suspension Struts, Working Coil Springs, Brake Lights & Wheel Spokes
        function draw2DKartSprite(x, y, angle, charId, wheelPhase, isStar, isSpinning, scale = 1.0, frontComp = 0, rearComp = 0, isBraking = false, isReversing = false, isBoosting = false) {
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            ctx.scale(scale, scale);
            ctx.rotate(isSpinning ? (Date.now() * 0.025) : angle);

            const fDrop = Math.max(0, Math.min(7, Math.round(5 - frontComp * 4.5)));
            const rDrop = Math.max(0, Math.min(7, Math.round(5 - rearComp * 4.5)));

            // 1. Draw Working Coil Suspension Springs & Shock Struts between Chassis and Axles!
            const axlePositions = [
                { wx: -12, drop: rDrop },
                { wx: 11,  drop: fDrop }
            ];
            axlePositions.forEach(ax => {
                // Dark shock absorber piston
                ctx.fillStyle = '#334155';
                ctx.fillRect(ax.wx - 2, 4, 4, 6 + ax.drop);
                // Red/Gold suspension coil spring segments
                ctx.fillStyle = isBoosting ? '#22d3ee' : '#ef4444';
                ctx.fillRect(ax.wx - 3, 5, 6, 2);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(ax.wx - 3, 7 + Math.floor(ax.drop * 0.5), 6, 2);
            });

            // 2. Draw Kart Chassis Body (bounces slightly above the wheels based on suspension)
            const kartKey = (isStar && Math.floor(Date.now() / 60) % 2 === 0)
                ? 'star'
                : (SPRITES.karts[charId] ? charId : 'mario');
            const kSpr = SPRITES.karts[kartKey];
            ctx.drawImage(kSpr, -22, -18, 44, 30);

            // 3. Brake Tail-Light & Reverse Backup Light Effects
            if (isBraking) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-24, -4, 4, 7);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
                ctx.fillRect(-28, -6, 8, 11);
            } else if (isReversing) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-24, -3, 4, 5);
            }

            // 4. Draw Independent Front & Rear Tires + Rotating Spokes
            axlePositions.forEach(ax => {
                ctx.save();
                ctx.translate(ax.wx, 9 + ax.drop);
                // Rubber tire ring
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-6, -6, 12, 12);
                ctx.fillStyle = '#334155';
                ctx.fillRect(-4, -4, 8, 8);
                // Rotating wheel rim spokes
                ctx.rotate(wheelPhase);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(-4, -1, 8, 2);
                ctx.fillRect(-1, -4, 2, 8);
                ctx.restore();
            });

            ctx.restore();
        }

        function drawMarioKartScene() {
            const w = canvas.width;
            const h = canvas.height;
            const trackTheme = KART_TRACK_LIST.find(t => t.id === kartState.trackId) || KART_TRACK_LIST[0];
            const camX = Math.floor(kartState.x - Math.min(190, w * 0.26) + (kartState.camLeadOffset || 0));

            // 1. Sky Backdrop & Parallax Scenery
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, trackTheme.skyTop);
            skyGrad.addColorStop(1, trackTheme.skyBot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            if (kartState.trackId === 'rainbow') {
                for (let s = 0; s < 40; s++) {
                    const sx = ((s * 83 - Math.floor(camX * 0.2)) % w + w) % w;
                    const sy = 42 + ((s * 37) % 220);
                    ctx.fillStyle = (s % 3 === 0) ? '#facc15' : (s % 2 === 0 ? '#22d3ee' : '#e879f9');
                    ctx.fillRect(sx, sy, 3, 3);
                }
            } else if (kartState.trackId === 'castle') {
                for (let m = 0; m < 7; m++) {
                    const mx = ((m * 180 - Math.floor(camX * 0.25)) % (w + 180) + (w + 180)) % (w + 180) - 90;
                    ctx.fillStyle = '#1f0812';
                    ctx.beginPath();
                    ctx.moveTo(mx, h);
                    ctx.lineTo(mx + 70, 175);
                    ctx.lineTo(mx + 140, h);
                    ctx.fill();
                }
            } else {
                for (let c = 0; c < 6; c++) {
                    const cx = ((c * 210 - Math.floor(camX * 0.25)) % (w + 120) + (w + 120)) % (w + 120) - 60;
                    ctx.drawImage(SPRITES.cloud, cx, 52 + (c % 3) * 24, 68, 28);
                }
                for (let m = 0; m < 7; m++) {
                    const hx = ((m * 190 - Math.floor(camX * 0.4)) % (w + 190) + (w + 190)) % (w + 190) - 95;
                    ctx.fillStyle = '#15803d';
                    ctx.fillRect(hx, 250, 110, 180);
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(hx + 10, 240, 90, 14);
                }
            }

            // 1B. Roadside scenery. Every track gets its own props so the run
            // reads as a place rather than a coloured strip. Drawn before the
            // road surface, so nothing ever sits on top of the kart.
            {
                const propSpacing = 300;
                const firstProp = Math.floor((camX - 120) / propSpacing);
                const lastProp = Math.floor((camX + w + 120) / propSpacing);
                const flick = Math.floor(Date.now() / 90) % 2 === 0;
                for (let pi = firstProp; pi <= lastProp; pi++) {
                    const worldX = pi * propSpacing + 90;
                    const px = Math.floor(worldX - camX);
                    const py = Math.floor(getKartTerrainY(worldX));
                    if (px < -40 || px > w + 40) continue;

                    if (kartState.trackId === 'castle') {
                        // Wall torch with a flickering flame
                        ctx.fillStyle = '#3f1d1d';
                        ctx.fillRect(px, py - 30, 4, 30);
                        ctx.fillStyle = flick ? '#f97316' : '#facc15';
                        ctx.fillRect(px - 2, py - 38, 8, 9);
                        ctx.fillStyle = '#fef08a';
                        ctx.fillRect(px, py - 36, 4, 5);
                    } else if (kartState.trackId === 'rainbow') {
                        // Floating ring, bobbing gently
                        const bob = Math.sin((Date.now() / 420) + pi) * 5;
                        ctx.strokeStyle = ['#facc15', '#22d3ee', '#e879f9'][Math.abs(pi) % 3];
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(px, py - 46 + bob, 11, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        // Checkered flag on a pole
                        ctx.fillStyle = '#334155';
                        ctx.fillRect(px, py - 34, 3, 34);
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillRect(px + 3, py - 34, 16, 11);
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(px + 3, py - 34, 8, 5);
                        ctx.fillRect(px + 11, py - 29, 8, 6);
                    }
                }
            }

            // 2. Draw Solid Elevated Overpass Bridges (with Support Pillars, Entry/Exit Ramps & Guardrails — Zero Invisible Spaces!)
            const startLapIdx = Math.floor((camX - 200) / KART_LAP_LENGTH);
            const endLapIdx = Math.floor((camX + w + 200) / KART_LAP_LENGTH);

            for (let lapIdx = startLapIdx; lapIdx <= endLapIdx; lapIdx++) {
                const lapBase = lapIdx * KART_LAP_LENGTH;

                kartState.highPlatforms.forEach(hp => {
                    const bridgeStartScreenX = Math.floor(lapBase + hp.x - camX);
                    if (bridgeStartScreenX + hp.w < -60 || bridgeStartScreenX > w + 60) return;

                    // Steel Support Pillars connecting Bridge Deck down to the Main Terrain below
                    for (let postOffset = 28; postOffset < hp.w - 20; postOffset += 95) {
                        const worldPostX = lapBase + hp.x + postOffset;
                        const px = Math.floor(worldPostX - camX);
                        const deckY = Math.floor(getBridgeDeckY(hp, hp.x + postOffset));
                        const groundY = Math.floor(getKartTerrainY(worldPostX));
                        if (groundY > deckY) {
                            ctx.fillStyle = '#334155';
                            ctx.fillRect(px - 6, deckY + 8, 12, groundY - deckY);
                            ctx.fillStyle = '#64748b';
                            ctx.fillRect(px - 2, deckY + 8, 4, groundY - deckY);
                        }
                    }

                    // Draw Continuous Sloped Bridge Deck & Red/Yellow Guardrails
                    const segW = 6;
                    for (let bx = 0; bx < hp.w; bx += segW) {
                        const sx = bridgeStartScreenX + bx;
                        if (sx + segW < 0 || sx > w) continue;
                        const deckY = Math.floor(getBridgeDeckY(hp, hp.x + bx));
                        const alt = Math.floor(bx / 18) % 2 === 0;
                        ctx.fillStyle = alt ? '#f59e0b' : '#d97706';
                        ctx.fillRect(sx, deckY, segW, 12);
                        ctx.fillStyle = alt ? '#ef4444' : '#fef08a';
                        ctx.fillRect(sx, deckY - 3, segW, 3);
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(sx, deckY + 12, segW, 3);
                    }
                });
            }

            // 3. Render Continuous 2D Sloped Track Surface, Curbs, Ramps, Mud & Boost Pads
            const rainbowPalette = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#38bdf8', '#a855f7'];
            const stepPx = 4;

            for (let sx = 0; sx < w + stepPx; sx += stepPx) {
                const worldX = camX + sx;
                const lx = ((worldX % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH;
                const ty = Math.floor(getKartTerrainY(worldX));
                const tileIndex = Math.floor(worldX / 24);
                const alt = tileIndex % 2 === 0;

                const isStartBanner = lx < 80 || lx > KART_LAP_LENGTH - 40;
                const isBoostPad = kartState.boostPads.some(bp => lx >= bp.x && lx <= bp.x + bp.w);
                const isMudPatch = kartState.mudPatches.some(mp => lx >= mp.x && lx <= mp.x + mp.w);
                const isRamp = kartState.ramps.some(r => lx >= r.x && lx <= r.x + r.w);

                // Solid Under-road Earth / Lava / Starlight Cross-Section with Sub-Soil Strata
                ctx.fillStyle = trackTheme.groundFill;
                ctx.fillRect(sx, ty + 20, stepPx, h - ty);
                if (alt && (sx % 16 === 0)) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
                    ctx.fillRect(sx, ty + 28, stepPx, h - ty);
                }

                // Top Curb & Road Asphalt Layer
                if (isStartBanner) {
                    ctx.fillStyle = alt ? '#ffffff' : '#0f172a';
                    ctx.fillRect(sx, ty - 4, stepPx, 24);
                } else if (isBoostPad) {
                    ctx.fillStyle = (Math.floor(Date.now() / 55) + tileIndex) % 2 === 0 ? '#22d3ee' : '#facc15';
                    ctx.fillRect(sx, ty - 4, stepPx, 24);
                } else if (isMudPatch) {
                    ctx.fillStyle = alt ? '#451a03' : '#78350f';
                    ctx.fillRect(sx, ty - 2, stepPx, 22);
                } else if (kartState.trackId === 'rainbow') {
                    ctx.fillStyle = rainbowPalette[Math.abs(tileIndex) % rainbowPalette.length];
                    ctx.fillRect(sx, ty - 4, stepPx, 24);
                } else {
                    ctx.fillStyle = isRamp ? (alt ? '#ef4444' : '#ffffff') : trackTheme.groundTop;
                    ctx.fillRect(sx, ty - 4, stepPx, 6);
                    ctx.fillStyle = trackTheme.roadTop;
                    ctx.fillRect(sx, ty + 2, stepPx, 18);
                    // Centre line: dashes that scroll with the world, with a
                    // faint worn edge so the surface reads as tarmac.
                    const dashOn = Math.floor((sx + camX) / 26) % 2 === 0;
                    if (dashOn) {
                        ctx.fillStyle = trackTheme.roadStripe;
                        ctx.fillRect(sx, ty + 9, stepPx, 3);
                    }
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                    ctx.fillRect(sx, ty + 18, stepPx, 2);
                }
            }

            // Soft vignette so the eye settles on the kart rather than the edges.
            if (kartState.vignetteGrad === undefined || kartState.vignetteW !== w || kartState.vignetteH !== h) {
                const vg = ctx.createRadialGradient(w * 0.5, h * 0.55, Math.min(w, h) * 0.30,
                                                    w * 0.5, h * 0.55, Math.max(w, h) * 0.78);
                vg.addColorStop(0, 'rgba(0,0,0,0)');
                vg.addColorStop(1, 'rgba(0,0,0,0.30)');
                kartState.vignetteGrad = vg;
                kartState.vignetteW = w;
                kartState.vignetteH = h;
            }
            ctx.fillStyle = kartState.vignetteGrad;
            ctx.fillRect(0, 0, w, h);

            // Draw Tire Skid & Burnout Marks on the Road
            kartState.skidMarks.forEach(sm => {
                const sx = Math.floor(sm.x - camX);
                if (sx >= -10 && sx <= w + 10) {
                    ctx.fillStyle = sm.color;
                    ctx.fillRect(sx, Math.floor(sm.y), 6, 3);
                }
            });

            // 4. Draw Start/Finish Archways & Track Objects across all visible laps
            for (let lapIdx = startLapIdx; lapIdx <= endLapIdx; lapIdx++) {
                const lapBase = lapIdx * KART_LAP_LENGTH;
                const finishScreenX = Math.floor(lapBase - camX);
                if (finishScreenX > -120 && finishScreenX < w + 120) {
                    const fy = Math.floor(getKartTerrainY(lapBase));
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(finishScreenX, fy - 110, 8, 110);
                    ctx.fillStyle = '#c84c0c';
                    ctx.fillRect(finishScreenX - 46, fy - 118, 100, 24);
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(finishScreenX - 46, fy - 118, 100, 24);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 8px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('FINISH', finishScreenX + 4, fy - 102);
                    ctx.textAlign = 'left';
                }

                kartState.trackObjects.forEach(obj => {
                    if (obj.cooldown > 0) return;
                    if (obj.type === 'red_shell' || obj.type === 'green_shell') return;
                    const ox = Math.floor(lapBase + obj.x - camX);
                    if (ox < -40 || ox > w + 40) return;
                    const oy = obj.absY !== null && obj.absY !== undefined
                        ? obj.absY
                        : Math.floor(getKartTerrainY(lapBase + obj.x) + (obj.yOff || -20));

                    if (obj.type === 'item_box') {
                        const bob = Math.sin(Date.now() * 0.008 + obj.x) * 4;
                        ctx.drawImage(SPRITES.itemBox, ox - 14, Math.floor(oy - 14 + bob), 28, 28);
                    } else if (obj.type === 'coin') {
                        ctx.drawImage(SPRITES.coin, ox - 10, oy - 12, 20, 24);
                    } else if (obj.type === 'banana') {
                        ctx.drawImage(SPRITES.banana, ox - 12, oy - 12, 24, 24);
                    } else if (obj.type === 'thwomp') {
                        const thwompBob = Math.abs(Math.sin(Date.now() * 0.004 + obj.x)) * 26;
                        ctx.drawImage(SPRITES.hardBlock, ox - 16, Math.floor(oy - 20 - thwompBob), 32, 32);
                    }
                });
            }

            // Draw Active Fired Shells
            kartState.trackObjects.forEach(obj => {
                if (obj.type === 'red_shell' || obj.type === 'green_shell') {
                    const sx = Math.floor(obj.x - camX);
                    if (sx >= -40 && sx <= w + 40) {
                        const spr = obj.type === 'red_shell' ? SPRITES.redShell : SPRITES.shell;
                        ctx.drawImage(spr, sx - 12, Math.floor(obj.y - 10), 24, 20);
                    }
                }
            });

            // 5. Draw AI Rival 2D Karts with working suspension
            kartState.rivals.forEach(rv => {
                const rx = Math.floor(rv.x - camX);
                if (rx < -80 || rx > w + 80) return;
                const ry = Math.floor(rv.y + (rv.laneOffset || 0));
                const scale = rv.shrinkTimer > 0 ? 0.65 : 1.0;

                draw2DKartSprite(rx, ry, rv.angle, rv.id, rv.x * 0.2, false, rv.spinTimer > 0, scale, 0.2, 0.2, false, false, false);

                ctx.textAlign = 'center';
                ctx.font = 'bold 6.5px "Press Start 2P", monospace';
                ctx.fillStyle = '#000000';
                ctx.fillText(rv.name, rx + 1, ry - 25);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(rv.name, rx, ry - 26);
                ctx.textAlign = 'left';
            });

            // 5B. Draw Local Player 2 Kart (in 2P Versus Mode)
            if (kartState.raceMode === '2p_vs' && kartState.p2) {
                const p2 = kartState.p2;
                const p2x = Math.floor(p2.x - camX);
                const p2y = Math.floor(p2.y);
                if (p2x >= -60 && p2x <= w + 60) {
                    draw2DKartSprite(
                        p2x, p2y, p2.angle, p2.id, p2.wheelPhase,
                        false, p2.spinTimer > 0, 1.05,
                        p2.frontCompression || 0.2, p2.rearCompression || 0.2,
                        p2Keys.left && p2.vx > 0.2, p2.vx < -0.1, p2.boostTimer > 0
                    );
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 7px "Press Start 2P", monospace';
                    ctx.fillStyle = '#000000';
                    ctx.fillText(`🟢 ${p2.name}`, p2x + 1, p2y - 26);
                    ctx.fillStyle = '#4ade80';
                    ctx.fillText(`🟢 ${p2.name}`, p2x, p2y - 27);
                    ctx.textAlign = 'left';
                }
            }

            // 5C. Draw Online Multiplayer Peer Karts
            if (gameState.multiplayerEnabled) {
                Object.keys(remotePlayers).forEach((uid, idx) => {
                    const rp = remotePlayers[uid];
                    if (rp.mode !== 'mario_kart') return;
                    const rx = Math.floor((rp.renderX ?? rp.x) - camX);
                    const ry = Math.floor(rp.renderY ?? rp.y);
                    if (rx < -90 || rx > w + 90) return;

                    draw2DKartSprite(
                        rx, ry, rp.leanAngle || 0, rp.character || 'luigi',
                        (rp.renderX || 0) * 0.2, false, false, 1.05, 0.2, 0.2
                    );

                    ctx.textAlign = 'center';
                    ctx.font = 'bold 6.5px "Press Start 2P", monospace';
                    const tag = `🌐P${idx + 2}:${uid}`;
                    ctx.fillStyle = '#000000';
                    ctx.fillText(tag, rx + 1, ry - 26);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText(tag, rx, ry - 27);

            // 6. Draw Player's 2D Kart + Exhaust Flames, Drift Sparks & Suspension Shocks
            const px = Math.floor(kartState.x - camX);

            if (kartState.drifting && kartState.driftCharge > 6) {

            const radarW = Math.min(220, Math.floor(w * 0.36));
