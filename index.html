                });
            }
            const pProg = ((kartState.x % KART_LAP_LENGTH) + KART_LAP_LENGTH) % KART_LAP_LENGTH / KART_LAP_LENGTH;
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(Math.floor(radarX + pProg * (radarW - 6)), radarY - 2, 6, 10);

            // 2P Local Versus Status Banner & Off-screen Distance Indicator
            if (kartState.raceMode === '2p_vs' && kartState.p2) {
                const p2Ord = ordinals[kartState.p2.rank - 1] || `${kartState.p2.rank}TH`;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 6.5px "Press Start 2P", monospace';

            // Helpful Throttle Prompt if Player is Stationary after Countdown
            if (kartState.countdownTimer === 0 && Math.abs(kartState.vx) < 0.2 && !kartState.finished) {
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';

                ctx.strokeStyle = '#4ade80';
                ctx.strokeRect(cx - 175, 122, 350, 24);

            // 4. Lakitu 3-2-1-GO Countdown Overlay
            if (kartState.countdownTimer > 0) {

                for (let l = 1; l <= 3; l++) {
                    ctx.fillStyle = (4 - sec) >= l ? (l === 3 ? '#facc15' : '#ef4444') : '#334155';
                    ctx.fillRect(cx - 65 + (l - 1) * 52, 128, 26, 16);
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Press Start 2P", monospace';
                ctx.fillText(`READY: ${sec}`, cx, 164);
                ctx.fillStyle = '#4ade80';
                ctx.font = '5.8px "Press Start 2P", monospace';
                ctx.fillText('▶: ACCELERATE • ◀: BRAKE / REVERSE', cx, 180);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('NITRO: BOOST • A: HOP/DRIFT • B: ITEM', cx, 193);
            }

            // 4. Lakitu 3-2-1-GO Countdown Overlay
            if (kartState.countdownTimer > 0) {
                const sec = Math.ceil(kartState.countdownTimer / 60);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.fillRect(cx - 164, 120, 328, 84);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 3;
                ctx.strokeRect(cx - 164, 120, 328, 84);

                for (let l = 1; l <= 3; l++) {
                    ctx.fillStyle = (4 - sec) >= l ? (l === 3 ? '#facc15' : '#ef4444') : '#334155';
                    ctx.fillRect(cx - 65 + (l - 1) * 52, 128, 26, 16);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Press Start 2P", monospace';

        // =====================================================================
        // INPUT CORE
        // =====================================================================
        const keys = {
            left: false,
            right: false,
            down: false,
            downJustPressed: false,
            jump: false,
            jumpJustPressed: false,
            dash: false,
            dashJustPressed: false
        };

        const kbState = { left: false, right: false, down: false, jump: false, dash: false };
        const touchState = { left: false, right: false, down: false, jump: false, dash: false };
        const heldKeyCodes = new Set();
        let pointerJumpHeld = false;

        function actionsForCodeId(id) {
            const s = id || '';
            const k = s.toLowerCase();
            return {
                left:  s === 'ArrowLeft'  || s === 'KeyA' || k === 'arrowleft'  || k === 'a',
                right: s === 'ArrowRight' || s === 'KeyD' || k === 'arrowright' || k === 'd',
                down:  s === 'ArrowDown'  || s === 'KeyS' || k === 'arrowdown'  || k === 's',
                jump:  s === 'Space' || s === 'ArrowUp' || s === 'KeyW' || s === 'KeyZ' ||
                       k === ' ' || k === 'spacebar' || k === 'arrowup' || k === 'w' || k === 'z',
                dash:  s === 'KeyX' || s === 'ShiftLeft' || s === 'ShiftRight' || k === 'x' || k === 'shift'
            };
        }

        function syncControlStates() {
            keys.left = kbState.left || touchState.left;
            keys.right = kbState.right || touchState.right;
            keys.down = kbState.down || touchState.down;
            keys.jump = kbState.jump || touchState.jump;
            keys.dash = kbState.dash || touchState.dash;
        }

        function canFireInputEdges() {
            return gameState.menuConfirmCooldown === 0 && !gameState.paused && !gameState.isPortraitBlocked;
        }

        function fireInputEdges(prevJump, prevDown, prevDash) {
            if (!canFireInputEdges()) return;
            if (!prevJump && keys.jump) {
                keys.jumpJustPressed = true;
                if (gameState.phase === 'ready' || gameState.phase === 'gameover' || gameState.phase === 'stage_intro') {
                    triggerInstantFlapOrAction();
                }
            }
            if (!prevDown && keys.down) keys.downJustPressed = true;
            if (!prevDash && keys.dash) keys.dashJustPressed = true;
        }

        function recomputeKeyboardState() {
            const prevJump = keys.jump, prevDown = keys.down, prevDash = keys.dash;
            let left = false, right = false, down = false, jump = false, dash = false;
            heldKeyCodes.forEach((id) => {
                const a = actionsForCodeId(id);
                left = left || a.left;
                right = right || a.right;
                down = down || a.down;
                jump = jump || a.jump;
                dash = dash || a.dash;
            });
            kbState.left = left;
            kbState.right = right;
            kbState.down = down;
            kbState.jump = jump;
            kbState.dash = dash;
            syncControlStates();
            fireInputEdges(prevJump, prevDown, prevDash);
        }

        function setTouchAction(action, isDown) {
            if (!(action in touchState)) return;
            const prevJump = keys.jump, prevDown = keys.down, prevDash = keys.dash;
            touchState[action] = isDown;
            syncControlStates();
            if (isDown) fireInputEdges(prevJump, prevDown, prevDash);
        }

        function clearInputState() {
            heldKeyCodes.clear();
            pointerJumpHeld = false;
            kbState.left = kbState.right = kbState.down = kbState.jump = kbState.dash = false;
            touchState.left = touchState.right = touchState.down = touchState.jump = touchState.dash = false;
            keys.left = false;
            keys.right = false;
            keys.down = false;
            keys.downJustPressed = false;
            keys.jump = false;
            keys.jumpJustPressed = false;
            keys.dash = false;
            keys.dashJustPressed = false;
            document.querySelectorAll('.pixel-btn-pressed').forEach((el) => el.classList.remove('pixel-btn-pressed'));
        }

        window.addEventListener('blur', () => {
            clearInputState();
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInputState();
                // A notification or an app switch must not cost you a life:
                // park the run in the menu instead of letting it play on.
                if (gameState.phase === 'playing' || gameState.phase === 'ready') {
                    toggleStartingUI();
                }
            } else {
                // The browser drops the lock while hidden; clear the stale
                // reference and ask for a fresh one on return.
                screenWakeLock = null;
                requestWakeLock();
            }
        });

        let menuHitBounds = {
            menuY: 190,
            rowStep: 19,
            boxLeft: 200,
            boxRight: 600,
            rowCount: 8
        };

        // Main menu has 8 base rows (including Mario Kart & Character Select), or 9 when a game is paused
        function clampTitleCursor() {
            const maxRows = gameState.previousPhase ? 9 : 8;
            if (gameState.titleCursor > maxRows - 1) gameState.titleCursor = maxRows - 1;
            if (gameState.titleCursor < 0) gameState.titleCursor = 0;
        }

        function checkPortraitOrientation() {
            const w = Math.max(1, window.innerWidth);
            const h = Math.max(1, window.innerHeight);
            // Desktop mode means the player knows what they are doing: never nag
            const mobileMode = (typeof resolvedSiteMode === 'function')
                ? resolvedSiteMode() === 'mobile'
                : true;
            const isMobilePortrait = mobileMode && (h > w * 1.08) && (w < 900);
            const overlay = document.getElementById('nes-rotate-overlay');

            if (!isMobilePortrait) {
                gameState.portraitDismissed = false;
            }

            const shouldBlock = isMobilePortrait && !gameState.portraitDismissed;
            if (shouldBlock !== gameState.isPortraitBlocked) {
                gameState.isPortraitBlocked = shouldBlock;
                clearInputState();
            }

            if (overlay) {
                overlay.classList.toggle('hidden', !shouldBlock);
            }
        }

        function resizeCanvas() {
            const w = Math.max(1, window.innerWidth);
            const h = Math.max(1, window.innerHeight);
            const aspect = w / h;
            canvas.height = 450;
            canvas.width = Math.max(290, Math.min(1100, Math.round(450 * aspect)));
            checkPortraitOrientation();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 80));
        resizeCanvas();

        // --- 4. PLAYER CLASS (WITH CLASSIC + 2.0 + FLAPPY + 2D KART MECHANICS) ---
        class Player {
            constructor() {
                this.reset(120, 210, false);
            }
            reset(x, y, keepPower = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                if (!keepPower) {
                    this.power = 'small';
                    this.inKart = false;
                }
                this.w = 26;
                this.h = this.power === 'small' ? 30 : 40;
                this.facing = 1;
                this.leanAngle = 0;
                this.onGround = false;
                this.coyoteTimer = 0;
                this.invincibleTimer = 0;
                this.starTimer = 0;
                this.wallSliding = 0;
                this.canAirDash = true;
                this.dashTimer = 0;
                this.groundPounding = false;
                this.fireCooldown = 0;
                this.animTimer = 0;
                this.flapAnimTimer = 0;
                this.dead = false;
                this.trail = [];
            }
            setPower(newPower) {
                const oldH = this.h;
                this.power = newPower;
                this.h = this.power === 'small' ? 30 : 40;
                this.y -= (this.h - oldH);
                updateHUD();
            }
        }

        const player = new Player();

        // --- 5. WORLD ENTITIES & HELPERS ---
        let blocks = [];
        let pipes = [];
        let enemies = [];
        let items = [];
        let fireballs = [];
        let particles = [];
        let floatingTexts = [];
        let movingPlatforms = [];
        let skyRings = [];
        let clouds = [];
        let hills = [];
        let cityBuildings = [];
        let flagpole = null;
        let axeObj = null;
        let checkpointFlag = null;
        let remotePlayers = {}; // Synced via Firebase Firestore ONLY when Multiplayer is enabled

        function startDimensionalWarp(targetMode) {
            sfx.gemWarp();
            clearInputState();
            gameState.phase = 'warping';
            gameState.warpTimer = 0;
            gameState.warpTargetMode = targetMode;
            gameState.shakeTimer = 25;
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#22d3ee', 20, 6);
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#e879f9', 16, 5);
        }

        function rectOverlap(a, b) {
            return (
                a.x < b.x + b.w &&
                a.x + a.w > b.x &&
                a.y < b.y + b.h &&
                a.y + a.h > b.y
            );
        }

        function spawnFloatingText(x, y, text, color = '#fef08a') {
            floatingTexts.push({ x, y, text: cleanLabel(text), color, life: 42 });
        }

        function spawnParticles(x, y, color, count = 8, speed = 4) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * (1.5 + Math.random() * speed),
                    vy: Math.sin(angle) * (1.5 + Math.random() * speed) - 2,
                    size: 4 + Math.random() * 4,
                    color,
                    life: 25 + Math.floor(Math.random() * 15)
                });
            }
        }

        // --- 6. IMPROVISED FLAPPY × MARIO COLLAB PROCEDURAL GAUNTLET GENERATOR ---
        function spawnFlappyChunk(chunkX, index) {
            const groundY = 12 * TILE; // 384

            // Ground tiles under this chunk
            const startCol = Math.floor(chunkX / TILE);
            for (let gx = startCol; gx < startCol + 9; gx++) {
                blocks.push({ x: gx * TILE, y: groundY, w: TILE, h: TILE * 2, type: 'ground' });
            }

            // Gap height and vertical position
            const gapH = Math.max(106, 138 - Math.floor(index * 1.05));
            const minGapY = 66;
            const maxGapY = groundY - gapH - 66;
            const gapY = Math.floor(minGapY + ((Math.sin(index * 1.7 + Math.random() * 2) * 0.5 + 0.5) * (maxGapY - minGapY)));

            // Starting from Pipe #4, every 3rd pipe pair gently oscillates up and down!
            const isMovingPipe = index >= 4 && (index % 3 === 0);
            const oscSpeed = isMovingPipe ? (0.032 + Math.min(0.025, index * 0.001)) : 0;
            const oscAmp = isMovingPipe ? 22 : 0;

            // Top Inverted Warp Pipe (hanging from top of screen)
            const topPipe = {
                x: chunkX,
                y: 0,
                baseH: gapY,
                w: TILE * 2,
                h: gapY,
                inverted: true,
                flappyGate: true,
                passed: false,
                oscillate: isMovingPipe,
                oscPhase: index * 0.9,
                oscSpeed,
                oscAmp
            };

            // Bottom Classic Warp Pipe (rising from ground)
            const bottomPipe = {
                x: chunkX,
                y: gapY + gapH,
                baseY: gapY + gapH,
                groundY,
                w: TILE * 2,
                h: groundY - (gapY + gapH),
                inverted: false,
                flappyGate: false,
                oscillate: isMovingPipe,
                oscPhase: index * 0.9,
                oscSpeed,
                oscAmp
            };

            pipes.push(topPipe, bottomPipe);

            // Coin or Golden Sky Ring inside the pipe gap
            if (index % 4 === 0) {
                skyRings.push({
                    x: chunkX + 20,
                    y: gapY + Math.floor(gapH / 2) - 22,
                    w: 24,
                    h: 44,
                    collected: false,
                    phase: index
                });
            } else {
                items.push({
                    x: chunkX + 22,
                    y: gapY + Math.floor(gapH / 2) - 12,
                    w: 20,
                    h: 24,
                    vx: 0,
                    vy: 0,
                    type: 'static_coin'
                });
            }

            // Between pipes: Question blocks, Bouncy Note Blocks, Sky Rings, Power-ups & Flying Enemies!
            const midX = chunkX + 140;
            const midY = Math.max(96, Math.min(260, gapY + 20));

            if (index % 5 === 0) {
                // Every 5th pipe in Flappy's Universe spawns a Return / Bonus Dimensional Gem Block!
                blocks.push({
                    x: midX,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'gem_block',
                    content: 'return_gem',
                    hit: false,
                    bounceY: 0
                });
            } else if (index % 4 === 2) {
                // Improvised Bouncy Musical Note Block + Golden Sky Ring above it!
                blocks.push({
                    x: midX,
                    y: Math.min(280, midY + 34),
                    w: TILE,
                    h: TILE,
                    type: 'note_block',
                    content: 'coin',
                    hit: false,
                    bounceY: 0
                });
                skyRings.push({
                    x: midX + 4,
                    y: Math.max(64, midY - 42),
                    w: 24,
                    h: 44,
                    collected: false,
                    phase: index * 1.3
                });
            } else if (index % 3 === 1) {
                const reward = (index % 9 === 0) ? 'star' : (index % 7 === 0 ? '1up' : 'power');
                blocks.push({
                    x: midX,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'question',
                    content: reward,
                    hit: false,
                    bounceY: 0
                });
                blocks.push({
                    x: midX + TILE,
                    y: midY,
                    w: TILE,
                    h: TILE,
                    type: 'brick',
                    content: null,
                    coinsLeft: 2,
                    hit: false,
                    bounceY: 0
                });
            } else {
                for (let c = 0; c < 3; c++) {
                    items.push({
                        x: midX - 16 + c * 28,
                        y: midY - Math.sin((c / 2) * Math.PI) * 24,
                        w: 20,
                        h: 24,
                        vx: 0,
                        vy: 0,
                        type: 'static_coin'
                    });
                }
            }

            // Flying Paragoomba, Parakoopa, or Mini Mecha-Drone Wave
            if (index >= 10 && index % 10 === 0) {
                const drone = createEnemy('mecha_flappy', midX + 50, Math.max(90, Math.min(240, gapY + 20)));
                drone.hp = 2; // Mini-boss drone in Flappy Universe
                enemies.push(drone);
            } else if (index >= 2 && index % 2 === 0) {
                enemies.push({
                    type: index % 4 === 0 ? 'koopa' : 'goomba',
                    x: midX + 36,
                    y: Math.max(80, Math.min(280, gapY + 30)),
                    baseY: Math.max(80, Math.min(280, gapY + 30)),
                    w: 30,
                    h: 30,
                    vx: -0.9,
                    vy: 0,
                    flying: true,
                    flyPhase: index,
                    state: 'walk',
                    squashTimer: 0,
                    dead: false
                });
            }
        }

        function createEnemy(type, x, y) {
            return {
                type,
                x,
                y,
                baseY: y,
                w: type === 'mecha_flappy' ? 60 : (type === 'bowser' ? 48 : 30),
                h: type === 'mecha_flappy' ? 48 : (type === 'bowser' ? 48 : (type === 'bullet_bill' ? 24 : 30)),
                vx: type === 'bullet_bill' ? -4.8 : (type === 'bowser' || type === 'mecha_flappy' ? -1.4 : -1.3),
                vy: 0,
                flying: type === 'bullet_bill' || type === 'mecha_flappy',
                flyPhase: 0,
                state: 'walk',
                squashTimer: 0,
                timer: 0,
                hp: type === 'mecha_flappy' ? 6 : (type === 'bowser' ? 5 : 1),
                dead: false
            };
        }
